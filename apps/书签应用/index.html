<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>分类书签九宫格 · 增强版</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#333;padding:10px;}
h1{text-align:center;font-size:20px;margin-bottom:10px;}

/* 顶部工具栏 —— 新布局 */
.toolbar{
  display:flex;gap:8px;flex-wrap:wrap;
  justify-content:center;margin-bottom:10px;align-items:center;
}
.toolbar button{
  padding:6px 12px;font-size:14px;border:none;
  border-radius:6px;color:#fff;background:#007bff;cursor:pointer;
  display:inline-flex;align-items:center;gap:4px;
  transition:background .15s;
}
.toolbar button:hover{opacity:0.85;}
.toolbar .gitee-btn{background:#2ea44f;}
.toolbar .cmd-btn{background:#6f42c1;}
.toolbar .refresh-btn{background:#6c757d;}
.toolbar .secondary{background:#6c757d;}
.toolbar .danger{background:#dc3545;}
.toolbar input[type=file]{display:none;}

.categories-container{display:flex;flex-direction:column;gap:20px;}
.category-block{background:transparent;}
.category-block.dragging{opacity:0.4;}
.category-header{display:flex;align-items:center;margin-bottom:6px;padding:0 4px;}
.category-name{font-size:16px;font-weight:600;margin-right:8px;}
.category-actions{margin-left:auto;display:flex;gap:4px;}
.category-actions button{padding:2px 6px;font-size:11px;border:none;border-radius:4px;color:#fff;background:#6c757d;}
.category-actions .edit-cat{background:#007bff;}
.category-actions .del-cat{background:#dc3545;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.tile{background:#fff;border-radius:8px;padding:8px 4px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.tile.dragging{opacity:0.4;}
.tile-logo{width:32px;height:32px;border-radius:8px;background:#ddd;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;margin-bottom:4px;font-size:16px;overflow:hidden;}
.tile-logo img{width:100%;height:100%;object-fit:cover;}
.tile-title{font-size:12px;text-align:center;max-height:32px;overflow:hidden;}
.tile-actions{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:.2s;}
.tile:hover .tile-actions,.tile.show-actions .tile-actions{opacity:1;}
.tile-actions button{padding:2px 4px;font-size:10px;border:none;border-radius:3px;background:rgba(0,0,0,.5);color:#fff;}

/* ===== 通用弹窗 ===== */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.modal{
  background:#fff;border-radius:12px;padding:18px;width:92%;
  max-width:420px;box-shadow:0 8px 30px rgba(0,0,0,.25);
  max-height:85vh;display:flex;flex-direction:column;
}
.modal h2{font-size:17px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
.modal .close-x{cursor:pointer;font-size:18px;background:none;border:none;color:#888;padding:0 4px;}
.modal label{font-size:13px;margin:6px 0 2px;display:block;color:#555;}
.modal input[type=text],.modal input[type=password]{
  width:100%;padding:7px 10px;font-size:14px;
  border:1px solid #ccc;border-radius:6px;outline:none;
}
.modal input:focus{border-color:#007bff;}
.modal-buttons{
  margin-top:14px;display:flex;justify-content:flex-end;gap:8px;
  flex-wrap:wrap;
}
.modal-buttons button{
  padding:7px 14px;border:none;border-radius:6px;color:#fff;font-size:14px;cursor:pointer;
}
.modal-buttons .cancel{background:#6c757d;}
.modal-buttons .ok{background:#007bff;}
.modal-buttons .danger{background:#dc3545;}

/* 分类选择下拉 */
.category-select{position:relative;display:flex;align-items:center;}
.category-select input{flex:1;}
.dropdown-btn{margin-left:6px;padding:5px 9px;font-size:14px;border:1px solid #ccc;background:#eee;border-radius:6px;cursor:pointer;}
.dropdown-menu{position:absolute;top:40px;left:0;right:0;background:#fff;border:1px solid #ccc;border-radius:6px;max-height:200px;overflow-y:auto;display:none;z-index:2000;box-shadow:0 4px 12px rgba(0,0,0,.15);}
.dropdown-menu div{padding:8px 12px;cursor:pointer;font-size:14px;}
.dropdown-menu div:hover{background:#f0f0f0;}

/* ===== Gitee 同步弹窗 ===== */
.gitee-modal .body-scroll{overflow-y:auto;flex:1;margin:0 -4px;padding:0 4px;}
.info-bar{
  display:flex;flex-wrap:wrap;gap:4px 12px;
  background:#f8f9fa;border-radius:8px;padding:8px 12px;
  font-size:12.5px;color:#555;margin-bottom:10px;
}
.info-bar span b{color:#222;}
.hint-bar{
  font-size:11.5px;color:#888;line-height:1.6;
  background:#fcfcfc;border-left:3px solid #ddd;
  padding:6px 10px;border-radius:4px;margin-bottom:10px;
}
.status-bar{
  font-size:13px;padding:8px 12px;border-radius:6px;
  background:#e6f4ea;color:#1e7e34;margin-bottom:10px;
  display:none;
}
.status-bar.error{background:#fdecea;color:#c62828;}
.status-bar.info{background:#e8f0fe;color:#1a56db;}
.file-list{
  display:none;max-height:200px;overflow-y:auto;
  border:1px solid #eee;border-radius:8px;margin-bottom:10px;
}
.file-list .file-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:10px 12px;border-bottom:1px solid #f0f0f0;
  cursor:pointer;font-size:13px;
}
.file-list .file-row:last-child{border-bottom:none;}
.file-list .file-row:hover{background:#f5f7ff;}
.file-list .file-name{font-weight:500;color:#222;word-break:break-all;}
.file-list .file-size{color:#999;font-size:12px;flex-shrink:0;margin-left:10px;}
.gitee-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px;}
.gitee-actions button{
  flex:1;padding:10px 0;border:none;border-radius:8px;
  font-size:14px;color:#fff;cursor:pointer;min-width:100px;
}
.btn-sync{background:#2ea44f;}
.btn-upload{background:#007bff;}
.btn-download{background:#6f42c1;}
.gitee-actions button:disabled{opacity:.55;cursor:not-allowed;}

/* 下载选择小窗（内嵌） */
.dl-picker{
  display:none;position:absolute;inset:0;background:rgba(0,0,0,.35);
  border-radius:12px;align-items:center;justify-content:center;
  padding:16px;
}
.dl-picker .dl-box{
  background:#fff;border-radius:12px;width:100%;max-width:320px;
  padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.3);
}
.dl-picker h3{font-size:14px;margin-bottom:4px;word-break:break-all;}
.dl-picker .dl-size{font-size:12px;color:#888;margin-bottom:12px;}
.dl-picker button{
  width:100%;padding:10px;border:none;border-radius:8px;
  font-size:14px;cursor:pointer;margin-bottom:8px;
}
.dl-picker .dl-phone{background:#007bff;color:#fff;}
.dl-picker .dl-import{background:#e9ecef;color:#333;}
.dl-picker .dl-cancel{background:transparent;color:#888;margin-bottom:0;}

/* ===== 命令面板 ===== */
.cmd-modal{
  max-width:520px;padding:0;overflow:hidden;
}
.cmd-input-wrap{padding:14px 16px 10px;border-bottom:1px solid #eee;}
.cmd-input-wrap input{
  width:100%;padding:10px 12px;font-size:15px;
  border:1px solid #ddd;border-radius:10px;outline:none;
  background:#f7f7f9;
}
.cmd-input-wrap input:focus{border-color:#6f42c1;background:#fff;}
.cmd-list{max-height:340px;overflow-y:auto;padding:6px;}
.cmd-item{
  display:flex;flex-direction:column;gap:2px;
  padding:10px 14px;border-radius:10px;cursor:pointer;
  transition:background .1s;
}
.cmd-item .cmd-label{font-size:14.5px;font-weight:500;color:#222;}
.cmd-item .cmd-desc{font-size:12px;color:#999;}
.cmd-item:hover,.cmd-item.sel{background:#f2effc;}
.cmd-item.danger:hover,.cmd-item.danger.sel{background:#fdecea;}
.cmd-item.danger .cmd-label{color:#c62828;}
.cmd-empty{
  text-align:center;padding:30px 0;color:#aaa;font-size:14px;
}

/* ===== Gitee 设置弹窗（带锁） ===== */
.setting-modal .lock-overlay{
  position:absolute;inset:0;background:rgba(255,255,255,.82);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:12px;z-index:5;gap:10px;
}
.setting-modal .lock-overlay span{font-size:15px;color:#666;}
.setting-modal .lock-overlay button{
  padding:8px 24px;border:none;border-radius:8px;
  background:#007bff;color:#fff;font-size:14px;cursor:pointer;
}
.setting-modal .fields{position:relative;}
.setting-modal .fields.locked input{opacity:.55;}
.setting-modal .pw-wrap{position:relative;}
.setting-modal .pw-wrap input{padding-right:38px;}
.setting-modal .eye-btn{
  position:absolute;right:6px;top:50%;transform:translateY(-50%);
  background:none;border:none;font-size:16px;cursor:pointer;color:#888;
}
.setting-modal .tip{
  font-size:11.5px;color:#999;line-height:1.6;margin-top:10px;
  background:#f9f9f9;padding:8px 10px;border-radius:6px;
}

/* 通用 */
.hidden{display:none!important;}
</style>
<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</head>
<body>

<h1>分类书签九宫格</h1>

<!-- 顶部工具栏：☰  ⚙️ Gitee  ⌘  🔄 -->
<div class="toolbar">
  <button id="addBookmarkBtn" class="secondary">＋ 书签</button>
  <button id="giteeSyncBtn" class="gitee-btn">⚙️ Gitee</button>
  <button id="cmdPanelBtn" class="cmd-btn">⌘</button>
  <button id="refreshBtn" class="refresh-btn" title="刷新页面">🔄</button>
  <!-- 隐藏的导入按钮 / 导出 / 清空，由命令面板调用 -->
  <input type="file" id="importFile" accept="application/json" />
</div>

<div id="categoriesContainer" class="categories-container"></div>

<!-- ========== 原有弹窗（添加/编辑书签、编辑分类、说明） ========== -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle">添加书签</h2>
    <label>分类：</label>
    <div class="category-select">
      <input type="text" id="inputCategory" placeholder="选择或输入分类（留空为默认）" />
      <button id="categoryDropdownBtn" class="dropdown-btn">▼</button>
      <div id="categoryDropdownMenu" class="dropdown-menu"></div>
    </div>
    <label>标题（可选）：</label>
    <input type="text" id="inputTitle" placeholder="例如：B站" />
    <label>网址：</label>
    <input type="text" id="inputUrl" placeholder="https://..." />
    <label>说明（可选）：</label>
    <input type="text" id="inputDesc" placeholder="例如：常用视频网站" />
    <div class="modal-buttons">
      <button class="cancel" id="cancelModal">取消</button>
      <button class="ok" id="okModal">确定</button>
    </div>
  </div>
</div>

<div id="categoryModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="categoryModalTitle">编辑分类</h2>
    <label>分类名称：</label>
    <input type="text" id="inputCategoryName" />
    <div class="modal-buttons">
      <button class="cancel" id="cancelCategoryModal">取消</button>
      <button class="ok" id="okCategoryModal">确定</button>
    </div>
  </div>
</div>

<div id="descModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2>书签说明</h2>
    <p id="descContent" style="font-size:14px;line-height:1.6;"></p>
    <div class="modal-buttons">
      <button class="cancel" id="closeDescModal">关闭</button>
      <button class="ok" id="visitLinkBtn">继续访问</button>
    </div>
  </div>
</div>

<!-- ========== Gitee 同步弹窗 ========== -->
<div id="giteeSyncBackdrop" class="modal-backdrop">
  <div class="modal gitee-modal" style="position:relative;">
    <h2>
      <span>Gitee 同步</span>
      <button class="close-x" id="closeGiteeSync">✕</button>
    </h2>
    <div class="body-scroll">
      <!-- ① 账号信息条 -->
      <div class="info-bar" id="giteeInfoBar">
        <span>账号：<b id="giOwner">--</b></span>
        <span>仓库：<b id="giRepo">--</b></span>
        <span>主文件：<b id="giFile">--</b></span>
      </div>
      <!-- ② 功能提示条 -->
      <div class="hint-bar">
        ☁️ 一键同步：智能比较本地与远端，自动选择上传或下载<br>
        ⬆ 上传：按日期自动编号备份（前缀-2025-01-01T1.json）<br>
        ⬇ 下载：列出远端 .json 文件，可下载到手机或导入资料库
      </div>
      <!-- ③ 状态消息条 -->
      <div class="status-bar" id="giteeStatusBar"></div>
      <!-- ④ 远端文件列表（默认隐藏） -->
      <div class="file-list" id="giteeFileList"></div>
    </div>
    <!-- 底部按钮区 -->
    <div class="gitee-actions">
      <button id="giteeSyncAction" class="btn-sync">☁️ 一键同步</button>
      <button id="giteeUploadAction" class="btn-upload">⬆ 上传</button>
      <button id="giteeDownloadAction" class="btn-download">⬇ 下载</button>
    </div>

    <!-- 下载选择小窗（内嵌） -->
    <div class="dl-picker" id="dlPicker">
      <div class="dl-box">
        <h3 id="dlFileName">--</h3>
        <div class="dl-size" id="dlFileSize">--</div>
        <button class="dl-phone" id="dlToPhone">📱 下载到手机</button>
        <button class="dl-import" id="dlImport">📥 导入资料库</button>
        <button class="dl-cancel" id="dlCancel">取消</button>
      </div>
    </div>
  </div>
</div>

<!-- ========== 命令面板 ========== -->
<div id="cmdBackdrop" class="modal-backdrop">
  <div class="modal cmd-modal">
    <div class="cmd-input-wrap">
      <input type="text" id="cmdInput" placeholder="输入命令或搜索关键词…" autocomplete="off" />
    </div>
    <div class="cmd-list" id="cmdList"></div>
  </div>
</div>

<!-- ========== Gitee 设置弹窗（被命令面板调用） ========== -->
<div id="giteeSetBackdrop" class="modal-backdrop">
  <div class="modal setting-modal" style="position:relative;">
    <h2>
      <span>Gitee 设置</span>
      <button class="close-x" id="closeGiteeSet">✕</button>
    </h2>
    <div class="fields locked" id="giteeSetFields" style="position:relative;">
      <label>Gitee 用户名（owner）</label>
      <input type="text" id="setOwner" placeholder="例如：zhangsan" />
      <label>私人令牌（token）</label>
      <div class="pw-wrap">
        <input type="password" id="setToken" placeholder="在 Gitee 设置→安全设置→私人令牌 生成" />
        <button class="eye-btn" id="toggleToken">👁</button>
      </div>
      <label>仓库名（repo）</label>
      <input type="text" id="setRepo" placeholder="例如：my-notes" />
      <label>文件路径（filePath）</label>
      <input type="text" id="setFilePath" placeholder="我的数据库/资料库.json" />
      <div class="tip">
        在 gitee.com 设置 → 安全设置 → 私人令牌 生成令牌，建议勾选 projects 权限；仓库建议设为私有。
      </div>
      <!-- 锁遮罩 -->
      <div class="lock-overlay" id="lockOverlay">
        <span>🔒 设置已锁定</span>
        <button id="unlockBtn">● 开启</button>
      </div>
    </div>
    <div class="modal-buttons" style="margin-top:10px;">
      <button class="cancel" id="cancelGiteeSet">取消</button>
      <button class="ok" id="saveGiteeSet">保存设置</button>
    </div>
  </div>
</div>

<script>
(function(){
/* ======================= 原书签核心逻辑（保留并适配） ======================= */
const STORAGE_KEY="catBookmarks_v4";
let categories=[];
let editingCatIndex=null;
let editingBookmark={catIndex:null,bookmarkIndex:null};

const container=document.getElementById("categoriesContainer");
const addBookmarkBtn=document.getElementById("addBookmarkBtn");
const importFile=document.getElementById("importFile");

const modalBackdrop=document.getElementById("modalBackdrop");
const modalTitle=document.getElementById("modalTitle");
const inputCategory=document.getElementById("inputCategory");
const inputTitle=document.getElementById("inputTitle");
const inputUrl=document.getElementById("inputUrl");
const inputDesc=document.getElementById("inputDesc");
const cancelModal=document.getElementById("cancelModal");
const okModal=document.getElementById("okModal");

const catModalBackdrop=document.getElementById("categoryModalBackdrop");
const inputCategoryName=document.getElementById("inputCategoryName");
const cancelCategoryModal=document.getElementById("cancelCategoryModal");
const okCategoryModal=document.getElementById("okCategoryModal");

const dropdownBtn=document.getElementById("categoryDropdownBtn");
const dropdownMenu=document.getElementById("categoryDropdownMenu");

const descModalBackdrop=document.getElementById("descModalBackdrop");
const descContent=document.getElementById("descContent");
const closeDescModal=document.getElementById("closeDescModal");
const visitLinkBtn=document.getElementById("visitLinkBtn");
let currentVisitUrl="";

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function getInitial(t){
  t=(t||"?").trim();
  return t?t[0].toUpperCase():"?";
}
function getColor(t){
  t=t||"?";
  let h=0;
  for(let i=0;i<t.length;i++)h=t.charCodeAt(i)+((h<<5)-h);
  return`hsl(${Math.abs(h)%360},60%,55%)`;
}
function normalizeUrl(u){
  u=u.trim();
  return/^https?:\/\//i.test(u)?u:"https://"+u;
}
function favicon(u){
  try{
    const host=new URL(u).hostname;
    return`https://www.google.com/s2/favicons?domain=${host}&sz=64`;
  }catch(e){return"";}
}

dropdownBtn.onclick=e=>{
  e.stopPropagation();
  renderDropdown();
  dropdownMenu.style.display=
    dropdownMenu.style.display==="block"?"none":"block";
};
function renderDropdown(){
  dropdownMenu.innerHTML="";
  categories.forEach(c=>{
    const d=document.createElement("div");
    d.textContent=c.name;
    d.onclick=()=>{
      inputCategory.value=c.name;
      dropdownMenu.style.display="none";
    };
    dropdownMenu.appendChild(d);
  });
}
document.onclick=()=>dropdownMenu.style.display="none";

function render(){
  container.innerHTML="";

  categories.forEach((cat,ci)=>{
    const block=document.createElement("div");
    block.className="category-block";
    block.draggable=true;
    block.dataset.index=ci;

    block.addEventListener("dragstart",e=>{
      block.classList.add("dragging");
      e.dataTransfer.setData("text/plain",ci);
    });
    block.addEventListener("dragend",()=>{
      block.classList.remove("dragging");
    });

    block.addEventListener("dragover",e=>{
      e.preventDefault();
      const dragging=document.querySelector(".category-block.dragging");
      if(!dragging)return;
      const blocks=[...container.children];
      const currentIndex=blocks.indexOf(block);
      const draggingIndex=blocks.indexOf(dragging);
      if(currentIndex!==draggingIndex){
        if(currentIndex>draggingIndex){
          container.insertBefore(dragging,block.nextSibling);
        }else{
          container.insertBefore(dragging,block);
        }
      }
    });

    block.addEventListener("drop",()=>{
      const newOrder=[...container.children].map(b=>{
        return categories[b.dataset.index];
      });
      categories=newOrder;
      save();
      render();
    });

    const header=document.createElement("div");
    header.className="category-header";
    header.innerHTML=`
      <span class="category-name">${escapeHtml(cat.name)}</span>
      <div class="category-actions">
        <button class="edit-cat" data-i="${ci}">改</button>
        <button class="del-cat" data-i="${ci}">删</button>
      </div>
    `;

    const grid=document.createElement("div");
    grid.className="grid";

    cat.bookmarks.forEach((b,bi)=>{
      grid.appendChild(createTile(ci,bi,b));
    });

    block.appendChild(header);
    block.appendChild(grid);
    container.appendChild(block);
  });

  document.querySelectorAll(".edit-cat").forEach(btn=>{
    btn.onclick=()=>openEditCategory(+btn.dataset.i);
  });
  document.querySelectorAll(".del-cat").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i;
      if(confirm(`删除分类“${categories[i].name}”？`)){
        categories.splice(i,1);
        save();render();
      }
    };
  });
}

function createTile(ci,bi,b){
  const t=document.createElement("div");
  t.className="tile";
  t.draggable=true;
  t.dataset.ci=ci;
  t.dataset.bi=bi;

  t.addEventListener("dragstart",()=>{
    t.classList.add("dragging");
  });
  t.addEventListener("dragend",()=>{
    t.classList.remove("dragging");
  });

  t.addEventListener("dragover",e=>{
    e.preventDefault();
    const dragging=document.querySelector(".tile.dragging");
    if(!dragging)return;

    const grid=t.parentElement;
    const tiles=[...grid.children];
    const currentIndex=tiles.indexOf(t);
    const draggingIndex=tiles.indexOf(dragging);

    if(currentIndex!==draggingIndex){
      if(currentIndex>draggingIndex){
        grid.insertBefore(dragging,t.nextSibling);
      }else{
        grid.insertBefore(dragging,t);
      }
    }
  });

  t.addEventListener("drop",()=>{
    const grid=t.parentElement;
    const newOrder=[...grid.children].map(tile=>{
      const ci=tile.dataset.ci;
      const bi=tile.dataset.bi;
      return categories[ci].bookmarks[bi];
    });
    categories[ci].bookmarks=newOrder;
    save();
    render();
  });

  t.onclick=e=>{

/* ======================= Gitee 同步模块 ======================= */
const GITEE_CFG_KEY = "my_notes_gitee_cfg";
const EMPTY_PLACEHOLDER = { notes: [] };

/** 读取配置 */
function getSyncCfg() {
  try {
    const raw = localStorage.getItem(GITEE_CFG_KEY);
    return raw ? JSON.parse(raw) : { owner:'', token:'', repo:'', filePath:'我的数据库/资料库.json' };
  } catch(e) {
    return { owner:'', token:'', repo:'', filePath:'我的数据库/资料库.json' };
  }
}
function saveSyncCfg(cfg) {
  localStorage.setItem(GITEE_CFG_KEY, JSON.stringify(cfg));
}

/** Gitee API 基础 */
function encodeGiteePath(path) {
  return path.split('/').map(encodeURIComponent).join('/');
}
async function giteeGet(path) {
  const cfg = getSyncCfg();
  const url = `https://gitee.com/api/v5/repos/${cfg.owner}/${cfg.repo}/contents/${encodeGiteePath(path)}?access_token=${cfg.token}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text() || `HTTP ${res.status}`);
  return res.json();
}
async function giteePut(path, contentBase64, message) {
  const cfg = getSyncCfg();
  const url = `https://gitee.com/api/v5/repos/${cfg.owner}/${cfg.repo}/contents/${encodeGiteePath(path)}`;
  const body = {
    access_token: cfg.token,
    content: contentBase64,
    message: message || 'sync update',
    branch: 'master'
  };
  // 如果已存在文件，需要 sha
  try {
    const existing = await giteeGet(path);
    if (existing && existing.sha) body.sha = existing.sha;
  } catch(e) { /* 文件不存在则新建 */ }
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(await res.text() || `HTTP ${res.status}`);
  return res.json();
}
async function giteeListDir(path) {
  const cfg = getSyncCfg();
  const url = `https://gitee.com/api/v5/repos/${cfg.owner}/${cfg.repo}/contents/${encodeGiteePath(path)}?access_token=${cfg.token}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(await res.text() || `HTTP ${res.status}`);
  const list = await res.json();
  return Array.isArray(list) ? list : [];
}

/** 工具函数 */
function sanitizeNote(note) {
  const n = { ...note };
  delete n.history; // 去掉历史
  return n;
}
function dedupeNotesByTitle(notes) {
  const seen = new Set();
  return notes.filter(n => {
    const t = (n.title || '').trim();
    if (!t) return true;
    if (seen.has(t)) return false;
    seen.add(t);
    return true;
  });
}
function buildSyncPayload(notes) {
  const cleaned = dedupeNotesByTitle(notes).map(sanitizeNote);
  return { notes: cleaned };
}

// ---------- 一键同步 ----------
giteeSyncAction.onclick = async () => {
  const cfg = getSyncCfg();
  if (!cfg.owner || !cfg.token || !cfg.repo) {
    setGiteeStatus('❌ 请先在「⚙️ Gitee 设置」中配置账号、令牌和仓库', 'error');
    return;
  }
  giteeSyncAction.disabled = true;
  try {
    setGiteeStatus('⏳ 正在读取远端主文件…', 'info');
    let remoteNotes = [];
    try {
      const fileData = await giteeGet(cfg.filePath);
      const content = atob(fileData.content.replace(/\s/g, ''));
      const remoteJson = JSON.parse(content);
      remoteNotes = remoteJson.notes || [];
    } catch(e) {
      // 远端文件不存在或无效
      remoteNotes = [];
    }

    const localPayload = buildSyncPayload(categories);
    const localNotes = localPayload.notes;

    // 远端无效或空 → 直接上传
    if (!remoteNotes || remoteNotes.length === 0) {
      setGiteeStatus('⏳ 远端无有效数据，正在上传本地数据…', 'info');
      const base64 = btoa(unescape(encodeURIComponent(JSON.stringify(localPayload))));
      await giteePut(cfg.filePath, base64, 'sync: 初始化上传');
      setGiteeStatus('✅ 已上传本地数据到远端', '');
      giteeSyncAction.disabled = false;
      return;
    }

    // 比较条数和最新更新时间
    const localCount = localNotes.length;
    const remoteCount = remoteNotes.length;
    const localLatest = localNotes.reduce((max, n) => Math.max(max, new Date(n.updatedAt || 0).getTime()), 0);
    const remoteLatest = remoteNotes.reduce((max, n) => Math.max(max, new Date(n.updatedAt || 0).getTime()), 0);

    if (remoteLatest > localLatest && remoteCount >= localCount) {
      // 远端更新
      if (confirm('远端数据比本地新且条数不少于本地。\n\n确定：用远端覆盖本地\n取消：用本地覆盖远端（将再次确认）')) {
        // 远端覆盖本地
        categories = remoteNotes.map(n => ({
          name: n.category || '默认',
          bookmarks: n.bookmarks || []
        }));
        save();
        render();
        setGiteeStatus('✅ 已使用远端数据覆盖本地', '');
      } else {
        if (confirm('再次确认：用本地数据覆盖远端？')) {
          setGiteeStatus('⏳ 正在上传本地数据…', 'info');
          const base64 = btoa(unescape(encodeURIComponent(JSON.stringify(localPayload))));
          await giteePut(cfg.filePath, base64, 'sync: 本地覆盖远端');
          setGiteeStatus('✅ 已用本地数据覆盖远端', '');
        } else {
          setGiteeStatus('已取消操作', 'info');
        }
      }
    } else {
      // 本地更新或条数更多 → 上传
      setGiteeStatus('⏳ 本地数据较新，正在上传…', 'info');
      const base64 = btoa(unescape(encodeURIComponent(JSON.stringify(localPayload))));
      await giteePut(cfg.filePath, base64, 'sync: 上传本地更新');
      setGiteeStatus('✅ 已上传本地数据到远端', '');
    }
  } catch(err) {
    setGiteeStatus('❌ 同步失败：' + err.message, 'error');
  } finally {
    giteeSyncAction.disabled = false;
  }
};

// ---------- 上传 ----------
giteeUploadAction.onclick = async () => {
  const cfg = getSyncCfg();
  if (!cfg.owner || !cfg.token || !cfg.repo) {
    setGiteeStatus('❌ 请先在「⚙️ Gitee 设置」中配置账号、令牌和仓库', 'error');
    return;
  }
  // 选择本地文件
  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = '.json';
  fileInput.onchange = async () => {
    const f = fileInput.files[0];
    if (!f) return;
    let localData;
    try {
      const text = await f.text();
      localData = JSON.parse(text);
      if (!localData || !Array.isArray(localData.notes)) {
        setGiteeStatus('❌ 文件格式错误：必须包含 notes 数组', 'error');
        return;
      }
    } catch(e) {
      setGiteeStatus('❌ 文件解析失败：' + e.message, 'error');
      return;
    }

    const prefix = prompt('请输入文件名前缀（如 A厂、资料库）：', '资料库');
    if (!prefix) {
      setGiteeStatus('已取消上传', 'info');
      return;
    }

    giteeUploadAction.disabled = true;
    try {
      const dir = cfg.filePath.split('/').slice(0, -1).join('/') || '';
      const dateStr = new Date().toISOString().slice(0,10);
      // 查找同目录已有文件
      let existingFiles = [];
      try {
        existingFiles = await giteeListDir(dir);
      } catch(e) {}
      const samePrefix = existingFiles.filter(item => item.name.startsWith(prefix + '-' + dateStr));
      let index = 1;
      const usedIndices = samePrefix.map(item => {
        const m = item.name.match(new RegExp(prefix + '-' + dateStr + 'T(\\d+)\\.json'));
        return m ? parseInt(m[1]) : 0;
      }).filter(n => n > 0);
      if (usedIndices.length > 0) index = Math.max(...usedIndices) + 1;
      const fileName = `${prefix}-${dateStr}T${index}.json`;
      const fullPath = dir ? dir + '/' + fileName : fileName;

      setGiteeStatus('⏳ 正在上传 ' + fileName + ' …', 'info');
      const base64 = btoa(unescape(encodeURIComponent(JSON.stringify(localData))));
      await giteePut(fullPath, base64, 'upload: ' + fileName);
      setGiteeStatus('✅ 上传成功：' + fullPath, '');
    } catch(err) {
      setGiteeStatus('❌ 上传失败：' + err.message, 'error');
    } finally {
      giteeUploadAction.disabled = false;
    }
  };
  fileInput.click();
};

dlImport.onclick = async () => {

  if (!confirm('导入将覆盖当前资料库中的所有书签，确定继续？')) return;
  try {
    const cfg = getSyncCfg();

    setGiteeStatus('⏳ 正在导入…', 'info');
    const data = await giteeGet(path);
    const content = atob(data.content.replace(/\s/g, ''));
    const parsed = JSON.parse(content);
    if (!parsed.notes || !Array.isArray(parsed.notes)) {
      setGiteeStatus('❌ 文件内容无效：缺少 notes 数组', 'error');
      return;
    }
    // 清洗 + 标题去重
    const cleanedNotes = dedupeNotesByTitle(parsed.notes.map(sanitizeNote));
    // 合并分类（按 title 去重，但这里直接替换整个 categories）
    // 按照原始结构重建 categories
    const catMap = new Map();
    cleanedNotes.forEach(note => {
      const catName = note.category || '默认';
      if (!catMap.has(catName)) catMap.set(catName, []);
      catMap.get(catName).push(note);
    });
    const newCategories = [];
    catMap.forEach((notes, catName) => {
      newCategories.push({
        name: catName,
        bookmarks: notes.map(n => ({
          title: n.title || n.url || '未命名',
          url: n.url || '',
          favicon: n.favicon || '',
          desc: n.desc || ''
        }))
      });
    });
    categories = newCategories;
    save();
    render();
    setGiteeStatus('✅ 导入成功，共 ' + cleanedNotes.length + ' 条书签', '');
    dlPicker.style.display = 'none';
  } catch(err) {
    setGiteeStatus('❌ 导入失败：' + err.message, 'error');
  }
};

/* ======================= Gitee 设置弹窗（带锁） ======================= */
const giteeSetBackdrop = document.getElementById('giteeSetBackdrop');
const closeGiteeSet = document.getElementById('closeGiteeSet');
const giteeSetFields = document.getElementById('giteeSetFields');
const lockOverlay = document.getElementById('lockOverlay');
const unlockBtn = document.getElementById('unlockBtn');
const setOwner = document.getElementById('setOwner');
const setToken = document.getElementById('setToken');
const setRepo = document.getElementById('setRepo');
const setFilePath = document.getElementById('setFilePath');
const toggleToken = document.getElementById('toggleToken');
const cancelGiteeSet = document.getElementById('cancelGiteeSet');
const saveGiteeSet = document.getElementById('saveGiteeSet');

let lockTimer = null;
let isLocked = true;

function lockSettings() {
  isLocked = true;
  giteeSetFields.classList.add('locked');
  lockOverlay.style.display = 'flex';
  if (lockTimer) { clearTimeout(lockTimer); lockTimer = null; }
}

function unlockSettings() {
  isLocked = false;
  giteeSetFields.classList.remove('locked');
  lockOverlay.style.display = 'none';
  resetLockTimer();
}

function resetLockTimer() {
  if (lockTimer) clearTimeout(lockTimer);
  if (!isLocked) {
    lockTimer = setTimeout(() => { lockSettings(); }, 10000);
  }
}

// 解锁按钮
unlockBtn.onclick = (e) => { e.stopPropagation(); unlockSettings(); };

// 输入框聚焦时重置计时
[setOwner, setToken, setRepo, setFilePath].forEach(el => {
  el.addEventListener('focus', resetLockTimer);
  el.addEventListener('input', resetLockTimer);
});

// 密码可见切换
toggleToken.onclick = () => {
  if (setToken.type === 'password') {
    setToken.type = 'text';
    toggleToken.textContent = '🙈';
  } else {
    setToken.type = 'password';
    toggleToken.textContent = '👁';
  }
};

function loadGiteeSetForm() {
  const cfg = getSyncCfg();
  setOwner.value = cfg.owner || '';
  setToken.value = cfg.token || '';
  setRepo.value = cfg.repo || '';
  setFilePath.value = cfg.filePath || '我的数据库/资料库.json';
}
function openGiteeSet() {
  loadGiteeSetForm();
  lockSettings(); // 每次打开默认锁定
  giteeSetBackdrop.style.display = 'flex';
}
function closeGiteeSetModal() {
  giteeSetBackdrop.style.display = 'none';
  if (lockTimer) { clearTimeout(lockTimer); lockTimer = null; }
}

closeGiteeSet.onclick = closeGiteeSetModal;
cancelGiteeSet.onclick = closeGiteeSetModal;
giteeSetBackdrop.onclick = e => { if (e.target === giteeSetBackdrop) closeGiteeSetModal(); };

saveGiteeSet.onclick = () => {
  if (isLocked) {
    alert('请先点击「● 开启」解锁设置');
    return;
  }
  const cfg = {
    owner: setOwner.value.trim(),
    token: setToken.value.trim(),
    repo: setRepo.value.trim(),
    filePath: setFilePath.value.trim() || '我的数据库/资料库.json'
  };
  if (!cfg.owner || !cfg.token || !cfg.repo) {
    alert('用户名、令牌、仓库名不能为空');
    return;
  }
  saveSyncCfg(cfg);
  // 同步更新 Gitee 同步弹窗的信息条
  updateGiteeInfo();
  alert('设置已保存');
  closeGiteeSetModal();
};

/* ======================= 命令面板 ======================= */
const cmdBackdrop = document.getElementById('cmdBackdrop');
const cmdInput = document.getElementById('cmdInput');
const cmdList = document.getElementById('cmdList');

const CMD_ITEMS = [
  {id:'gitee',  label:'⚙️ Gitee 设置', desc:'配置仓库 · 导入 · 导出',   run:()=>openGiteeSet()},
  {id:'import', label:'📥 导入 JSON',   desc:'从文件合并到资料库',       run:()=>importJSONFromFile()},
  {id:'export', label:'📤 导出 JSON',   desc:'导出到本地文件',           run:()=>exportJSON()},
  {id:'clear',  label:'⚠️ 清空数据',    desc:'删除全部资料（不可恢复）', run:()=>openClearData(), danger:true},
];

let cmdSelectedIndex = 0;
let cmdFiltered = [];

function renderCmd(q) {
  const query = (q||'').trim().toLowerCase();
  cmdFiltered = CMD_ITEMS.filter(item =>
    item.label.toLowerCase().includes(query) || item.desc.toLowerCase().includes(query)
  );
  if (cmdFiltered.length === 0) {
    cmdList.innerHTML = '<div class="cmd-empty">无匹配</div>';
    cmdSelectedIndex = -1;
    return;
  }
  cmdSelectedIndex = Math.min(cmdSelectedIndex, cmdFiltered.length - 1);
  if (cmdSelectedIndex < 0) cmdSelectedIndex = 0;
  cmdList.innerHTML = cmdFiltered.map((item, idx) => {
    const sel = idx === cmdSelectedIndex ? ' sel' : '';
    const danger = item.danger ? ' danger' : '';
    return `<div class="cmd-item${sel}${danger}" data-idx="${idx}">
      <span class="cmd-label">${item.label}</span>
      <span class="cmd-desc">${item.desc}</span>
    </div>`;
  }).join('');
  // 绑定点击
  cmdList.querySelectorAll('.cmd-item').forEach(el => {
    el.onclick = () => {
      const idx = parseInt(el.dataset.idx);
      const item = cmdFiltered[idx];
      if (item) {
        closeCmd();
        setTimeout(() => item.run(), 50);
      }
    };
    el.onmouseenter = () => {
      cmdSelectedIndex = parseInt(el.dataset.idx);
      renderCmd(cmdInput.value);
    };
  });
}

function openCmd() {
  cmdInput.value = '';
  cmdSelectedIndex = 0;
  renderCmd('');
  cmdBackdrop.style.display = 'flex';
  setTimeout(() => cmdInput.focus(), 50);
}
function closeCmd() {
  cmdBackdrop.style.display = 'none';
}

cmdInput.addEventListener('input', () => {
  cmdSelectedIndex = 0;
  renderCmd(cmdInput.value);
});

cmdInput.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowDown') {
    e.preventDefault();
    if (cmdFiltered.length === 0) return;
    cmdSelectedIndex = (cmdSelectedIndex + 1) % cmdFiltered.length;
    renderCmd(cmdInput.value);
  } else if (e.key === 'ArrowUp') {
    e.preventDefault();
    if (cmdFiltered.length === 0) return;
    cmdSelectedIndex = (cmdSelectedIndex - 1 + cmdFiltered.length) % cmdFiltered.length;
    renderCmd(cmdInput.value);
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (cmdSelectedIndex >= 0 && cmdFiltered[cmdSelectedIndex]) {
      const item = cmdFiltered[cmdSelectedIndex];
      closeCmd();
      setTimeout(() => item.run(), 50);
    }
  } else if (e.key === 'Escape') {
    closeCmd();
  }
});

cmdBackdrop.onclick = e => { if (e.target === cmdBackdrop) closeCmd(); };

// 快捷键 Ctrl/⌘+K
document.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
    e.preventDefault();
    if (cmdBackdrop.style.display === 'flex') closeCmd();
    else openCmd();
  }
  if (e.key === 'Escape') {
    if (cmdBackdrop.style.display === 'flex') closeCmd();
    if (giteeSetBackdrop.style.display === 'flex') closeGiteeSetModal();
    if (giteeSyncBackdrop.style.display === 'flex') closeGiteeSyncModal();
    if (modalBackdrop.style.display === 'flex') hide(modalBackdrop);
    if (catModalBackdrop.style.display === 'flex') hide(catModalBackdrop);
    if (descModalBackdrop.style.display === 'flex') hide(descModalBackdrop);
  }
});

/* ======================= 顶部按钮绑定 ======================= */
document.getElementById('giteeSyncBtn').onclick = () => openGiteeSync();
document.getElementById('cmdPanelBtn').onclick = () => openCmd();
document.getElementById('refreshBtn').onclick = () => location.reload();

// 启动
init();
})();
</script>
