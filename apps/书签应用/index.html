<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#333;padding:10px;}
h1{text-align:center;font-size:20px;margin-bottom:10px;}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-bottom:10px;align-items:center;}
.toolbar button{padding:6px 10px;font-size:14px;border:none;border-radius:4px;color:#fff;background:#007bff;cursor:pointer;}
.toolbar .secondary{background:#6c757d;}
.toolbar .danger{background:#dc3545;}
.toolbar input[type=file]{display:none;}

.categories-container{display:flex;flex-direction:column;gap:20px;}
.category-block{background:transparent;}
.category-block.dragging{opacity:0.4;}
.category-header{display:flex;align-items:center;margin-bottom:6px;padding:0 4px;}
.category-name{font-size:16px;font-weight:600;margin-right:8px;}
.category-actions{margin-left:auto;display:flex;gap:4px;}
.category-actions button{padding:2px 6px;font-size:11px;border:none;border-radius:4px;color:#fff;background:#6c757d;}
.category-actions .edit-cat{background:#007bff;}
.category-actions .del-cat{background:#dc3545;}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}

.tile{background:#fff;border-radius:8px;padding:8px 4px;min-height:80px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);}
.tile.dragging{opacity:0.4;}
.tile-logo{width:32px;height:32px;border-radius:8px;background:#ddd;display:flex;align-items:center;justify-content:center;font-weight:bold;color:#fff;margin-bottom:4px;font-size:16px;overflow:hidden;}
.tile-logo img{width:100%;height:100%;object-fit:cover;}
.tile-title{font-size:12px;text-align:center;max-height:32px;overflow:hidden;}
.tile-actions{position:absolute;top:4px;right:4px;display:flex;gap:4px;opacity:0;transition:.2s;}
.tile:hover .tile-actions,.tile.show-actions .tile-actions{opacity:1;}
.tile-actions button{padding:2px 4px;font-size:10px;border:none;border-radius:3px;background:rgba(0,0,0,.5);color:#fff;}

.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000;}
.modal{background:#fff;border-radius:8px;padding:16px;width:90%;max-width:360px;box-shadow:0 2px 8px rgba(0,0,0,.2);}
.modal h2{font-size:16px;margin-bottom:10px;}
.modal label{font-size:13px;margin:6px 0 2px;display:block;}
.modal input{width:100%;padding:6px 8px;font-size:14px;border:1px solid #ccc;border-radius:4px;}
.modal-buttons{margin-top:12px;display:flex;justify-content:flex-end;gap:8px;}
.modal-buttons button{padding:6px 10px;border:none;border-radius:4px;color:#fff;}
.modal-buttons .cancel{background:#6c757d;}
.modal-buttons .ok{background:#007bff;}
.category-select{position:relative;display:flex;align-items:center;}
.category-select input{flex:1;}
.dropdown-btn{margin-left:6px;padding:4px 8px;font-size:14px;border:1px solid #ccc;background:#eee;border-radius:4px;cursor:pointer;}
.dropdown-menu{position:absolute;top:38px;left:0;right:0;background:#fff;border:1px solid #ccc;border-radius:6px;max-height:200px;overflow-y:auto;display:none;z-index:2000;}
.dropdown-menu div{padding:8px;cursor:pointer;}
.dropdown-menu div:hover{background:#f0f0f0;}

/* ===== Gitee 同步弹窗 ===== */
.gitee-sync-modal{max-width:420px;width:92%;border-radius:12px;padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:82vh;}
.gitee-sync-modal .gs-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee;font-size:16px;font-weight:600;}
.gitee-sync-modal .gs-header .gs-close{border:none;background:transparent;font-size:18px;cursor:pointer;color:#888;}
.gitee-sync-modal .gs-body{padding:14px 16px;overflow-y:auto;flex:1;}
.gs-info{background:#f7f9fc;border:1px solid #e3e9f2;border-radius:8px;padding:10px;font-size:12px;color:#555;line-height:1.7;margin-bottom:10px;}
.gs-info b{color:#333;}
.gs-tips{font-size:12px;color:#888;line-height:1.6;margin-bottom:10px;padding:0 2px;}
.gs-msg{font-size:13px;padding:8px 10px;border-radius:6px;margin-bottom:10px;display:none;line-height:1.5;}
.gs-msg.ok{background:#e8f7ed;color:#1e7e34;display:block;}
.gs-msg.err{background:#fdeaea;color:#c82333;display:block;}
.gs-filelist{display:none;border:1px solid #eee;border-radius:8px;overflow:hidden;margin-bottom:10px;}
.gs-filelist .gs-file{padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;cursor:pointer;border-bottom:1px solid #f2f2f2;}
.gs-filelist .gs-file:last-child{border-bottom:none;}
.gs-filelist .gs-file:hover{background:#f5f9ff;}
.gs-filelist .gs-file .sz{color:#999;font-size:12px;}
.gitee-sync-modal .gs-footer{display:flex;gap:8px;padding:12px 16px;border-top:1px solid #eee;background:#fafafa;}
.gitee-sync-modal .gs-footer button{flex:1;padding:9px 0;border:none;border-radius:8px;font-size:14px;color:#fff;cursor:pointer;}
.gs-btn-sync{background:#007bff;}
.gs-btn-up{background:#28a745;}
.gs-btn-down{background:#6c757d;}
.gitee-sync-modal .gs-footer button:disabled{background:#c8c8c8;cursor:not-allowed;}

/* 下载选择小窗 */
.gs-pick-modal{max-width:340px;width:88%;border-radius:12px;padding:0;overflow:hidden;}
.gs-pick-modal .gp-header{padding:12px 14px;border-bottom:1px solid #eee;font-size:14px;font-weight:600;display:flex;justify-content:space-between;gap:8px;}
.gs-pick-modal .gp-header .sz{font-weight:400;color:#999;font-size:12px;}
.gs-pick-modal .gp-body{padding:10px 14px;display:flex;flex-direction:column;gap:8px;}
.gs-pick-modal .gp-body button{padding:10px;border:none;border-radius:8px;font-size:14px;cursor:pointer;}
.gp-download-phone{background:#007bff;color:#fff;}
.gp-import{background:#eef4ff;color:#007bff;}
.gs-pick-modal .gp-footer{padding:0 14px 14px;}
.gs-pick-modal .gp-footer button{width:100%;padding:9px;border:none;border-radius:8px;background:#6c757d;color:#fff;cursor:pointer;}

/* ===== ⌘ 命令面板 ===== */
.cmd-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-start;justify-content:center;z-index:3000;padding-top:12vh;}
.cmd-panel{width:92%;max-width:520px;background:#fff;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.28);overflow:hidden;}
.cmd-list{padding:8px;}
.cmd-item{display:flex;flex-direction:column;gap:2px;padding:11px 14px;border-radius:10px;cursor:pointer;}
.cmd-item .cmd-label{font-size:14px;font-weight:600;color:#333;}
.cmd-item .cmd-desc{font-size:12px;color:#999;}
.cmd-item.sel{background:#eef4ff;}
.cmd-item.danger .cmd-label{color:#dc3545;}
.cmd-item.danger.sel{background:#fdeaea;}
.cmd-empty{padding:18px;text-align:center;font-size:13px;color:#aaa;}

/* ===== Gitee 设置弹窗 ===== */
.gitee-set-modal{max-width:420px;width:92%;border-radius:12px;padding:0;overflow:hidden;display:flex;flex-direction:column;max-height:82vh;}
.gitee-set-modal .gset-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #eee;font-size:16px;font-weight:600;}
.gitee-set-modal .gset-header button{border:none;background:transparent;font-size:18px;cursor:pointer;color:#888;}
.gitee-set-body{padding:14px 16px;position:relative;overflow-y:auto;}
.gitee-set-body .form-group{margin-bottom:10px;}
.gitee-set-body label{font-size:13px;color:#555;display:block;margin-bottom:4px;}
.gitee-set-body input{width:100%;padding:8px;font-size:14px;border:1px solid #ccc;border-radius:6px;}
.gitee-set-body input:disabled{background:#f2f2f2;}
.gitee-set-body .unlock-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;position:relative;z-index:30;background:#fff;padding:4px 2px;border-radius:6px;}
.gitee-set-body .unlock-btn{padding:6px 14px;border:none;border-radius:6px;background:#007bff;color:#fff;font-size:13px;cursor:pointer;font-weight:500;box-shadow:0 2px 8px rgba(0,123,255,.45);transition:background .15s,box-shadow .15s;position:relative;z-index:31;}
.gitee-set-body .unlock-btn:hover{background:#0069d9;}
.gitee-set-body .unlock-btn:disabled{background:#ccc;cursor:not-allowed;box-shadow:none;}
.gitee-set-body .lock-overlay{position:absolute;inset:0;background:rgba(245,245,245,.72);display:none;align-items:center;justify-content:center;flex-direction:column;gap:8px;border-radius:0 0 12px 12px;z-index:20;pointer-events:none;}
.gitee-set-body .lock-overlay.show{display:flex;}
.gitee-set-body .lock-overlay .lock-icon{font-size:28px;}
.gitee-set-body .lock-overlay .lock-text{font-size:14px;color:#666;}
.gitee-set-modal .gset-footer{padding:12px 16px;border-top:1px solid #eee;background:#fafafa;display:flex;flex-direction:column;gap:8px;}
.gitee-set-modal .gset-footer button{padding:9px;border:none;border-radius:8px;background:#007bff;color:#fff;font-size:14px;cursor:pointer;}
.gitee-set-modal .gset-footer button:disabled{background:#c8c8c8;cursor:not-allowed;}
.gitee-set-modal .gset-hint{font-size:11px;color:#999;line-height:1.5;}
</style>
</head>
<body>
<title>分类书签九宫格</title>

<link rel="manifest" href="manifest.json">





<h1>分类书签九宫格</h1>
<div class="toolbar">
  <button id="addBookmarkBtn">添加书签</button>
  <button id="openGiteeSyncBtn" class="secondary">⚙️ Gitee</button>
  <button id="openCmdBtn" class="secondary">⌘</button>
  <button id="refreshBtn" class="secondary">🔄</button>
</div>

<div id="categoriesContainer" class="categories-container"></div>

<!-- 添加/编辑书签弹窗 -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle">添加书签</h2>
    <label>分类：</label>
    <div class="category-select">
      <input type="text" id="inputCategory" placeholder="选择或输入分类（留空为默认）" />
      <button id="categoryDropdownBtn" class="dropdown-btn">▼</button>
      <div id="categoryDropdownMenu" class="dropdown-menu"></div>
    </div>
    <label>标题（可选）：</label>
    <input type="text" id="inputTitle" placeholder="例如：B站" />
    <label>网址：</label>
    <input type="text" id="inputUrl" placeholder="https://..." />
    <label>说明（可选）：</label>
    <input type="text" id="inputDesc" placeholder="例如：常用视频网站" />
    <div class="modal-buttons">
      <button class="cancel" id="cancelModal">取消</button>
      <button class="ok" id="okModal">确定</button>
    </div>
  </div>
</div>

<!-- 编辑分类弹窗 -->
<div id="categoryModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="categoryModalTitle">编辑分类</h2>
    <label>分类名称：</label>
    <input type="text" id="inputCategoryName" />
    <div class="modal-buttons">
      <button class="cancel" id="cancelCategoryModal">取消</button>
      <button class="ok" id="okCategoryModal">确定</button>
    </div>
  </div>
</div>

<!-- 书签说明弹窗 -->
<div id="descModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2>书签说明</h2>
    <p id="descContent" style="font-size:14px;line-height:1.6;"></p>
    <div class="modal-buttons">
      <button class="cancel" id="closeDescModal">关闭</button>
      <button class="ok" id="visitLinkBtn">继续访问</button>
    </div>
  </div>
</div>

<!-- ===== Gitee 同步弹窗 ===== -->
<div id="giteeSyncBackdrop" class="modal-backdrop">
  <div class="modal gitee-sync-modal">
    <div class="gs-header">
      <span>Gitee 同步</span>
      <button class="gs-close" id="gsClose">✕</button>
    </div>
    <div class="gs-body">
      <div class="gs-info" id="gsInfo">读取配置中…</div>
      <div class="gs-tips">
        · 一键同步：智能比较本地/远端，自动决定覆盖方向<br>
        · 上传：按日期编号备份，自动避免重名<br>
        · 下载：从远端列表选文件下载或导入
      </div>
      <div class="gs-msg" id="gsMsg"></div>
      <div class="gs-filelist" id="gsFileList"></div>
    </div>
    <div class="gs-footer">
      <button class="gs-btn-sync" id="gsSyncBtn">☁️ 一键同步</button>
      <button class="gs-btn-up" id="gsUploadBtn">⬆ 上传</button>
      <button class="gs-btn-down" id="gsDownloadBtn">⬇ 下载</button>
    </div>
  </div>
</div>

<!-- 下载选择小窗 -->
<div id="gsPickBackdrop" class="modal-backdrop">
  <div class="modal gs-pick-modal">
    <div class="gp-header">
      <span id="gpFileName">文件名</span>
      <span class="sz" id="gpFileSize"></span>
    </div>
    <div class="gp-body">
      <button class="gp-download-phone" id="gpDownloadPhone">📱 下载到手机</button>
      <button class="gp-import" id="gpImportLib">📥 导入资料库</button>
    </div>
    <div class="gp-footer">
      <button id="gpCancel">取消</button>
    </div>
  </div>
</div>

<!-- ===== ⌘ 命令面板 ===== -->
<div id="cmdBackdrop" class="cmd-backdrop">
  <div class="cmd-panel">
    <div class="cmd-list" id="cmdList"></div>
  </div>
</div>

<!-- ===== Gitee 设置弹窗 ===== -->
<div id="giteeSetBackdrop" class="modal-backdrop">
  <div class="modal gitee-set-modal">
    <div class="gset-header">
      <span>Gitee 设置</span>
      <button id="gsetClose">✕</button>
    </div>
    <div class="gitee-set-body">
      <div class="unlock-row">
        <span style="font-size:13px;color:#888;">🔒 设置已锁定</span>
        <button class="unlock-btn" id="unlockGiteeSet">● 开启</button>
      </div>
      <div class="form-group">
        <label>Gitee 用户名（owner）</label>
        <input type="text" id="setOwner" disabled />
      </div>
      <div class="form-group">
        <label>私人令牌（token）</label>
        <input type="password" id="setToken" disabled />
        <button id="toggleTokenEye" style="margin-top:6px;padding:4px 8px;font-size:12px;border:1px solid #ccc;background:#f8f8f8;border-radius:4px;cursor:pointer;">👁 显示令牌</button>
      </div>
      <div class="form-group">
        <label>仓库名（repo）</label>
        <input type="text" id="setRepo" disabled />
      </div>
      <div class="form-group">
        <label>文件路径（filePath）</label>
        <input type="text" id="setFilePath" disabled placeholder="我的数据库/资料库.json" />
      </div>
      <div class="lock-overlay show" id="lockOverlay">
        <div class="lock-icon">🔒</div>
        <div class="lock-text">设置已锁定</div>
      </div>
    </div>
    <div class="gset-footer">
      <button id="saveGiteeSet" disabled>保存设置</button>
      <div class="gset-hint">在 gitee.com 设置→安全设置→私人令牌生成；仓库建议设私有。</div>
    </div>
  </div>
</div>
<script>
if("serviceWorker" in navigator){navigator.serviceWorker.register("sw.js");}



(function(){
"use strict";

/* ================= 通用工具 ================= */
function safeParseJSON(str, fallback){
  try{ return JSON.parse(str); }catch(e){ return fallback; }
}
function safeAtob(b64){
  try{
    const clean = String(b64||"").replace(/\s/g,"");
    return decodeURIComponent(Array.prototype.map.call(atob(clean), c =>
      "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2)).join(""));
  }catch(e){
    try{ return atob(String(b64||"").replace(/\s/g,"")); }catch(e2){ return ""; }
  }
}
function safeBtoa(str){
  try{
    return btoa(unescape(encodeURIComponent(String(str==null?"":str))));
  }catch(e){ return ""; }
}
const EMPTY_PLACEHOLDER = "empty";

/* ================= 书签主体逻辑 ================= */
const STORAGE_KEY="catBookmarks_v4";
let categories=[];
let editingCatIndex=null;
let editingBookmark={catIndex:null,bookmarkIndex:null};

const container=document.getElementById("categoriesContainer");
const addBookmarkBtn=document.getElementById("addBookmarkBtn");
const modalBackdrop=document.getElementById("modalBackdrop");
const modalTitle=document.getElementById("modalTitle");
const inputCategory=document.getElementById("inputCategory");
const inputTitle=document.getElementById("inputTitle");
const inputUrl=document.getElementById("inputUrl");
const inputDesc=document.getElementById("inputDesc");
const cancelModal=document.getElementById("cancelModal");
const okModal=document.getElementById("okModal");
const catModalBackdrop=document.getElementById("categoryModalBackdrop");
const inputCategoryName=document.getElementById("inputCategoryName");
const cancelCategoryModal=document.getElementById("cancelCategoryModal");
const okCategoryModal=document.getElementById("okCategoryModal");
const dropdownBtn=document.getElementById("categoryDropdownBtn");
const dropdownMenu=document.getElementById("categoryDropdownMenu");
const descModalBackdrop=document.getElementById("descModalBackdrop");
const descContent=document.getElementById("descContent");
const closeDescModal=document.getElementById("closeDescModal");
const visitLinkBtn=document.getElementById("visitLinkBtn");
let currentVisitUrl="";

function escapeHtml(t){
  return String(t).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#039;"}[m]));
}
function getInitial(t){t=(t||"?").trim();return t?t[0].toUpperCase():"?";}
function getColor(t){t=t||"?";let h=0;for(let i=0;i<t.length;i++)h=t.charCodeAt(i)+((h<<5)-h);return`hsl(${Math.abs(h)%360},60%,55%)`;}
function normalizeUrl(u){u=u.trim();return/^https?:\/\//i.test(u)?u:"https://"+u;}
function favicon(u){try{const host=new URL(u).hostname;return`https://www.google.com/s2/favicons?domain=${host}&sz=64`;}catch(e){return"";}}

dropdownBtn.onclick=e=>{e.stopPropagation();renderDropdown();dropdownMenu.style.display=dropdownMenu.style.display==="block"?"none":"block";};
function renderDropdown(){
  dropdownMenu.innerHTML="";
  categories.forEach(c=>{
    const d=document.createElement("div");
    d.textContent=c.name;
    d.onclick=()=>{inputCategory.value=c.name;dropdownMenu.style.display="none";};
    dropdownMenu.appendChild(d);
  });
}
document.onclick=()=>dropdownMenu.style.display="none";

function render(){
  container.innerHTML="";
  categories.forEach((cat,ci)=>{
    const block=document.createElement("div");
    block.className="category-block";
    block.draggable=true;
    block.dataset.index=ci;
    block.addEventListener("dragstart",e=>{block.classList.add("dragging");e.dataTransfer.setData("text/plain",ci);});
    block.addEventListener("dragend",()=>block.classList.remove("dragging"));
    block.addEventListener("dragover",e=>{
      e.preventDefault();
      const dragging=document.querySelector(".category-block.dragging");
      if(!dragging)return;
      const blocks=[...container.children];
      const currentIndex=blocks.indexOf(block);
      const draggingIndex=blocks.indexOf(dragging);
      if(currentIndex!==draggingIndex){
        if(currentIndex>draggingIndex)container.insertBefore(dragging,block.nextSibling);
        else container.insertBefore(dragging,block);
      }
    });
    block.addEventListener("drop",()=>{
      const newOrder=[...container.children].map(b=>categories[b.dataset.index]);
      categories=newOrder;save();render();
    });
    const header=document.createElement("div");
    header.className="category-header";
    header.innerHTML=`<span class="category-name">${escapeHtml(cat.name)}</span>
      <div class="category-actions">
        <button class="edit-cat" data-i="${ci}">改</button>
        <button class="del-cat" data-i="${ci}">删</button>
      </div>`;
    const grid=document.createElement("div");
    grid.className="grid";
    cat.bookmarks.forEach((b,bi)=>grid.appendChild(createTile(ci,bi,b)));
    block.appendChild(header);block.appendChild(grid);container.appendChild(block);
  });
  document.querySelectorAll(".edit-cat").forEach(btn=>btn.onclick=()=>openEditCategory(+btn.dataset.i));
  document.querySelectorAll(".del-cat").forEach(btn=>{
    btn.onclick=()=>{
      const i=+btn.dataset.i;
      if(confirm(`删除分类“${categories[i].name}”？`)){categories.splice(i,1);save();render();}
    };
  });
}

function createTile(ci,bi,b){
  const t=document.createElement("div");
  t.className="tile";t.draggable=true;t.dataset.ci=ci;t.dataset.bi=bi;
  t.addEventListener("dragstart",()=>t.classList.add("dragging"));
  t.addEventListener("dragend",()=>t.classList.remove("dragging"));
  t.addEventListener("dragover",e=>{
    e.preventDefault();
    const dragging=document.querySelector(".tile.dragging");
    if(!dragging)return;
    const grid=t.parentElement;
    const tiles=[...grid.children];
    const currentIndex=tiles.indexOf(t);
    const draggingIndex=tiles.indexOf(dragging);
    if(currentIndex!==draggingIndex){
      if(currentIndex>draggingIndex)grid.insertBefore(dragging,t.nextSibling);
      else grid.insertBefore(dragging,t);
    }
  });
  t.addEventListener("drop",()=>{
    const grid=t.parentElement;
    const newOrder=[...grid.children].map(tile=>categories[tile.dataset.ci].bookmarks[tile.dataset.bi]);
    categories[ci].bookmarks=newOrder;save();render();
  });
  t.onclick=e=>{
    if(t.classList.contains("show-actions")){
      currentVisitUrl=b.url;
      descContent.textContent=b.desc||"无说明";
      descModalBackdrop.style.display="flex";
      t.classList.remove("show-actions");
    }else{
      document.querySelectorAll(".tile.show-actions").forEach(x=>x.classList.remove("show-actions"));
      t.classList.add("show-actions");
    }
  };
  const logo=document.createElement("div");
  logo.className="tile-logo";
  if(b.favicon){
    const img=document.createElement("img");
    img.src=b.favicon;
    img.onerror=()=>{logo.textContent=getInitial(b.title||b.url);logo.style.background=getColor(b.title||b.url);};

/* ================= Gitee 底层函数 ================= */
const GITEE_CFG_KEY="my_notes_gitee_cfg";
function getSyncCfg(){
  const raw=localStorage.getItem(GITEE_CFG_KEY);
  const def={owner:"",token:"",repo:"",filePath:"我的数据库/资料库.json"};
  if(!raw)return def;
  const o=safeParseJSON(raw,{})||{};
  return Object.assign(def,o);
}
function saveSyncCfg(cfg){
  localStorage.setItem(GITEE_CFG_KEY,JSON.stringify({
    owner:cfg.owner||"",token:cfg.token||"",repo:cfg.repo||"",
    filePath:cfg.filePath||"我的数据库/资料库.json"
  }));
}
function encodeGiteePath(p){
  return String(p||"").split("/").map(s=>encodeURIComponent(s)).join("/");
}
async function giteeGet(path){
  const cfg=getSyncCfg();
  const url=`https://gitee.com/api/v5/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeGiteePath(path)}?access_token=${encodeURIComponent(cfg.token)}`;
  const r=await fetch(url);
  if(!r.ok)throw new Error("GET 失败 "+r.status);
  return await r.json();
}
async function giteePut(path,contentB64,message){
  const cfg=getSyncCfg();
  if(!cfg.owner||!cfg.token||!cfg.repo)throw new Error("Gitee 配置不完整");
  if(!contentB64)throw new Error("内容为空，拒绝上传");

  const api=`https://gitee.com/api/v5/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeGiteePath(path)}`;

  // 先查是否存在，存在则拿 sha 用 PUT 更新
  let sha=null;
  try{
    const r=await fetch(`${api}?access_token=${encodeURIComponent(cfg.token)}`);
    if(r.ok){
      const info=await r.json();
      sha=info&&info.sha;
    }
  }catch(e){/* 不存在或查询失败，走新建 */}

  const body={access_token:cfg.token,content:contentB64,message:message||"sync"};
  if(sha)body.sha=sha;

  const r=await fetch(api,{
    method:sha?"PUT":"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify(body)
  });
  if(!r.ok){
    let detail="";
    try{const j=await r.json();detail=j.message||JSON.stringify(j);}catch(e){}
    throw new Error(`PUT 失败 ${r.status}${detail?"："+detail:""}`);
  }
  return await r.json();
}
async function giteeDelete(path,sha,message){
  const cfg=getSyncCfg();
  const url=`https://gitee.com/api/v5/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeGiteePath(path)}`;
  const r=await fetch(url,{
    method:"DELETE",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({access_token:cfg.token,sha:sha,message:message||"delete"})
  });
  if(!r.ok)throw new Error("DELETE 失败 "+r.status);
  return await r.json();
}
async function giteeListDir(dir){
  const cfg=getSyncCfg();
  const url=`https://gitee.com/api/v5/repos/${encodeURIComponent(cfg.owner)}/${encodeURIComponent(cfg.repo)}/contents/${encodeGiteePath(dir)}?access_token=${encodeURIComponent(cfg.token)}`;
  const r=await fetch(url);
  if(!r.ok)throw new Error("列目录失败 "+r.status);
  const data=await r.json();
  return Array.isArray(data)?data:[];
}
async function getGiteeFileContent(path){
  const info=await giteeGet(path);
  if(!info||!info.content)return {content:null,sha:info&&info.sha,raw:info};
  const text=safeAtob(String(info.content).replace(/\n/g,""));
  return {content:text,sha:info.sha,raw:info};
}
function buildSyncPayload(notes){
  const list=Array.isArray(notes)?notes:[];
  const deduped=dedupeNotesByTitle(list).map(n=>{
    const c=Object.assign({},n);
    delete c.history;
    return c;
  });
  return {notes:deduped,updatedAt:Date.now()};
}
function sanitizeNote(n){
  if(!n||typeof n!=="object")return null;
  const c=Object.assign({},n);
  delete c.history;
  if(!c.title)c.title="未命名";
  if(!c.id)c.id="n_"+Math.random().toString(36).slice(2,10);
  return c;
}
function dedupeNotesByTitle(list){
  const seen=new Set();const out=[];
  (Array.isArray(list)?list:[]).forEach(n=>{
    const key=(n&&n.title||"").trim();
    if(!key){out.push(n);return;}
    if(seen.has(key))return;
    seen.add(key);out.push(n);
  });
  return out;
}

gsSyncBtn.onclick=async()=>{
  const cfg=getSyncCfg();
  if(!cfg.owner||!cfg.token||!cfg.repo){gsSetMsg("❌ 请先在 ⌘ 命令面板 → Gitee 设置 里配置账号/令牌/仓库","err");return;}
  gsSyncBtn.disabled=true;
  gsSetMsg("⏳ 正在读取远端主文件…");
  try{
    let remote=null;
    try{
      const got=await getGiteeFileContent(cfg.filePath);
      if(got.content){
        const obj=safeParseJSON(got.content,null);
        if(obj&&Array.isArray(obj.notes))remote=obj.notes;
      }
    }catch(e){remote=null;}

    const localNotes=buildNotesFromCategories();

    if(!remote||remote.length===0){
      gsSetMsg("⏳ 远端为空，改为上传…");
      await doUpload(localNotes);
      return;
    }

    const remoteLatest=Math.max(...remote.map(n=>n.updatedAt||0));
    const localLatest=Math.max(...localNotes.map(n=>n.updatedAt||0));
    const remoteNewer=(remoteLatest>localLatest)||(remote.length>=localNotes.length&&remoteLatest>=localLatest);

    if(remoteNewer){
      if(confirm("远端更新且条数≥本地，是否用远端覆盖本地？\n确定=远端覆盖本地，取消=本地覆盖远端")){
        importNotesToCategories(remote);
        gsSetMsg("✅ 已用远端覆盖本地","ok");
      }else{
        if(confirm("再确认一次：本地覆盖远端？")){
          await doUpload(localNotes);
        }else{
          gsSetMsg("已取消");
        }
      }
    }else{
      await doUpload(localNotes);
    }
  }catch(err){
    gsSetMsg("❌ "+err.message,"err");
  }finally{
    gsSyncBtn.disabled=false;
  }
};

async function doUpload(notes){
  const cfg=getSyncCfg();
  gsSetMsg("⏳ 正在上传…");
  const payload=buildSyncPayload(notes);
  const b64=safeBtoa(JSON.stringify(payload,null,2));
  if(!b64){gsSetMsg("❌ 内容编码失败（空内容），未上传","err");return;}
  await giteePut(cfg.filePath,b64,"sync "+new Date().toISOString());
  gsSetMsg("✅ 上传成功","ok");
}

gsUploadBtn.onclick=()=>{
  const cfg=getSyncCfg();
  if(!cfg.owner||!cfg.token||!cfg.repo){gsSetMsg("❌ 请先配置 Gitee 设置","err");return;}
  const input=document.createElement("input");
  input.type="file";input.accept="application/json";
  input.onchange=async()=>{
    const f=input.files[0];if(!f)return;
    const prefix=prompt("输入文件名前缀（如 A厂、资料库）","资料库");
    if(prefix===null||!prefix.trim()){gsSetMsg("已取消上传");return;}
    gsUploadBtn.disabled=true;
    try{
      const text=await f.text();
      const obj=safeParseJSON(text,null);
      if(!obj){gsSetMsg("❌ JSON 解析失败","err");return;}
      const list=Array.isArray(obj)?obj:(Array.isArray(obj.notes)?obj.notes:null);
      if(!list){gsSetMsg("❌ 文件不含 notes 数组","err");return;}

      const dir=cfg.filePath.split("/").slice(0,-1).join("/")||"我的数据库";
      const date=new Date().toISOString().slice(0,10);
      let files=[];
      try{files=await giteeListDir(dir);}catch(e){files=[];}
      const names=files.map(x=>x.name||"");
      let idx=1,fileName;
      do{
        fileName=`${prefix.trim()}-${date}T${idx}.json`;idx++;
      }while(names.includes(fileName));
      const targetPath=(dir?dir+"/":"")+fileName;
      const payload=buildSyncPayload(list.map(sanitizeNote).filter(Boolean));
      const b64=safeBtoa(JSON.stringify(payload,null,2));
      if(!b64){gsSetMsg("❌ 内容编码失败（空内容），未上传","err");return;}
      await giteePut(targetPath,b64,"upload "+fileName);
      gsSetMsg("✅ 已上传 "+fileName,"ok");
    }catch(err){
      gsSetMsg("❌ "+err.message,"err");
    }finally{gsUploadBtn.disabled=false;}
  };

};

function formatSize(n){
  const num=Number(n);
  if(!isFinite(num)||num<0)return"—";
  if(num<1024)return num+" B";
  if(num<1024*1024)return (num/1024).toFixed(1)+" KB";
  return (num/1024/1024).toFixed(2)+" MB";
}

function importNotesToCategories(notes){
  const clean=dedupeNotesByTitle(notes.map(sanitizeNote).filter(Boolean));
  const map={};
  clean.forEach(n=>{
    const cat=n.category||"默认";
    if(!map[cat])map[cat]={name:cat,bookmarks:[]};
    map[cat].bookmarks.push({
      title:n.title||n.url||"未命名",
      url:n.url||"",
      favicon:n.favicon||favicon(n.url||""),
      desc:n.desc||""
    });
  });
  categories=Object.values(map);
  save();render();
  alert("已导入资料库");
}

const cmdBackdrop=document.getElementById("cmdBackdrop");
const cmdList=document.getElementById("cmdList");
let cmdIndex=0;
const CMD_ITEMS=[
  {id:"gitee",label:"⚙️ Gitee 设置",desc:"配置仓库 · 导入 · 导出",run:()=>openGiteeSet()},
  {id:"import",label:"📥 导入 JSON",desc:"从文件合并到资料库",run:()=>importJSON()},
  {id:"export",label:"📤 导出 JSON",desc:"导出到本地文件",run:()=>exportJSON()},
  {id:"clear",label:"⚠️ 清空数据",desc:"删除全部资料（不可恢复）",run:()=>openClearData(),danger:true}
];

function openCmd(){
  cmdIndex=0;
  renderCmd("");
  show(cmdBackdrop);
  cmdBackdrop.style.display="flex";
  setTimeout(()=>{const el=cmdList.querySelector(".cmd-item.sel");if(el)el.focus();},50);
}
function closeCmd(){cmdBackdrop.style.display="none";}
function renderCmd(q){
  cmdList.innerHTML="";
  const ql=String(q||"").toLowerCase();
  const list=CMD_ITEMS.filter(it=>!ql||it.label.toLowerCase().includes(ql)||it.desc.toLowerCase().includes(ql));
  if(!list.length){cmdList.innerHTML='<div class="cmd-empty">无匹配</div>';return;}
  list.forEach((it,i)=>{
    const d=document.createElement("div");
    d.className="cmd-item"+(it.danger?" danger":"")+(i===cmdIndex?" sel":"");
    d.innerHTML=`<span class="cmd-label">${escapeHtml(it.label)}</span><span class="cmd-desc">${escapeHtml(it.desc)}</span>`;
    d.onclick=()=>{closeCmd();setTimeout(()=>it.run(),50);};
    cmdList.appendChild(d);
  });
}
document.getElementById("openCmdBtn").onclick=openCmd;
cmdBackdrop.onclick=e=>{if(e.target===cmdBackdrop)closeCmd();};
document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="k"){e.preventDefault();cmdBackdrop.style.display==="flex"?closeCmd():openCmd();return;}
  if(cmdBackdrop.style.display!=="flex")return;
  const items=[...cmdList.querySelectorAll(".cmd-item")];
  if(!items.length)return;
  if(e.key==="ArrowDown"){e.preventDefault();cmdIndex=(cmdIndex+1)%items.length;items.forEach((x,i)=>x.classList.toggle("sel",i===cmdIndex));}
  else if(e.key==="ArrowUp"){e.preventDefault();cmdIndex=(cmdIndex-1+items.length)%items.length;items.forEach((x,i)=>x.classList.toggle("sel",i===cmdIndex));}
  else if(e.key==="Enter"){e.preventDefault();const it=CMD_ITEMS[cmdIndex];if(it){closeCmd();setTimeout(()=>it.run(),50);}}
  else if(e.key==="Escape"){closeCmd();}
});

function importJSON(){
  const input=document.createElement("input");
  input.type="file";input.accept="application/json";
  input.onchange=async()=>{
    const f=input.files[0];if(!f)return;
    try{
      const text=await f.text();
      const obj=safeParseJSON(text,null);
      if(!obj)throw new Error("JSON 解析失败");
      const list=Array.isArray(obj)?obj:(Array.isArray(obj.notes)?obj.notes:null);
      if(!list)throw new Error("格式不正确");
      const clean=dedupeNotesByTitle(list.map(sanitizeNote).filter(Boolean));
      const map={};
      categories.forEach(c=>{map[c.name]=c;});
      clean.forEach(n=>{
        const cat=n.category||"默认";
        if(!map[cat])map[cat]={name:cat,bookmarks:[]};
        const exists=map[cat].bookmarks.some(b=>b.title===n.title);
        if(!exists)map[cat].bookmarks.push({
          title:n.title||n.url||"未命名",url:n.url||"",
          favicon:n.favicon||favicon(n.url||""),desc:n.desc||""
        });
      });
      categories=Object.values(map);
      save();render();
      alert("导入成功");
    }catch(err){alert("导入失败："+err.message);}
  };
  input.click();
}
function openClearData(){
  const v=prompt("输入「清空」以确认删除全部资料");
  if(v!=="清空")return;
  if(!confirm("再次确认：删除全部资料？分类和 Gitee 设置会保留。"))return;
  categories=[];save();render();
  alert("已清空");
}

/* ================= Gitee 设置弹窗 ================= */
const giteeSetBackdrop=document.getElementById("giteeSetBackdrop");
const setOwner=document.getElementById("setOwner");
const setToken=document.getElementById("setToken");
const setRepo=document.getElementById("setRepo");
const setFilePath=document.getElementById("setFilePath");
const unlockGiteeSet=document.getElementById("unlockGiteeSet");
const lockOverlay=document.getElementById("lockOverlay");
const saveGiteeSetBtn=document.getElementById("saveGiteeSet");
const toggleTokenEye=document.getElementById("toggleTokenEye");
const gsetClose=document.getElementById("gsetClose");
let isLocked=true;
let lockTimer=null;

function openGiteeSet(){
  const cfg=getSyncCfg();
  setOwner.value=cfg.owner||"";
  setToken.value=cfg.token||"";
  setRepo.value=cfg.repo||"";
  setFilePath.value=cfg.filePath||"我的数据库/资料库.json";
  isLocked=true;
  setLocked(true);
  show(giteeSetBackdrop);
  giteeSetBackdrop.style.display="flex";
}
function setLocked(locked){
  isLocked=locked;
  [setOwner,setToken,setRepo,setFilePath].forEach(el=>el.disabled=locked);
  saveGiteeSetBtn.disabled=locked;
  unlockGiteeSet.disabled=!locked;
  lockOverlay.classList.toggle('show',locked);
  if(locked){unlockGiteeSet.textContent="● 开启";clearTimeout(lockTimer);}
  else{unlockGiteeSet.textContent="🔓 已解锁";resetLockTimer();}
}
function resetLockTimer(){
  clearTimeout(lockTimer);
  lockTimer=setTimeout(()=>{if(!isLocked)setLocked(true);},10000);
}
unlockGiteeSet.onclick=()=>{
  if(isLocked){setLocked(false);setOwner.focus();}
  else setLocked(true);
};
[setOwner,setToken,setRepo,setFilePath].forEach(el=>el.addEventListener("input",resetLockTimer));
toggleTokenEye.onclick=()=>{
  if(setToken.type==="password"){setToken.type="text";toggleTokenEye.textContent="🙈 隐藏令牌";}
  else{setToken.type="password";toggleTokenEye.textContent="👁 显示令牌";}
};
saveGiteeSetBtn.onclick=()=>{
  saveSyncCfg({owner:setOwner.value.trim(),token:setToken.value.trim(),repo:setRepo.value.trim(),filePath:setFilePath.value.trim()||"我的数据库/资料库.json"});
  alert("已保存");
  setLocked(true);
};
gsetClose.onclick=()=>hide(giteeSetBackdrop);
giteeSetBackdrop.onclick=e=>{if(e.target===giteeSetBackdrop)hide(giteeSetBackdrop);};

document.getElementById("openGiteeSyncBtn").onclick=openGiteeSync;
document.getElementById("refreshBtn").onclick=()=>location.reload();

})();
</script>
