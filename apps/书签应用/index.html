<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>分类书签九宫格 · Gitee同步 + ⌘命令面板</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:system-ui,sans-serif;background:#f5f5f5;color:#333;padding:10px;}
h1{text-align:center;font-size:20px;margin-bottom:10px;}

.toolbar{
  display:flex;gap:8px;flex-wrap:wrap;
  justify-content:center;margin-bottom:10px;
}
.toolbar button{
  padding:6px 10px;font-size:14px;border:none;
  border-radius:4px;color:#fff;background:#007bff;cursor:pointer;
}
.toolbar .secondary{background:#6c757d;}
.toolbar .danger{background:#dc3545;}
.toolbar input[type=file]{display:none;}

.categories-container{
  display:flex;flex-direction:column;gap:20px;
}

.category-block{background:transparent;}
.category-block.dragging{opacity:0.4;}

.category-header{
  display:flex;align-items:center;margin-bottom:6px;padding:0 4px;
}
.category-name{font-size:16px;font-weight:600;margin-right:8px;}
.category-actions{margin-left:auto;display:flex;gap:4px;}
.category-actions button{
  padding:2px 6px;font-size:11px;border:none;
  border-radius:4px;color:#fff;background:#6c757d;
}
.category-actions .edit-cat{background:#007bff;}
.category-actions .del-cat{background:#dc3545;}

.grid{
  display:grid;grid-template-columns:repeat(4,1fr);gap:8px;
}

.tile{
  background:#fff;border-radius:8px;padding:8px 4px;
  min-height:80px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;position:relative;
  cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.tile.dragging{opacity:0.4;}

.tile-logo{
  width:32px;height:32px;border-radius:8px;background:#ddd;
  display:flex;align-items:center;justify-content:center;
  font-weight:bold;color:#fff;margin-bottom:4px;font-size:16px;
  overflow:hidden;
}
.tile-logo img{width:100%;height:100%;object-fit:cover;}
.tile-title{
  font-size:12px;text-align:center;max-height:32px;overflow:hidden;
}

.tile-actions{
  position:absolute;top:4px;right:4px;display:flex;gap:4px;
  opacity:0;transition:.2s;
}
.tile:hover .tile-actions,
.tile.show-actions .tile-actions{opacity:1;}
.tile-actions button{
  padding:2px 4px;font-size:10px;border:none;
  border-radius:3px;background:rgba(0,0,0,.5);color:#fff;
}

/* 通用弹窗 */
.modal-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.4);
  display:none;align-items:center;justify-content:center;z-index:1000;
}
.modal{
  background:#fff;border-radius:8px;padding:16px;width:90%;
  max-width:360px;box-shadow:0 2px 8px rgba(0,0,0,.2);
}
.modal h2{font-size:16px;margin-bottom:10px;}
.modal label{font-size:13px;margin:6px 0 2px;display:block;}
.modal input{
  width:100%;padding:6px 8px;font-size:14px;
  border:1px solid #ccc;border-radius:4px;
}
.modal-buttons{
  margin-top:12px;display:flex;justify-content:flex-end;gap:8px;
}
.modal-buttons button{
  padding:6px 10px;border:none;border-radius:4px;color:#fff;
}
.modal-buttons .cancel{background:#6c757d;}
.modal-buttons .ok{background:#007bff;}

.category-select{position:relative;display:flex;align-items:center;}
.category-select input{flex:1;}
.dropdown-btn{
  margin-left:6px;padding:4px 8px;font-size:14px;
  border:1px solid #ccc;background:#eee;border-radius:4px;cursor:pointer;
}
.dropdown-menu{
  position:absolute;top:38px;left:0;right:0;background:#fff;
  border:1px solid #ccc;border-radius:6px;max-height:200px;
  overflow-y:auto;display:none;z-index:2000;
}
.dropdown-menu div{padding:8px;cursor:pointer;}
.dropdown-menu div:hover{background:#f0f0f0;}

/* ---------- Gitee 同步弹窗（独立样式） ---------- */
.gitee-sync-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
  z-index:1500;padding:16px;
}
.gitee-sync-box{
  background:#fff;border-radius:12px;width:100%;max-width:420px;
  max-height:85vh;display:flex;flex-direction:column;
  box-shadow:0 8px 30px rgba(0,0,0,.3);overflow:hidden;
}
.gitee-sync-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid #eee;
}
.gitee-sync-header h2{font-size:17px;font-weight:600;}
.gitee-sync-close{
  border:none;background:transparent;font-size:22px;
  cursor:pointer;color:#888;line-height:1;
}
.gitee-sync-body{
  padding:14px 18px;overflow-y:auto;flex:1;
  display:flex;flex-direction:column;gap:12px;
}
.sync-info-bar{
  background:#f8f9fa;border-radius:8px;padding:10px 12px;
  font-size:13px;line-height:1.7;color:#444;border:1px solid #e9ecef;
}
.sync-info-bar span{color:#007bff;font-weight:500;}
.sync-tip{
  font-size:12px;color:#888;line-height:1.6;
  border-left:3px solid #007bff;padding-left:10px;background:#fafcff;
  padding:8px 10px;border-radius:4px;
}
.sync-status{
  font-size:13px;padding:8px 12px;border-radius:6px;
  background:#e8f5e9;color:#2e7d32;display:none;
}
.sync-status.error{background:#ffebee;color:#c62828;}
.sync-status.show{display:block;}
.sync-file-list{
  display:none;flex-direction:column;gap:6px;
  max-height:160px;overflow-y:auto;border:1px solid #eee;
  border-radius:8px;padding:6px;background:#fafafa;
}
.sync-file-list.show{display:flex;}
.sync-file-item{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 10px;border-radius:6px;cursor:pointer;
  font-size:13px;background:#fff;border:1px solid #eee;
  transition:background .15s;
}
.sync-file-item:hover{background:#f0f7ff;border-color:#b3d4ff;}
.sync-file-item .fname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.sync-file-item .fsize{color:#888;font-size:11px;flex-shrink:0;margin-left:8px;}

.sync-footer{
  display:flex;gap:8px;padding:12px 18px;border-top:1px solid #eee;
  flex-wrap:wrap;
}
.sync-footer button{
  flex:1;padding:9px 0;font-size:14px;border:none;border-radius:8px;
  color:#fff;cursor:pointer;font-weight:500;
  transition:opacity .15s;
}
.sync-footer button:disabled{opacity:.55;cursor:not-allowed;}
.sync-footer .btn-sync{background:#007bff;}
.sync-footer .btn-upload{background:#28a745;}
.sync-footer .btn-download{background:#fd7e14;}

/* 下载选择小窗 */
.dl-pick-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.45);
  display:none;align-items:center;justify-content:center;
  z-index:1600;padding:16px;
}
.dl-pick-box{
  background:#fff;border-radius:12px;width:100%;max-width:340px;
  overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.3);
}
.dl-pick-header{
  padding:14px 16px;border-bottom:1px solid #eee;
  font-size:14px;font-weight:600;
  display:flex;justify-content:space-between;align-items:center;
  gap:10px;
}
.dl-pick-header .dl-meta{font-size:11px;color:#888;font-weight:400;flex-shrink:0;}
.dl-pick-body{padding:8px 12px 14px;display:flex;flex-direction:column;gap:8px;}
.dl-pick-body button{
  width:100%;padding:11px 0;border:none;border-radius:8px;
  font-size:14px;cursor:pointer;font-weight:500;
}
.dl-pick-body .dl-main{background:#007bff;color:#fff;}
.dl-pick-body .dl-import{background:#f0f0f0;color:#333;}
.dl-pick-body .dl-cancel{background:transparent;color:#888;font-weight:400;}

/* ---------- ⌘ 命令面板 ---------- */
.cmd-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.35);
  display:none;align-items:flex-start;justify-content:center;
  z-index:1700;padding:16px;padding-top:18vh;
}
.cmd-box{
  background:#fff;border-radius:14px;width:100%;max-width:520px;
  overflow:hidden;box-shadow:0 12px 40px rgba(0,0,0,.35);
  display:flex;flex-direction:column;
}
.cmd-list{max-height:340px;overflow-y:auto;padding:8px;}
.cmd-item{
  display:flex;align-items:center;gap:12px;
  padding:12px 14px;border-radius:10px;cursor:pointer;
  transition:background .12s;
}
.cmd-item .cmd-icon{font-size:18px;width:24px;text-align:center;flex-shrink:0;}
.cmd-item .cmd-text{flex:1;min-width:0;}
.cmd-item .cmd-label{font-size:14px;font-weight:500;color:#222;}
.cmd-item .cmd-desc{font-size:11px;color:#999;margin-top:1px;}
.cmd-item.sel{background:#eaf3ff;}
.cmd-item.danger .cmd-label{color:#dc3545;}
.cmd-item.danger.sel,
.cmd-item.danger:hover{background:#fdecea;}
.cmd-empty{
  padding:28px 12px;text-align:center;color:#aaa;font-size:14px;
}

/* ---------- Gitee 设置弹窗（带锁） ---------- */
.gitee-set-backdrop{
  position:fixed;inset:0;background:rgba(0,0,0,.5);
  display:none;align-items:center;justify-content:center;
  z-index:1800;padding:16px;
}
.gitee-set-box{
  background:#fff;border-radius:12px;width:100%;max-width:400px;
  max-height:88vh;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 8px 30px rgba(0,0,0,.3);
}
.gitee-set-header{
  padding:14px 18px;border-bottom:1px solid #eee;
  display:flex;justify-content:space-between;align-items:center;
}
.gitee-set-header h2{font-size:16px;font-weight:600;}
.gitee-set-header .g-close{
  border:none;background:transparent;font-size:22px;color:#888;cursor:pointer;
}
.gitee-set-body{
  padding:14px 18px;overflow-y:auto;position:relative;flex:1;
}
.gitee-set-body .unlock-row{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:10px;
  position: relative;
  z-index: 30;
  background: #fff;
  padding: 4px 2px;
  border-radius: 6px;
}
.gitee-set-body .unlock-btn{
  padding:6px 14px;border:none;border-radius:6px;
  background:#007bff;color:#fff;font-size:13px;cursor:pointer;
  font-weight: 500;
  box-shadow:0 2px 8px rgba(0,123,255,.45);
  transition: background .15s, box-shadow .15s;
  position: relative;
  z-index: 31;
}
.gitee-set-body .unlock-btn:hover{background:#0069d9;}
.gitee-set-body .unlock-btn:disabled{
  background:#ccc;cursor:not-allowed;box-shadow:none;
}
.gitee-set-body .lock-overlay{
  position:absolute;inset:0;background:rgba(245,245,245,.72);
  display:none;align-items:center;justify-content:center;
  flex-direction:column;gap:8px;border-radius:0 0 12px 12px;
  z-index: 20;
  pointer-events: none;
}
.gitee-set-body .lock-overlay.show{display:flex;}
.gitee-set-body .lock-overlay .lock-icon{font-size:28px;}
.gitee-set-body .lock-overlay .lock-text{font-size:14px;color:#666;}

.gitee-set-body .form-group{margin-bottom:10px;}
.gitee-set-body .form-group label{
  display:block;font-size:12px;color:#666;margin-bottom:4px;
}
.gitee-set-body .form-group input{
  width:100%;padding:7px 10px;font-size:14px;
  border:1px solid #ccc;border-radius:6px;background:#fff;
}
.gitee-set-body .form-group input:disabled{background:#f2f2f2;color:#999;}
.gitee-set-body .token-row{display:flex;gap:6px;align-items:center;}
.gitee-set-body .token-row input{flex:1;}
.gitee-set-body #toggleTokenEye{
  padding:6px 10px;font-size:12px;border:1px solid #ccc;
  border-radius:6px;background:#f8f8f8;cursor:pointer;white-space:nowrap;
}
.gitee-set-footer{
  padding:12px 18px;border-top:1px solid #eee;
  display:flex;gap:8px;align-items:center;
}
.gitee-set-footer button#saveGiteeSet{
  flex:1;padding:9px 0;border:none;border-radius:8px;
  background:#007bff;color:#fff;font-size:14px;font-weight:500;cursor:pointer;
}
.gitee-set-footer button#saveGiteeSet:disabled{
  background:#ccc;cursor:not-allowed;
}
.gitee-set-hint{
  font-size:11px;color:#999;padding:0 18px 14px;line-height:1.6;
}

</style>

<script>
if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js");
}
</script>
</head>

<body>

<h1>分类书签九宫格</h1>

<!-- 顶部工具栏：☰  ⚙️ Gitee  ⌘  🔄 -->
<div class="toolbar" style="gap:10px;">
  <button id="addBookmarkBtn">＋ 书签</button>
  <button id="giteeSyncBtn" class="secondary" title="Gitee 同步">⚙️ Gitee</button>
  <button id="cmdPanelBtn" class="secondary" title="⌘ 命令面板">⌘</button>
  <button id="refreshBtn" class="secondary" title="刷新">🔄</button>
</div>

<!-- 原有分类与书签展示 -->
<div id="categoriesContainer" class="categories-container"></div>

<!-- ========== 添加/编辑书签弹窗 ========== -->
<div id="modalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="modalTitle">添加书签</h2>
    <label>分类：</label>
    <div class="category-select">
      <input type="text" id="inputCategory" placeholder="选择或输入分类（留空为默认）" />
      <button id="categoryDropdownBtn" class="dropdown-btn">▼</button>
      <div id="categoryDropdownMenu" class="dropdown-menu"></div>
    </div>
    <label>标题（可选）：</label>
    <input type="text" id="inputTitle" placeholder="例如：B站" />
    <label>网址：</label>
    <input type="text" id="inputUrl" placeholder="https://..." />
    <label>说明（可选）：</label>
    <input type="text" id="inputDesc" placeholder="例如：常用视频网站" />
    <div class="modal-buttons">
      <button class="cancel" id="cancelModal">取消</button>
      <button class="ok" id="okModal">确定</button>
    </div>
  </div>
</div>

<!-- 编辑分类弹窗 -->
<div id="categoryModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2 id="categoryModalTitle">编辑分类</h2>
    <label>分类名称：</label>
    <input type="text" id="inputCategoryName" />
    <div class="modal-buttons">
      <button class="cancel" id="cancelCategoryModal">取消</button>
      <button class="ok" id="okCategoryModal">确定</button>
    </div>
  </div>
</div>

<!-- 书签说明弹窗 -->
<div id="descModalBackdrop" class="modal-backdrop">
  <div class="modal">
    <h2>书签说明</h2>
    <p id="descContent" style="font-size:14px;line-height:1.6;"></p>
    <div class="modal-buttons">
      <button class="cancel" id="closeDescModal">关闭</button>
      <button class="ok" id="visitLinkBtn">继续访问</button>
    </div>
  </div>
</div>

<!-- ========== Gitee 同步弹窗 ========== -->
<div class="gitee-sync-backdrop" id="giteeSyncBackdrop">
  <div class="gitee-sync-box">
    <div class="gitee-sync-header">
      <h2>Gitee 同步</h2>
      <button class="gitee-sync-close" id="giteeSyncClose">✕</button>
    </div>
    <div class="gitee-sync-body">
      <!-- ① 账号信息条 -->
      <div class="sync-info-bar" id="syncInfoBar">
        账号：<span id="syncOwner">--</span> ｜ 仓库：<span id="syncRepo">--</span><br>
        主文件：<span id="syncFilePath">我的数据库/资料库.json</span>
      </div>
      <!-- ② 功能提示条 -->
      <div class="sync-tip">
        ☁️ 一键同步：智能比较本地与远端，自动选择方向<br>
        ⬆ 上传：选择本地 JSON，按日期自动编号备份<br>
        ⬇ 下载：列出远端 .json 文件，选择下载或导入
      </div>
      <!-- ③ 状态消息条 -->
      <div class="sync-status" id="syncStatus"></div>
      <!-- ④ 远端文件列表 -->
      <div class="sync-file-list" id="syncFileList"></div>
    </div>
    <div class="sync-footer">
      <button class="btn-sync" id="btnSync">☁️ 一键同步</button>
      <button class="btn-upload" id="btnUpload">⬆ 上传</button>
      <button class="btn-download" id="btnDownload">⬇ 下载</button>
    </div>
  </div>
</div>

<!-- 下载选择小窗 -->
<div class="dl-pick-backdrop" id="dlPickBackdrop">
  <div class="dl-pick-box">
    <div class="dl-pick-header">
      <span id="dlPickName">文件名</span>
      <span class="dl-meta" id="dlPickSize"></span>
    </div>
    <div class="dl-pick-body">
      <button class="dl-main" id="dlToPhone">📱 下载到手机</button>
      <button class="dl-import" id="dlImportLib">📥 导入资料库</button>
      <button class="dl-cancel" id="dlCancel">取消</button>
    </div>
  </div>
</div>

<!-- ========== ⌘ 命令面板 ========== -->
<div class="cmd-backdrop" id="cmdBackdrop">
  <div class="cmd-box">
    <div class="cmd-list" id="cmdList"></div>
  </div>
</div>

<!-- ========== Gitee 设置弹窗（带锁） ========== -->
<div class="gitee-set-backdrop" id="giteeSetBackdrop">
  <div class="gitee-set-box">
    <div class="gitee-set-header">
      <h2>⚙️ Gitee 设置</h2>
      <button class="g-close" id="giteeSetClose">✕</button>
    </div>
    <div class="gitee-set-body" id="giteeSetBody">
      <div class="unlock-row">
        <span style="font-size:13px;color:#888;">🔒 设置已锁定</span>
        <button class="unlock-btn" id="unlockGiteeSet">● 开启</button>
      </div>
      <div class="form-group">
        <label>Gitee 用户名（owner）</label>
        <input type="text" id="setOwner" disabled />
      </div>
      <div class="form-group">
        <label>私人令牌（token）</label>
        <div class="token-row">
          <input type="password" id="setToken" disabled />
          <button id="toggleTokenEye">👁 显示令牌</button>
        </div>
      </div>
      <div class="form-group">
        <label>仓库名（repo）</label>
        <input type="text" id="setRepo" disabled />
      </div>
      <div class="form-group">
        <label>文件路径（filePath）</label>
        <input type="text" id="setFilePath" disabled placeholder="我的数据库/资料库.json" />
      </div>
      <div class="lock-overlay show" id="lockOverlay">
        <div class="lock-icon">🔒</div>
        <div class="lock-text">设置已锁定</div>
      </div>
    </div>
    <div class="gitee-set-footer">
      <button id="saveGiteeSet" disabled>保存设置</button>
    </div>
    <div class="gitee-set-hint">
      在 gitee.com → 设置 → 安全设置 → 私人令牌 生成；仓库建议设为私有。
    </div>
  </div>
</div>

<script>
/* ============================================================
   原有书签核心逻辑 + Gitee 同步 + 命令面板 + 设置弹窗
   所有函数统一挂载到 window 上以便跨模块调用
   ============================================================ */
(function(){
  "use strict";

  /* ---------- 原有书签数据与渲染 ---------- */
  const STORAGE_KEY = "catBookmarks_v4";
  let categories = [];
  let editingCatIndex = null;
  let editingBookmark = { catIndex: null, bookmarkIndex: null };

  const container = document.getElementById("categoriesContainer");
  const addBookmarkBtn = document.getElementById("addBookmarkBtn");
  const importFile = document.getElementById("importFile");

  // 原有 modal 元素
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalTitle = document.getElementById("modalTitle");
  const inputCategory = document.getElementById("inputCategory");
  const inputTitle = document.getElementById("inputTitle");
  const inputUrl = document.getElementById("inputUrl");
  const inputDesc = document.getElementById("inputDesc");
  const cancelModal = document.getElementById("cancelModal");
  const okModal = document.getElementById("okModal");

  const catModalBackdrop = document.getElementById("categoryModalBackdrop");
  const inputCategoryName = document.getElementById("inputCategoryName");
  const cancelCategoryModal = document.getElementById("cancelCategoryModal");
  const okCategoryModal = document.getElementById("okCategoryModal");

  const dropdownBtn = document.getElementById("categoryDropdownBtn");
  const dropdownMenu = document.getElementById("categoryDropdownMenu");

  const descModalBackdrop = document.getElementById("descModalBackdrop");
  const descContent = document.getElementById("descContent");
  const closeDescModal = document.getElementById("closeDescModal");
  const visitLinkBtn = document.getElementById("visitLinkBtn");
  let currentVisitUrl = "";

  // 基础工具函数
  function escapeHtml(t) {
    return String(t).replace(/[&<>"']/g, m => (
      { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]
    ));
  }
  function getInitial(t) {
    t = (t || "?").trim();
    return t ? t[0].toUpperCase() : "?";
  }
  function getColor(t) {
    t = t || "?";
    let h = 0;
    for (let i = 0; i < t.length; i++) h = t.charCodeAt(i) + ((h << 5) - h);
    return `hsl(${Math.abs(h) % 360},60%,55%)`;
  }
  function normalizeUrl(u) {
    u = u.trim();
    return /^https?:\/\//i.test(u) ? u : "https://" + u;
  }
  function favicon(u) {
    try {
      const host = new URL(u).hostname;
      return `https://www.google.com/s2/favicons?domain=${host}&sz=64`;
    } catch (e) { return ""; }
  }

  // 保存到 localStorage
  function save() {

    if (s) {

        categories = JSON.parse(s) || [];

          (cat.bookmarks || []).forEach(b => {

  // 渲染分类与书签
  function render() {
    container.innerHTML = "";
    categories.forEach((cat, ci) => {
      const block = document.createElement("div");
      block.className = "category-block";
      block.draggable = true;
      block.dataset.index = ci;

      block.addEventListener("dragstart", e => {
        block.classList.add("dragging");
        e.dataTransfer.setData("text/plain", ci);
      });
      block.addEventListener("dragend", () => block.classList.remove("dragging"));
      block.addEventListener("dragover", e => {
        e.preventDefault();
        const dragging = document.querySelector(".category-block.dragging");
        if (!dragging) return;
        const blocks = [...container.children];
        const currentIndex = blocks.indexOf(block);
        const draggingIndex = blocks.indexOf(dragging);
        if (currentIndex !== draggingIndex) {
          if (currentIndex > draggingIndex) container.insertBefore(dragging, block.nextSibling);
          else container.insertBefore(dragging, block);
        }
      });
      block.addEventListener("drop", () => {
        const newOrder = [...container.children].map(b => categories[b.dataset.index]);
        categories = newOrder;
        save(); render();
      });

      const header = document.createElement("div");
      header.className = "category-header";
      header.innerHTML = `
        <span class="category-name">${escapeHtml(cat.name)}</span>
        <div class="category-actions">
          <button class="edit-cat" data-i="${ci}">改</button>
          <button class="del-cat" data-i="${ci}">删</button>
        </div>
      `;

      const grid = document.createElement("div");
      grid.className = "grid";
      (cat.bookmarks || []).forEach((b, bi) => grid.appendChild(createTile(ci, bi, b)));

      block.appendChild(header);
      block.appendChild(grid);
      container.appendChild(block);
    });

    document.querySelectorAll(".edit-cat").forEach(btn => {
      btn.onclick = () => openEditCategory(+btn.dataset.i);
    });
    document.querySelectorAll(".del-cat").forEach(btn => {
      btn.onclick = () => {
        const i = +btn.dataset.i;
        if (confirm(`删除分类“${categories[i].name}”？`)) {
          categories.splice(i, 1);
          save(); render();
        }
      };
    });
  }

  // 书签 tile
  function createTile(ci, bi, b) {
    const t = document.createElement("div");
    t.className = "tile";
    t.draggable = true;
    t.dataset.ci = ci;
    t.dataset.bi = bi;

    t.addEventListener("dragstart", () => t.classList.add("dragging"));
    t.addEventListener("dragend", () => t.classList.remove("dragging"));
    t.addEventListener("dragover", e => {
      e.preventDefault();
      const dragging = document.querySelector(".tile.dragging");
      if (!dragging) return;
      const grid = t.parentElement;
      const tiles = [...grid.children];
      const currentIndex = tiles.indexOf(t);
      const draggingIndex = tiles.indexOf(dragging);
      if (currentIndex !== draggingIndex) {
        if (currentIndex > draggingIndex) grid.insertBefore(dragging, t.nextSibling);
        else grid.insertBefore(dragging, t);
      }
    });
    t.addEventListener("drop", () => {
      const grid = t.parentElement;
      const newOrder = [...grid.children].map(tile => {
        const cci = tile.dataset.ci;
        const bbi = tile.dataset.bi;
        return categories[cci].bookmarks[bbi];
      });
      categories[ci].bookmarks = newOrder;
      save(); render();
    });

    t.onclick = e => {
      if (t.classList.contains("show-actions")) {
        currentVisitUrl = b.url;
        descContent.textContent = b.desc || "无说明";
        descModalBackdrop.style.display = "flex";
        t.classList.remove("show-actions");
      } else {
        document.querySelectorAll(".tile.show-actions").forEach(x => x.classList.remove("show-actions"));
        t.classList.add("show-actions");
      }
    };

    const logo = document.createElement("div");
    logo.className = "tile-logo";
    if (b.favicon) {
      const img = document.createElement("img");
      img.src = b.favicon;
      img.onerror = () => {
        logo.textContent = getInitial(b.title || b.url);
        logo.style.background = getColor(b.title || b.url);
      };
      logo.appendChild(img);
    } else {
      logo.textContent = getInitial(b.title || b.url);
      logo.style.background = getColor(b.title || b.url);
    }

    const title = document.createElement("div");
    title.className = "tile-title";
    title.textContent = b.title || b.url;

    const act = document.createElement("div");
    act.className = "tile-actions";

    const eBtn = document.createElement("button");
    eBtn.textContent = "改";
    eBtn.onclick = e => { e.stopPropagation(); openEditBookmark(ci, bi); };

    const dBtn = document.createElement("button");
    dBtn.textContent = "删";
    dBtn.onclick = e => {
      e.stopPropagation();
      if (confirm("删除书签？")) {
        categories[ci].bookmarks.splice(bi, 1);
        save(); render();
      }
    };

    act.append(eBtn, dBtn);
    t.append(logo, title, act);
    return t;
  }

  /* ============================================================
      Gitee 同步 & 设置 & 命令面板相关底层
     ============================================================ */
  // ---------- 安全 base64 与 JSON ----------
  function safeBtoa(str) {
    try { return btoa(unescape(encodeURIComponent(str))); }
    catch (e) { console.warn('safeBtoa error', e); return ''; }
  }
  function safeAtob(b64) {
    try { return decodeURIComponent(escape(atob(b64))); }
    catch (e) { console.warn('safeAtob error', e); return ''; }
  }
  function safeParseJSON(str, fallback = null) {
    try { return JSON.parse(str); }
    catch (e) { console.warn('safeParseJSON error', e); return fallback; }
  }

  // ---------- 配置读写 ----------
  const SYNC_CFG_KEY = 'my_notes_gitee_cfg';
  function getSyncCfg() {
    const raw = localStorage.getItem(SYNC_CFG_KEY);
    return safeParseJSON(raw, { owner: '', token: '', repo: '', filePath: '我的数据库/资料库.json' }) || {};
  }
  function saveSyncCfg(cfg) {
    localStorage.setItem(SYNC_CFG_KEY, JSON.stringify(cfg));
  }

  // ---------- 编码路径 ----------
  function encodeGiteePath(path) {
    return path.split('/').map(encodeURIComponent).join('/');
  }

  // ---------- Gitee API 封装 ----------
  async function giteeGet(path, cfg) {
    const { owner, repo, token } = cfg;
    if (!owner || !repo || !token) throw new Error('缺少 Gitee 配置');
    const url = `https://gitee.com/api/v5/repos/${owner}/${repo}/contents/${encodeGiteePath(path)}?access_token=${token}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`GET ${path} 失败: ${res.status}`);
    return res.json();
  }

  async function giteePut(path, contentB64, message, cfg) {
    const { owner, repo, token } = cfg;
    const url = `https://gitee.com/api/v5/repos/${owner}/${repo}/contents/${encodeGiteePath(path)}`;
    // 先尝试获取 sha（如果文件存在）
    let sha = null;
    try {
      const exist = await giteeGet(path, cfg);
      if (exist && exist.sha) sha = exist.sha;
    } catch (e) { /* 文件不存在 */ }
    const body = { access_token: token, content: contentB64, message: message || 'update via app' };
    if (sha) body.sha = sha;
    const res = await fetch(url, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    if (!res.ok) throw new Error(`PUT ${path} 失败: ${res.status}`);
    return res.json();
  }

  async function giteeListDir(dirPath, cfg) {
    const { owner, repo, token } = cfg;
    const url = `https://gitee.com/api/v5/repos/${owner}/${repo}/contents/${encodeGiteePath(dirPath)}?access_token=${token}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`列表 ${dirPath} 失败: ${res.status}`);
    return res.json();
  }

  // 获取文件内容并解码（返回文本）
  async function getGiteeFileContent(path, cfg) {
    const data = await giteeGet(path, cfg);
    if (!data || !data.content) throw new Error('文件内容为空');
    return safeAtob(data.content.replace(/\s/g, ''));
  }

  // ---------- 数据清洗 ----------
  function sanitizeNote(note) {
    if (!note || typeof note !== 'object') return null;
    const { history, ...rest } = note;
    return {
      title: String(rest.title || '未命名').trim(),
      url: String(rest.url || '').trim(),
      desc: String(rest.desc || '').trim(),
      favicon: String(rest.favicon || '').trim(),
    };
  }

  function dedupeNotesByTitle(notes) {
    const map = new Map();
    for (const n of notes) {
      if (!n || !n.title) continue;
      const key = n.title.trim().toLowerCase();
      if (!map.has(key)) map.set(key, n);
    }
    return [...map.values()];
  }

  const EMPTY_PLACEHOLDER = '{"notes":[]}';

  // 构建用于同步的 payload（标题去重、无 history）
  function buildSyncPayload(notes) {
    const clean = notes
      .filter(n => n && n.title && n.url)
      .map(sanitizeNote)
      .filter(Boolean);
    return JSON.stringify({ notes: dedupeNotesByTitle(clean) }, null, 2);
  }

  // 当前本地书签转化为 notes 数组
  function categoriesToNotes() {
    const notes = [];
    categories.forEach(cat => {
      (cat.bookmarks || []).forEach(b => {
        notes.push({
          title: b.title || b.url || '未命名',
          url: b.url || '',
          desc: b.desc || '',
          favicon: b.favicon || '',
          updatedAt: b.updatedAt || new Date().toISOString(),
        });
      });
    });
    return notes;
  }

  // 将 notes 合并回 categories
  function mergeNotesIntoCategories(notes) {
    if (!Array.isArray(notes)) return;
    // 收集现有分类名
    const catMap = new Map();
    categories.forEach(c => catMap.set(c.name, c));
    notes.forEach(n => {
      if (!n.title || !n.url) return;
      const catName = n.category || '导入';
      let cat = catMap.get(catName);
      if (!cat) {
        cat = { name: catName, bookmarks: [] };
        catMap.set(catName, cat);
        categories.push(cat);
      }
      // 简单判重（url + title）
      const exist = cat.bookmarks.some(b => b.url === n.url && b.title === n.title);
      if (!exist) {
        cat.bookmarks.push({
          title: n.title, url: n.url, desc: n.desc || '',
          favicon: n.favicon || favicon(n.url),
          updatedAt: n.updatedAt,
        });
      }
    });
  }

  /* ============================================================
      Gitee 同步弹窗交互
     ============================================================ */
  const giteeSyncBackdrop = document.getElementById('giteeSyncBackdrop');
  const giteeSyncClose = document.getElementById('giteeSyncClose');
  const syncOwner = document.getElementById('syncOwner');
  const syncRepo = document.getElementById('syncRepo');
  const syncFilePath = document.getElementById('syncFilePath');
  const syncStatus = document.getElementById('syncStatus');
  const syncFileList = document.getElementById('syncFileList');
  const btnSync = document.getElementById('btnSync');
  const btnUpload = document.getElementById('btnUpload');
  const btnDownload = document.getElementById('btnDownload');

  function openGiteeSync() {
    const cfg = getSyncCfg();
    syncOwner.textContent = cfg.owner || '未配置';
    syncRepo.textContent = cfg.repo || '未配置';
    syncFilePath.textContent = cfg.filePath || '我的数据库/资料库.json';
    syncStatus.classList.remove('show', 'error');
    syncFileList.classList.remove('show');
    syncFileList.innerHTML = '';
    giteeSyncBackdrop.style.display = 'flex';
  }
  function closeGiteeSync() { giteeSyncBackdrop.style.display = 'none'; }

  giteeSyncClose.onclick = closeGiteeSync;
  giteeSyncBackdrop.onclick = e => { if (e.target === giteeSyncBackdrop) closeGiteeSync(); };

  // 状态消息
  function setSyncStatus(msg, isError) {
    syncStatus.textContent = msg;
    syncStatus.classList.add('show');
    syncStatus.classList.toggle('error', !!isError);
  }

  // ☁️ 一键同步
  btnSync.onclick = async () => {
    const cfg = getSyncCfg();
    if (!cfg.owner || !cfg.token || !cfg.repo) {
      setSyncStatus('❌ 请先在 Gitee 设置中配置账号、令牌和仓库', true);
      return;
    }
    btnSync.disabled = true;
    try {
      setSyncStatus('⏳ 正在读取远端主文件...');
      let remoteNotes = [];
      let remoteValid = false;
      try {
        const text = await getGiteeFileContent(cfg.filePath, cfg);
        const parsed = safeParseJSON(text, null);
        if (parsed && Array.isArray(parsed.notes)) {
          remoteNotes = parsed.notes;
          remoteValid = remoteNotes.length > 0;
        }
      } catch (e) { /* 远端无效 */ }

      const localNotes = categoriesToNotes();

      if (!remoteValid) {
        setSyncStatus('📤 远端为空，自动上传本地数据...');
        const payload = buildSyncPayload(localNotes);
        await giteePut(cfg.filePath, safeBtoa(payload), 'sync: 初始上传', cfg);
        setSyncStatus('✅ 远端无有效数据，已上传本地');
        return;
      }

      // 比较数量和最新 updatedAt
      const remoteCount = remoteNotes.length;
      const localCount = localNotes.length;
      const remoteLatest = remoteNotes.reduce((max, n) => Math.max(max, new Date(n.updatedAt || 0).getTime()), 0);
      const localLatest = localNotes.reduce((max, n) => Math.max(max, new Date(n.updatedAt || 0).getTime()), 0);

      if (remoteCount >= localCount && remoteLatest >= localLatest) {
        if (confirm('远端数据较新且数量不少于本地，是否用远端覆盖本地？\n（取消则改为上传本地覆盖远端）')) {
          // 远端覆盖本地
          categories = [];
          mergeNotesIntoCategories(remoteNotes);
          save(); render();
          setSyncStatus('✅ 已用远端覆盖本地');
        } else {
          if (confirm('确定用本地数据覆盖远端吗？')) {
            const payload = buildSyncPayload(localNotes);
            await giteePut(cfg.filePath, safeBtoa(payload), 'sync: 本地覆盖远端', cfg);
            setSyncStatus('✅ 已用本地覆盖远端');
          } else {
            setSyncStatus('⏹ 已取消');
          }
        }
      } else {
        // 本地更新或更多 → 上传
        setSyncStatus('📤 本地数据较新，正在上传...');
        const payload = buildSyncPayload(localNotes);
        await giteePut(cfg.filePath, safeBtoa(payload), 'sync: 上传本地', cfg);
        setSyncStatus('✅ 已上传本地到远端');
      }
    } catch (e) {
      console.error(e);
      setSyncStatus('❌ ' + (e.message || '同步失败'), true);
    } finally {
      btnSync.disabled = false;
    }
  };

  // ⬆ 上传
  btnUpload.onclick = async () => {
    const cfg = getSyncCfg();
    if (!cfg.owner || !cfg.token || !cfg.repo) {
      setSyncStatus('❌ 请先在 Gitee 设置中配置账号、令牌和仓库', true);
      return;
    }
    btnUpload.disabled = true;
    try {
      // 选择本地 JSON
      const fileInput = document.createElement('input');
      fileInput.type = 'file';
      fileInput.accept = '.json,application/json';
      const file = await new Promise(res => {
        fileInput.onchange = e => res(e.target.files[0]);
        fileInput.click();
      });
      if (!file) { setSyncStatus('⏹ 未选择文件'); return; }

      const prefix = prompt('输入文件名前缀（如 A厂、资料库）', '资料库');
      if (!prefix || !prefix.trim()) { setSyncStatus('⏹ 已取消上传'); return; }

      const text = await file.text();
      const parsed = safeParseJSON(text, null);
      if (!parsed || !Array.isArray(parsed.notes)) {
        setSyncStatus('❌ 文件格式不正确，需要 { notes: [...] }', true);
        return;
      }

      // 查远端目录，自动编号
      const dir = cfg.filePath.substring(0, cfg.filePath.lastIndexOf('/')) || '';
      let existingNames = [];
      try {
        const list = await giteeListDir(dir, cfg);
        if (Array.isArray(list)) existingNames = list.map(item => item.name);
      } catch (e) { /* 目录可能不存在 */ }

      const today = new Date().toISOString().slice(0, 10);
      const base = prefix.trim() + '-' + today;
      let seq = 1, finalName;
      do {
        finalName = base + 'T' + seq + '.json';
        seq++;
      } while (existingNames.includes(finalName));

      const targetPath = (dir ? dir + '/' : '') + finalName;
      const payload = JSON.stringify({ notes: parsed.notes }, null, 2);
      setSyncStatus('⏳ 正在上传 ' + finalName + ' ...');
      await giteePut(targetPath, safeBtoa(payload), 'upload: ' + finalName, cfg);
      setSyncStatus('✅ 已上传 ' + finalName);
    } catch (e) {
      console.error(e);
      setSyncStatus('❌ 上传失败：' + (e.message || ''), true);
    } finally {
      btnUpload.disabled = false;
    }
  };

  // ⬇ 下载
  btnDownload.onclick = async () => {
    const cfg = getSyncCfg();
    if (!cfg.owner || !cfg.token || !cfg.repo) {
      setSyncStatus('❌ 请先在 Gitee 设置中配置账号、令牌和仓库', true);
      return;
    }
    btnDownload.disabled = true;
    try {
      const dir = cfg.filePath.substring(0, cfg.filePath.lastIndexOf('/')) || '';
      setSyncStatus('⏳ 正在获取文件列表...');
      const list = await giteeListDir(dir, cfg);
      const jsonFiles = (Array.isArray(list) ? list : [])
        .filter(item => item.name.endsWith('.json'))
        .sort((a, b) => b.name.localeCompare(a.name));

      if (jsonFiles.length === 0) {
        setSyncStatus('⚠️ 远端没有 .json 文件');
        return;
      }

      syncFileList.innerHTML = '';
      jsonFiles.forEach(f => {
        const row = document.createElement('div');
        row.className = 'sync-file-item';
        row.innerHTML = `<span class="fname">${escapeHtml(f.name)}</span><span class="fsize">${(f.size / 1024).toFixed(1)} KB</span>`;
        row.onclick = () => openDlPick(f, cfg);
        syncFileList.appendChild(row);
      });
      syncFileList.classList.add('show');
      setSyncStatus('✅ 请选择要下载的文件');
    } catch (e) {
      console.error(e);
      setSyncStatus('❌ 获取列表失败：' + (e.message || ''), true);
    } finally {
      btnDownload.disabled = false;
    }
  };

  /* ---------- 下载选择小窗 ---------- */
  const dlPickBackdrop = document.getElementById('dlPickBackdrop');
  const dlPickName = document.getElementById('dlPickName');
  const dlPickSize = document.getElementById('dlPickSize');
  const dlToPhone = document.getElementById('dlToPhone');
  const dlImportLib = document.getElementById('dlImportLib');
  const dlCancel = document.getElementById('dlCancel');
  let currentDlFile = null;
  let currentDlCfg = null;

  function openDlPick(file, cfg) {
    currentDlFile = file;
    currentDlCfg = cfg;
    dlPickName.textContent = file.name;
    dlPickSize.textContent = (file.size / 1024).toFixed(1) + ' KB';
    dlPickBackdrop.style.display = 'flex';
  }
  function closeDlPick() {
    dlPickBackdrop.style.display = 'none';
    currentDlFile = null;
    currentDlCfg = null;
  }

  dlCancel.onclick = closeDlPick;
  dlPickBackdrop.onclick = e => { if (e.target === dlPickBackdrop) closeDlPick(); };

  // 下载到手机
  dlToPhone.onclick = async () => {
    if (!currentDlFile || !currentDlCfg) return;
    try {
      const cfg = currentDlCfg;
      const text = await getGiteeFileContent(currentDlFile.path, cfg);
      const blob = new Blob([text], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = currentDlFile.name;
      a.click();
      URL.revokeObjectURL(url);
      closeDlPick();
      setSyncStatus('✅ 已下载 ' + currentDlFile.name);
    } catch (e) {
      console.error(e);
      setSyncStatus('❌ 下载失败：' + (e.message || ''), true);
    }
  };

  // 导入资料库
  dlImportLib.onclick = async () => {
    if (!currentDlFile || !currentDlCfg) return;
    if (!confirm(`确定导入 “${currentDlFile.name}” 并覆盖当前资料库吗？`)) return;
    try {
      const cfg = currentDlCfg;
      const text = await getGiteeFileContent(currentDlFile.path, cfg);
      const parsed = safeParseJSON(text, null);
      if (!parsed || !Array.isArray(parsed.notes)) {
        alert('文件格式错误：缺少 notes 数组');
        return;
      }
      // 清洗并合并
      const cleanNotes = parsed.notes.map(sanitizeNote).filter(Boolean);
      const deduped = dedupeNotesByTitle(cleanNotes);
      categories = [];
      mergeNotesIntoCategories(deduped);
      save(); render();
      closeDlPick();
      closeGiteeSync();
      alert('✅ 导入成功');
    } catch (e) {
      console.error(e);
      setSyncStatus('❌ 导入失败：' + (e.message || ''), true);
    }
  };

  /* ============================================================
      ⌘ 命令面板
     ============================================================ */
  const cmdBackdrop = document.getElementById('cmdBackdrop');
  const cmdList = document.getElementById('cmdList');

  const CMD_ITEMS = [
    { id: 'gitee', label: '⚙️ Gitee 设置', desc: '配置仓库 · 导入 · 导出', run: () => openGiteeSet() },
    { id: 'import', label: '📥 导入 JSON', desc: '从文件合并到资料库', run: () => importJSON() },
    { id: 'export', label: '📤 导出 JSON', desc: '导出到本地文件', run: () => exportJSON() },
    { id: 'clear', label: '⚠️ 清空数据', desc: '删除全部资料（不可恢复）', run: () => openClearData(), danger: true },
  ];

  let cmdVisible = false;
  let cmdSelIndex = 0;

  function openCmd() {
    cmdVisible = true;
    cmdBackdrop.style.display = 'flex';
    renderCmd('');
    setTimeout(() => {
      const first = cmdList.querySelector('.cmd-item');
      if (first) { cmdSelIndex = 0; first.classList.add('sel'); }
    }, 50);
  }

  function closeCmd() {
    cmdVisible = false;
    cmdBackdrop.style.display = 'none';
  }

  function renderCmd(q) {
    const query = (q || '').trim().toLowerCase();
    const filtered = query
      ? CMD_ITEMS.filter(it => it.label.toLowerCase().includes(query) || it.desc.toLowerCase().includes(query))
      : CMD_ITEMS;

    cmdList.innerHTML = '';
    if (filtered.length === 0) {
      cmdList.innerHTML = '<div class="cmd-empty">无匹配</div>';
      return;
    }

    filtered.forEach((it, idx) => {
      const el = document.createElement('div');
      el.className = 'cmd-item' + (it.danger ? ' danger' : '') + (idx === cmdSelIndex ? ' sel' : '');
      el.dataset.id = it.id;
      el.innerHTML = `
        <span class="cmd-icon">${it.label.slice(0, 2)}</span>
        <div class="cmd-text">
          <div class="cmd-label">${it.label.slice(2)}</div>
          <div class="cmd-desc">${it.desc}</div>
        </div>
      `;
      el.onclick = (e) => {
        e.stopPropagation();
        closeCmd();
        setTimeout(() => it.run(), 50);
      };
      cmdList.appendChild(el);
    });
  }

  // 键盘 ↑↓ Enter Esc
  document.addEventListener('keydown', (e) => {
    if (!cmdVisible) {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') {
        e.preventDefault();
        openCmd();
      }
      return;
    }
    const items = [...cmdList.querySelectorAll('.cmd-item')];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      cmdSelIndex = (cmdSelIndex + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
      items.forEach((el, i) => el.classList.toggle('sel', i === cmdSelIndex));
      items[cmdSelIndex]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      const sel = items[cmdSelIndex];
      if (sel) sel.click();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      closeCmd();
    }
  });

  // 点击遮罩关闭
  cmdBackdrop.onclick = (e) => { if (e.target === cmdBackdrop) closeCmd(); };

  // 外部按钮打开命令面板
  document.getElementById('cmdPanelBtn').onclick = () => openCmd();

  // 快捷键 Ctrl/⌘+K 注册完成

  /* ============================================================
      Gitee 设置弹窗（带锁）
     ============================================================ */
  const giteeSetBackdrop = document.getElementById('giteeSetBackdrop');
  const giteeSetClose = document.getElementById('giteeSetClose');
  const giteeSetBody = document.getElementById('giteeSetBody');
  const setOwner = document.getElementById('setOwner');
  const setToken = document.getElementById('setToken');
  const setRepo = document.getElementById('setRepo');
  const setFilePath = document.getElementById('setFilePath');
  const unlockGiteeSet = document.getElementById('unlockGiteeSet');
  const lockOverlay = document.getElementById('lockOverlay');
  const saveGiteeSet = document.getElementById('saveGiteeSet');
  const toggleTokenEye = document.getElementById('toggleTokenEye');

  let isLocked = true;
  let lockTimer = null;

  function resetLockTimer() {
    if (lockTimer) clearTimeout(lockTimer);
    lockTimer = setTimeout(() => {
      if (!isLocked) setLocked(true);
    }, 10000);
  }

  function setLocked(locked) {
    isLocked = locked;
    [setOwner, setToken, setRepo, setFilePath].forEach(el => el.disabled = locked);
    saveGiteeSet.disabled = locked;
    unlockGiteeSet.disabled = !locked;
    lockOverlay.classList.toggle('show', locked);
    if (locked) {
      unlockGiteeSet.textContent = '● 开启';
    } else {
      unlockGiteeSet.textContent = '🔓 已解锁';
      resetLockTimer();
    }
  }

  unlockGiteeSet.onclick = () => {
    if (isLocked) {
      setLocked(false);
      setOwner.focus();
    } else {
      setLocked(true);
    }
  };

  // 加载配置到设置弹窗
  function loadGiteeSetFields() {
    const cfg = getSyncCfg();
    setOwner.value = cfg.owner || '';
    setToken.value = cfg.token || '';
    setRepo.value = cfg.repo || '';
    setFilePath.value = cfg.filePath || '我的数据库/资料库.json';
  }

  function openGiteeSet() {
    loadGiteeSetFields();
    setLocked(true);
    giteeSetBackdrop.style.display = 'flex';
  }
  function closeGiteeSet() {
    giteeSetBackdrop.style.display = 'none';
    if (lockTimer) clearTimeout(lockTimer);
  }

  giteeSetClose.onclick = closeGiteeSet;
  giteeSetBackdrop.onclick = e => { if (e.target === giteeSetBackdrop) closeGiteeSet(); };

  // 令牌可见切换
  toggleTokenEye.onclick = () => {
    if (setToken.type === 'password') {
      setToken.type = 'text';
      toggleTokenEye.textContent = '🙈 隐藏令牌';
    } else {
      setToken.type = 'password';
      toggleTokenEye.textContent = '👁 显示令牌';
    }
  };

  // 保存设置
  saveGiteeSet.onclick = () => {
    const cfg = {
      owner: setOwner.value.trim(),
      token: setToken.value.trim(),
      repo: setRepo.value.trim(),
      filePath: setFilePath.value.trim() || '我的数据库/资料库.json',
    };
    if (!cfg.owner || !cfg.token || !cfg.repo) {
      alert('用户名、令牌、仓库名不能为空');
      return;
    }
    saveSyncCfg(cfg);
    alert('✅ 设置已保存');
    setLocked(true);
  };

  // 命令面板用到的导入/导出/清空
  function importJSON() {
    const fileInput = document.createElement('input');
    fileInput.type = 'file';
    fileInput.accept = '.json,application/json';
    fileInput.onchange = async (e) => {
      const f = e.target.files[0];
      if (!f) return;
      try {
        const text = await f.text();
        const data = safeParseJSON(text, null);
        if (!data || !Array.isArray(data.notes)) {
          alert('文件格式不正确，需要 { notes: [...] }');
          return;
        }
        const clean = data.notes.map(sanitizeNote).filter(Boolean);
        const deduped = dedupeNotesByTitle(clean);
        mergeNotesIntoCategories(deduped);
        save(); render();
        alert('✅ 导入成功');
      } catch (err) {
        alert('导入失败：' + (err.message || 'JSON 解析错误'));
      }
    };
    fileInput.click();
  }

  function exportJSON() {
    const notes = categoriesToNotes();
    const payload = buildSyncPayload(notes);
    const blob = new Blob([payload], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'notes_' + new Date().toISOString().slice(0, 10) + '.json';
    a.click();
    URL.revokeObjectURL(url);
  }

  function openClearData() {
    const input = prompt('请输入「清空」以确认删除所有数据（分类和Gitee设置将保留）');
    if (input !== '清空') { alert('已取消'); return; }
    if (!confirm('再次确认：删除全部书签和分类？此操作不可恢复！')) return;
    categories = [];
    save(); render();
    alert('✅ 已清空');
  }

  // 顶部 Gitee 同步按钮
  document.getElementById('giteeSyncBtn').onclick = () => openGiteeSync();

  // 刷新按钮
  document.getElementById('refreshBtn').onclick = () => {
    if (confirm('刷新页面？')) location.reload();
  };

  // 挂载全局供命令面板调用
  window.openGiteeSet = openGiteeSet;
  window.importJSON = importJSON;
  window.exportJSON = exportJSON;
  window.openClearData = openClearData;

  // 启动
  initData();

  // 全局按 Esc 关闭所有弹窗（按层级）
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    if (cmdVisible) { closeCmd(); return; }
    if (giteeSetBackdrop.style.display === 'flex') { closeGiteeSet(); return; }
    if (dlPickBackdrop.style.display === 'flex') { closeDlPick(); return; }
    if (giteeSyncBackdrop.style.display === 'flex') { closeGiteeSync(); return; }
  });

})();
</script>

</body>
</html>
