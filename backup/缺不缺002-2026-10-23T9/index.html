<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fdfbf6">
<title>缺不缺</title>
<style>
:root{
  --ink:#33312e;--ink2:#6b6660;--ink3:#a8a29a;
  --paper:#fdfbf6;--paper2:#f5f1e8;--card:#fff;
  --line:#e2dcd0;--line2:#c9c3b8;
  --red:#c0392b;--redbg:#fdf3f1;
  --blue:#2c6fb1;--bluebg:#eef4fa;
  --green:#3d8b5f;--greenbg:#eef6f0;
  --amber:#c98a1b;--amberbg:#fdf7ea;
  --gray:#8a8580;--graybg:#f2f0eb;
  --sh:0 1px 3px rgba(51,49,46,.06),0 6px 20px rgba(51,49,46,.05);
}
[data-theme=dark]{
  --ink:#ece7dd;--ink2:#a8a29a;--ink3:#6b6660;
  --paper:#1a1917;--paper2:#242320;--card:#22211e;
  --line:#35332f;--line2:#4a4741;
  --red:#e8705f;--redbg:#2e1f1c;
  --blue:#6fa8dc;--bluebg:#1b2632;
  --green:#6fbf8f;--greenbg:#1c2a20;
  --amber:#e0b155;--amberbg:#2b2519;
  --gray:#8a8580;--graybg:#2a2825;
  --sh:0 1px 3px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--paper);color:var(--ink);line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -webkit-user-select:none;user-select:none;touch-action:manipulation;
}
input{-webkit-user-select:text;user-select:text;font-family:inherit;border:0;outline:0;background:0;color:inherit;width:100%}
input::placeholder{color:var(--ink3)}
button{font-family:inherit;cursor:pointer;border:0;background:0;color:inherit;font-size:inherit}

#err{position:fixed;top:0;left:0;right:0;z-index:999;background:#c0392b;color:#fff;font-size:12px;line-height:1.5;padding:8px 14px;display:none;word-break:break-all;max-height:40vh;overflow:auto}

#app{max-width:520px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--paper);position:relative;overflow:hidden}

.topbar{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 16px 10px;border-bottom:1px solid var(--line);background:var(--paper)}
.topbar h1{font-size:17px;font-weight:800;flex:1;letter-spacing:.3px}
.ibtn{width:36px;height:36px;border-radius:10px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--ink2);transition:background .15s}
.ibtn:active{background:var(--paper2)}
.ibtn.on{color:var(--amber)}

.views{flex:1;position:relative;overflow:hidden}
.view{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:90px;opacity:0;pointer-events:none;transition:opacity .16s}
.view.on{opacity:1;pointer-events:auto}

.tabbar{flex:0 0 auto;display:flex;background:var(--paper);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:10.5px;color:var(--ink3);border-radius:10px;transition:color .15s}
.tabbar button .g{font-size:19px;line-height:1}
.tabbar button.on{color:var(--ink);font-weight:700}

.searchbox{display:flex;align-items:center;gap:8px;margin:14px 16px 12px;padding:10px 14px;background:var(--paper2);border:1px solid var(--line);border-radius:12px}
.searchbox .ico{font-size:15px;color:var(--ink3);flex:0 0 auto}
.searchbox input{font-size:14px}
.searchbox .clr{flex:0 0 auto;font-size:15px;color:var(--ink3);width:22px;height:22px;display:none;align-items:center;justify-content:center}
.searchbox.has .clr{display:flex}

.chips{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 14px}
.chip{font-size:12.5px;padding:5px 13px;border-radius:20px;border:1.3px solid var(--line2);color:var(--ink2);background:var(--card);white-space:nowrap;transition:all .15s}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:700}
.chip.amber{border-color:var(--amber);color:var(--amber);background:var(--amberbg)}
.chip.blue{border-color:var(--blue);color:var(--blue);background:var(--bluebg)}
.chip.red{border-color:var(--red);color:var(--red);background:var(--redbg)}
.chip.gray{border-color:var(--gray);color:var(--gray);background:var(--graybg)}
.chip.on.amber,.chip.on.blue,.chip.on.red,.chip.on.gray{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .x{opacity:.7;margin-left:4px;font-size:11px}

.vcard{display:flex;flex-direction:column;gap:8px;margin:0 16px 10px;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);text-align:left;width:calc(100% - 32px);transition:transform .12s,border-color .15s}
.vcard:active{transform:scale(.985);border-color:var(--line2)}
.vcard .hd{display:flex;align-items:center;gap:8px}
.dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
.dot.fat{background:var(--amber)}
.dot.water{background:var(--blue)}
.dot.hist{background:var(--gray)}
.vcard .hd strong{font-size:15.5px;font-weight:800}
.vcard .hd .tag{margin-left:auto;font-size:10.5px;padding:2px 9px;border-radius:20px;border:1px solid var(--line2);color:var(--ink3)}
.vcard .hd .tag.hist{border-color:var(--gray);color:var(--gray);background:var(--graybg)}
.vcard .hd .fav{font-size:14px;color:var(--amber);margin-left:4px}
.vcard .tags{display:flex;flex-wrap:wrap;gap:5px}
.vcard .tags span{font-size:11.5px;padding:2.5px 9px;border-radius:6px;background:var(--paper2);color:var(--ink2)}
.vcard .role{font-size:12.5px;color:var(--ink2);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.vcard.hist{opacity:.85}

.empty{text-align:center;padding:60px 30px;color:var(--ink3)}
.empty .big{font-size:40px;margin-bottom:12px;opacity:.4}
.empty p{font-size:13.5px;line-height:1.7}

.overlay{position:fixed;inset:0;z-index:50;background:var(--paper);display:flex;flex-direction:column;max-width:520px;margin:0 auto;transform:translateY(100%);transition:transform .26s cubic-bezier(.32,.72,0,1);visibility:hidden}
.overlay.on{transform:translateY(0);visibility:visible}
.dtop{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 14px 12px;border-bottom:1px solid var(--line);background:var(--paper)}
.dtop .back{display:flex;align-items:center;gap:4px;font-size:14px;color:var(--ink2);padding:6px 10px 6px 0}
.dtop .sp{flex:1}
.dbody{flex:1;overflow-y:auto;padding:0 16px 40px;-webkit-overflow-scrolling:touch}

.hero{padding:20px 0 18px;border-bottom:2px solid var(--ink)}
.hero.hist{border-bottom-color:var(--gray)}
.hero h2{font-size:23px;font-weight:900;line-height:1.25}
.hero .alias{font-size:12.5px;color:var(--ink2);margin-top:4px}

/* 三档摄取量卡片 */
.intake{display:flex;gap:8px;margin-top:14px}
.intake .box{
  flex:1;padding:11px 12px;border-radius:12px;
  background:var(--paper2);border:1px solid var(--line);
  text-align:center;
}
.intake .box.rec{background:var(--bluebg);border-color:var(--blue)}
.intake .box.ideal{background:var(--greenbg);border-color:var(--green)}
.intake .box.ul{background:var(--redbg);border-color:var(--red)}
.intake .box .lb{
  font-size:10px;font-weight:800;letter-spacing:.8px;
  margin-bottom:5px;
}
.intake .box.rec .lb{color:var(--blue)}
.intake .box.ideal .lb{color:var(--green)}
.intake .box.ul .lb{color:var(--red)}
.intake .box .vl{
  font-size:11.5px;font-weight:700;color:var(--ink);
  line-height:1.4;font-family:ui-monospace,monospace;
}
.hero .meta{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}
.hero .meta span{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line2);color:var(--ink2)}
.hero .meta span.hist{border-color:var(--gray);color:var(--gray);background:var(--graybg)}

.hist-warn{margin-top:16px;padding:12px 14px;background:var(--graybg);border-radius:12px;border-left:3px solid var(--gray);font-size:12.5px;color:var(--gray);line-height:1.7}
.hist-warn .t{font-weight:800;color:var(--ink);display:block;margin-bottom:3px}

.blk{margin-top:22px}
.blk-hd{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:800;letter-spacing:1.2px;margin-bottom:10px}
.blk-hd::before{content:"";width:3px;height:14px;background:var(--ink);border-radius:2px}
.blk-hd .fold{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:0}
.rlist{display:flex;flex-direction:column;gap:7px}
.rlist li{list-style:none;font-size:13.5px;color:var(--ink2);line-height:1.65;padding-left:16px;position:relative}
.rlist li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;border-radius:50%;background:var(--line2)}
.drow{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
.drow:last-child{border-bottom:0}
.drow .k{flex:0 0 52px;font-size:12.5px;font-weight:800;padding-top:1px}
.drow .v{flex:1;font-size:13px;color:var(--ink2);line-height:1.65}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pills span{font-size:12px;padding:4px 12px;border-radius:20px;background:var(--paper2);border:1px solid var(--line);color:var(--ink2)}
.warn{border:1.3px dashed var(--red);border-radius:12px;padding:11px 14px;font-size:12.5px;color:var(--red);background:var(--redbg);line-height:1.7}
.warn .t{font-weight:800;display:block;margin-bottom:3px}
.note{margin-top:22px;padding:12px 14px;background:var(--paper2);border-radius:12px;font-size:12px;color:var(--ink2);line-height:1.7;border-left:3px solid var(--line2)}

.labref{border:1px solid var(--blue);border-radius:12px;padding:12px 14px;background:var(--bluebg);margin-top:10px}
.labref .title{font-size:12px;font-weight:800;color:var(--blue);margin-bottom:8px;letter-spacing:.5px}
.labref .item{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dashed rgba(44,111,177,.2);font-size:12.5px}
.labref .item:last-child{border-bottom:0}
.labref .item .lbl{color:var(--ink2)}
.labref .item .val{font-weight:700;color:var(--blue);font-family:ui-monospace,monospace}
.labref .hint{font-size:10.5px;color:var(--ink3);margin-top:8px;line-height:1.6}

ont-size:12.5px;font-weight:800;letter-spacing:1.2px;margin:16px 16px 10px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:3px;height:13px;background:var(--ink);border-radius:2px}
.sec .fold{margin-left:auto;font-size:11px;color:var(--ink3);font-weight:400;letter-spacing:0}

.result{display:flex;flex-direction:column;gap:8px;margin:0 16px 10px;padding:14px 15px;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh);text-align:left;width:calc(100% - 32px)}
.result:active{transform:scale(.985)}
.result .top{display:flex;align-items:center;gap:9px}
.result .rank{width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.result .nm{font-size:15px;font-weight:800}
.result .pct{margin-left:auto;font-size:13px;font-weight:800;color:var(--red)}
.meter{height:6px;background:var(--paper2);border-radius:4px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--red);opacity:.75;border-radius:4px;transition:width .35s}
.result .why{font-size:11.5px;color:var(--ink3);line-height:1.6}

.slots{display:flex;gap:7px;flex-wrap:wrap;padding:0 16px 16px}
.cmpwrap{margin:0 16px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);box-shadow:var(--sh)}
.cmptable{display:flex;overflow-x:auto;-webkit-overflow-scrolling:touch}
.cmpcol{flex:1;min-width:130px;border-right:1px solid var(--line)}
.cmpcol:last-child{border-right:0}
.cmph{font-size:13px;font-weight:800;text-align:center;padding:12px 6px;background:var(--paper2);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:center;gap:6px}
.cmph .dot{width:7px;height:7px}
.cmpcell{padding:12px 11px;font-size:12px;color:var(--ink2);line-height:1.65;border-bottom:1px dashed var(--line);min-height:64px}
.cmpcell:last-child{border-bottom:0}
.cmplbl{flex:0 0 52px;background:var(--paper2);display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;text-align:center;padding:8px 4px}
.cmplbl.sp{min-height:52px}

.diff{margin:20px 16px 0;padding:14px 16px;background:var(--paper2);border-radius:12px;border-left:3px solid var(--ink);font-size:13px;color:var(--ink2);line-height:1.75}
.diff .t{font-weight:800;color:var(--ink);display:block;margin-bottom:4px;font-size:12.5px}

.picker{position:fixed;inset:0;z-index:60;background:rgba(30,28,26,.4);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.picker.on{opacity:1;pointer-events:auto}
.ppanel{width:100%;max-width:520px;max-height:70vh;background:var(--paper);border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom);transform:translateY(30px);transition:transform .24s cubic-bezier(.32,.72,0,1)}
.picker.on .ppanel{transform:translateY(0)}
.phd{display:flex;align-items:center;padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.phd h3{font-size:16px;font-weight:800;flex:1}
.phd button{font-size:14px;color:var(--ink2);padding:4px 8px}
.plist{overflow-y:auto;padding:8px 0 24px;-webkit-overflow-scrolling:touch}
.pitem{display:flex;align-items:center;gap:11px;padding:13px 20px;width:100%;text-align:left;transition:background .12s}
.pitem:active{background:var(--paper2)}
.pitem .nm{font-size:14.5px;font-weight:600;flex:1}
.pitem .ty{font-size:11px;color:var(--ink3)}
.pitem .ck{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:13px;color:transparent}
.pitem.sel .ck{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.pitem.sel{background:var(--paper2)}

@keyframes fu{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.vcard,.result{animation:fu .28s ease both}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:3px}
</style>
</head>
<body>

<div id="err"></div>

<div id="app">
  <header class="topbar">
    <h1 id="ttl">缺不缺</h1>
    <button class="ibtn" id="favBtn">☆</button>
    <button class="ibtn" id="themeBtn">☾</button>
  </header>

  <div class="views">
    <section class="view on" id="vList">
      <div class="searchbox" id="sb1">
        <span class="ico">⌕</span>
        <input type="search" id="s1" placeholder="搜索名称 / 症状，如「夜盲」「口臭」" autocomplete="off">
        <button class="clr" data-clr="s1">✕</button>
      </div>
      <div class="chips" id="fchips">
        <button class="chip on" data-f="all">全部</button>
        <button class="chip" data-f="fat">脂溶性</button>
        <button class="chip" data-f="water">水溶性</button>
        <button class="chip" data-f="hist">历史维生素</button>
      </div>
      <div id="listBox"></div>
    </section>

    <section class="view" id="vSym">
      <div class="searchbox" id="sb2">
        <span class="ico">⌕</span>
        <input type="search" id="s2" placeholder="描述症状，如「口臭」「白头发」" autocomplete="off">
        <button class="clr" data-clr="s2">✕</button>
      </div>

      <div class="sec">选择部位</div>
      <div class="chips" id="pchips">
        <button class="chip" data-p="全身">全身</button>
        <button class="chip" data-p="眼睛">眼</button>
        <button class="chip" data-p="皮肤">皮肤</button>
        <button class="chip" data-p="头发指甲">头发指甲</button>
        <button class="chip" data-p="口腔">口腔</button>
        <button class="chip" data-p="神经">神经</button>
        <button class="chip" data-p="血液">血液</button>
        <button class="chip" data-p="骨骼">骨骼</button>
        <button class="chip" data-p="消化">消化</button>
        <button class="chip" data-p="其他">其他</button>
      </div>

      <div class="sec">具体症状 <span class="fold" id="symFold"></span></div>
      <div class="chips" id="schips"></div>

      <div class="sec">匹配结果 <span class="fold">按可能性排序</span></div>
      <div id="mBox"></div>
    </section>

    <section class="view" id="vCmp">
      <div class="sec" style="margin-top:16px">已选 <span class="fold">最多 3 个</span></div>
      <div class="slots" id="slots"></div>
      <div id="cmpBox"></div>
    </section>
  </div>

  <nav class="tabbar">
    <button class="on" data-t="list"><span class="g">▦</span>查维生素</button>
    <button data-t="sym"><span class="g">◐</span>症状反查</button>
    <button data-t="cmp"><span class="g">⇄</span>对比</button>
  </nav>
</div>

<div class="overlay" id="ov">
  <div class="dtop">
    <button class="back" id="ovBack">← 返回</button>
    <div class="sp"></div>
    <button class="ibtn" id="ovFav">☆</button>
  </div>
  <div class="dbody" id="ovBody"></div>
</div>

<div class="picker" id="pk">
  <div class="ppanel">
    <div class="phd">
      <h3>选择维生素</h3>
      <button id="pkClose">完成</button>
    </div>
    <div class="plist" id="pkList"></div>
  </div>
</div>

<script>
window.onerror = function(msg, url, line){
  var e = document.getElementById('err');
  e.style.display = 'block';
  e.textContent = '脚本错误：' + msg + ' （行 ' + line + '）';
  return false;
};

(function(){
'use strict';

var MEM = {};
var STORE = {
  get: function(k){ try { return localStorage.getItem(k); } catch(e){ return MEM[k] || null; } },
  set: function(k, v){ try { localStorage.setItem(k, v); } catch(e){ MEM[k] = v; } }
};

/* ==================== 数据 ====================
   rda   = 推荐摄入量（中国 DRIs）
   ideal = 理想摄取量（优化健康范围，参考 NIH ODS 与临床研究）
   upperLimit = 可耐受最高摄入量
================================================ */
var DATA = [
  {
    id:'vit-a', name:'维生素 A', alias:'视黄醇 / Retinol', type:'fat', hist:false,
    rda:'800 微克 RAE/日',
    ideal:'900 - 1500 微克 RAE/日',
    upperLimit:'3000 微克/日',
    roles:['合成视紫红质，维持暗光视力','维护上皮组织（皮肤、黏膜）完整性','参与糖蛋白合成与生长发育'],
    deficiency:[
      {part:'眼睛', items:['夜盲症','干眼病','角膜软化，严重可致失明']},
      {part:'皮肤', items:['毛囊周围角化过度（鸡皮疙瘩样）','皮肤干燥粗糙']},
      {part:'免疫/生长', items:['免疫力下降','儿童生长发育迟缓']}
    ],
    sources:['动物肝脏','鱼肝油','蛋黄','黄油','胡萝卜','南瓜','菠菜'],
    excess:['长期超量可致头痛、肝损伤、骨痛','孕期过量有致畸风险'],
    keywords:[
      '夜盲','夜盲症','晚上看不清','暗光看不清','看不清','视力下降','夜视力差',
      '干眼','干眼症','眼干','眼涩','眼睛干','角膜软化','角膜干燥','毕脱斑','畏光','流泪',

function $(s){ return document.querySelector(s); }
function $$(s){ return Array.prototype.slice.call(document.querySelectorAll(s)); }
function each(list, fn){ for(var i=0;i<list.length;i++) fn(list[i], i); }
function closest(el, sel){
  while(el && el !== document){
    if(el.matches && el.matches(sel)) return el;
    if(el.msMatchesSelector && el.msMatchesSelector(sel)) return el;
    if(el.webkitMatchesSelector && el.webkitMatchesSelector(sel)) return el;
    el = el.parentNode;
  }
  return null;
}
function byId(id){
  for(var i=0;i<DATA.length;i++){ if(DATA[i].id===id) return DATA[i]; }
  return null;
}
function tLabel(t){ return t==='fat' ? '脂溶性' : '水溶性'; }
function esc(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function toast(msg){
  var d = document.createElement('div');
  d.textContent = msg;
  d.style.cssText = 'position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:9px 18px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none;max-width:80%;text-align:center';
  document.body.appendChild(d);
  setTimeout(function(){ d.style.opacity='1'; }, 20);
  setTimeout(function(){ d.style.opacity='0'; setTimeout(function(){ d.remove(); }, 300); }, 1500);
}

function renderList(){
  var q = st.query.trim().toLowerCase();
  var out = [];
  for(var i=0;i<DATA.length;i++){
    var v = DATA[i];
    if(st.filter==='hist'){ if(!v.hist) continue; }
    else if(st.filter!=='all'){ if(v.type!==st.filter || v.hist) continue; }
    if(st.favOnly && st.favs.indexOf(v.id)<0) continue;
    if(q){
      var hay = (v.name + ' ' + v.alias + ' ' + v.keywords.join(' ') + ' ' + v.roles.join(' ')).toLowerCase();
      if(hay.indexOf(q)<0) continue;
    }
    out.push(v);
  }

  var box = $('#listBox');
  if(!out.length){
    box.innerHTML = '<div class="empty"><div class="big">◌</div><p>没有找到匹配的维生素<br>试试其他关键词或清除筛选</p></div>';
    return;
  }

  var html = '';
  for(var k=0;k<out.length;k++){
    var v = out[k];
    var tags = '';
    var n = 0;
    for(var a=0;a<v.deficiency.length && n<3;a++){
      for(var b=0;b<v.deficiency[a].items.length && n<3;b++){
        var t = v.deficiency[a].items[b].split('：')[0].split('（')[0];
        tags += '<span>' + esc(t) + '</span>';
        n++;
      }
    }
    var tagCls = v.hist ? 'hist' : '';
    var dotCls = v.hist ? 'hist' : v.type;
    var tagText = v.hist ? '历史' : tLabel(v.type);
    html += '<button class="vcard' + (v.hist ? ' hist' : '') + '" data-id="' + v.id + '">' +
      '<div class="hd">' +
        '<span class="dot ' + dotCls + '"></span>' +
        '<strong>' + esc(v.name) + '</strong>' +
        '<span class="tag ' + tagCls + '">' + tagText + '</span>' +
        (st.favs.indexOf(v.id)>=0 ? '<span class="fav">★</span>' : '') +
      '</div>' +
      '<div class="tags">' + tags + '</div>' +
      '<div class="role">' + esc(v.roles[0]) + '</div>' +
    '</button>';
  }
  box.innerHTML = html;
}

function openDetail(id){
  var v = byId(id);
  if(!v) return;
  st.detailId = id;
  var on = st.favs.indexOf(id)>=0;

function renderSymChips(){
  var box = $('#schips');
  var items = [];
  if(st.symPart && PART_KEYWORDS[st.symPart]){
    items = PART_KEYWORDS[st.symPart].slice();
  }else{
    // 没有选部位时，展示 SIDX 里的关键词（去重后按长度排序）
    items = Object.keys(SIDX).slice(0,40);
  }
  if(!items.length){
    box.innerHTML = '<span style="font-size:12.5px;color:var(--ink3);padding:2px 0">该部位暂无细分症状，可直接在搜索框输入</span>';

  }

  }

function renderMatches(){
  var box = $('#mBox');
  var sel = st.symSel.slice();
  var q = st.symQ.trim();
  if(q && sel.indexOf(q)<0) sel.push(q);

  if(!sel.length){
    box.innerHTML = '<div class="empty" style="padding:36px 20px"><div class="big">◐</div><p>选择症状或输入描述<br>系统会列出可能缺乏的维生素</p></div>';
    $('#symFold').textContent = '';
    return;
  }

  var scores = {};
  for(var i=0;i<sel.length;i++){
    var sym = sel[i];
    if(SIDX[sym]){
      for(var j=0;j<SIDX[sym].length;j++){
        var it = SIDX[sym][j];
        var w = it.w;
        if(it.hist) w = w * 0.3;
        scores[it.id] = (scores[it.id]||0) + w;
      }
    }
    var keys = Object.keys(SIDX);
    for(var k=0;k<keys.length;k++){
      var key = keys[k];
      if(key===sym) continue;
      if(key.indexOf(sym)>=0 || sym.indexOf(key)>=0){
        for(var m=0;m<SIDX[key].length;m++){
          var it2 = SIDX[key][m];
          var w2 = it2.w * 0.55;
          if(it2.hist) w2 = w2 * 0.3;
          scores[it2.id] = (scores[it2.id]||0) + w2;
        }
      }
    }
  }

  var arr = [];
  for(var id in scores){
    if(!scores.hasOwnProperty(id)) continue;
    var v = byId(id);
    if(v) arr.push({v:v, sc:scores[id]});
  }
  arr.sort(function(a,b){ return b.sc - a.sc; });
  arr = arr.slice(0,6);

  if(!arr.length){
    box.innerHTML = '<div class="empty" style="padding:36px 20px"><div class="big">◌</div><p>未匹配到相关维生素<br>试试更常见的症状词</p></div>';
    $('#symFold').textContent = '';
    return;
  }

  var max = arr[0].sc;
  var h = '';
  for(var n=0;n<arr.length;n++){
    var x = arr[n];
    var pct = Math.round(x.sc/max*100);
    var hits = [];
    for(var p=0;p<sel.length;p++){
      var s = sel[p];
      for(var q2=0;q2<x.v.keywords.length;q2++){
        var kk = x.v.keywords[q2];
        if(kk===s || kk.indexOf(s)>=0 || s.indexOf(kk)>=0){ hits.push(s); break; }
      }
    }
    h += '<button class="result" data-id="' + x.v.id + '">' +
      '<div class="top">' +
        '<span class="rank">' + (n+1) + '</span>' +
        '<span class="nm">' + esc(x.v.name) + (x.v.hist ? ' <span style="font-size:10px;color:var(--gray);font-weight:400">历史</span>' : '') + '</span>' +
        '<span class="pct">' + pct + '%</span>' +
      '</div>' +
      '<div class="meter"><i style="width:' + pct + '%"></i></div>' +
      '<div class="why">命中：' + esc(hits.length ? hits.join('、') : '相关症状') + '</div>' +
    '</button>';
  }
  box.innerHTML = h;
  $('#symFold').textContent = '已选 ' + sel.length;
}

    {label:'推荐', get:function(v){ return esc(v.rda); }},

    {label:'上限', get:function(v){ return esc(v.upperLimit); }},

      for(var i=0;i<Math.min(2,v.roles.length);i++) r.push(esc(v.roles[i].split('，')[0]));

    }},
    {label:'缺乏', get:function(v){
      var r = [];
      for(var i=0;i<Math.min(3,v.deficiency.length);i++){
        r.push(esc(v.deficiency[i].items[0].split('：')[0]));
      }
      return r.join(' · ');
    }},
    {label:'来源', get:function(v){
      var r = [];
      for(var i=0;i<Math.min(4,v.sources.length);i++) r.push(esc(v.sources[i]));
      return r.join(' · ');
    }},
    {label:'参考值', get:function(v){
      if(v.labRef && v.labRef.length){
        var res = [];
        for(var i=0;i<v.labRef.length;i++){
          res.push(esc(v.labRef[i].range + ' ' + v.labRef[i].unit));
        }
        return res.join('<br>');
      }
      return '—';
    }}
  ];

  var h2 = '<div class="cmpwrap"><div class="cmptable">';
  h2 += '<div style="display:flex;flex-direction:column;flex:0 0 52px">';
  h2 += '<div class="cmplbl sp" style="background:var(--paper2)"></div>';
  for(var r=0;r<rows.length;r++) h2 += '<div class="cmplbl" style="min-height:64px">' + rows[r].label + '</div>';
  h2 += '</div>';

  for(var c=0;c<vs.length;c++){
    var v = vs[c];
    var dCls = v.hist ? 'hist' : v.type;
    h2 += '<div class="cmpcol">';
    h2 += '<div class="cmph"><span class="dot ' + dCls + '"></span>' + esc(v.name) + '</div>';
    for(var r2=0;r2<rows.length;r2++){
      h2 += '<div class="cmpcell">' + rows[r2].get(v) + '</div>';
    }
    h2 += '</div>';
  }
  h2 += '</div></div>';

  h2 += '<div class="diff"><span class="t">差异速览</span>' + genDiff(vs) + '</div>';
  h2 += '<div style="height:20px"></div>';
  box.innerHTML = h2;
}

function genDiff(vs){
  var parts = [];
  var hasHist = false;
  for(var i=0;i<vs.length;i++){ if(vs[i].hist) hasHist = true; }
  if(hasHist) parts.push('包含历史维生素条目，现代营养学已不将其列为必需维生素。');
  var types = [];
  for(var j=0;j<vs.length;j++){
    if(vs[j].hist) continue;
    if(types.indexOf(vs[j].type)<0) types.push(vs[j].type);
  }
  if(types.length===1) parts.push('临床必需条目均为' + tLabel(types[0]) + '维生素。');
  else if(types.length>1){
    var tl = [];
    for(var k=0;k<types.length;k++) tl.push(tLabel(types[k]));
    parts.push('临床必需条目包含' + tl.join('与') + '维生素，吸收与储存方式不同。');
  }
  var common = [];
  for(var m=0;m<vs[0].sources.length;m++){
    var s = vs[0].sources[m];
    var ok = true;
    for(var n=1;n<vs.length;n++){
      if(vs[n].sources.indexOf(s)<0){ ok = false; break; }
    }
    if(ok) common.push(s);
  }
  if(common.length) parts.push('共同来源：' + common.join('、') + '。');
  return esc(parts.join(''));
}

  var input = $('#' + inputId);

    box.classList.remove('has');
    cb('');

});

$('#pk').addEventListener('click', function(e){
  if(e.target.id==='pk') closePicker();
});
$('#pkList').addEventListener('click', function(e){
  var item = closest(e.target, '[data-pick]');
  if(!item) return;
  var id = item.getAttribute('data-pick');
  var i = st.cmpIds.indexOf(id);
  if(i>=0){ st.cmpIds.splice(i,1); }
  else{
    if(st.cmpIds.length>=3){ toast('最多对比 3 个'); return; }
    st.cmpIds.push(id);
  }
  item.classList.toggle('sel', st.cmpIds.indexOf(id)>=0);
  renderCmp();
});

document.documentElement.setAttribute('data-theme', st.theme);
$('#themeBtn').textContent = st.theme==='dark' ? '☀' : '☾';
renderList();

})();
</script>
