<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>迷你桌面系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <!-- 注意：你实际文件名是 manifest.webmanifest，这里直接引用它，无需重命名 -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      color: #fff;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    /* ============ 桌面根容器 ============ */
    #desktop {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 10%, rgba(59,130,246,0.18), transparent 55%),
        radial-gradient(circle at 80% 90%, rgba(168,85,247,0.16), transparent 55%),
        #020617;
    }

    /* 横向排列所有页的轨道 */
    .pages-track {
      display: flex;
      height: 100%;
      width: 100%;
      will-change: transform;
    }

    /* 单页 */
    .page {
      flex: 0 0 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 28px 14px 96px 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .page::-webkit-scrollbar { display: none; }

    /* ============ 图标网格 ============ */
    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr); /* 小屏默认 4 列 */
      gap: 22px 6px;
      justify-items: center;
      align-items: start;
      min-height: 100%;
      align-content: start;
    }

    @media (min-width: 480px) {
      .icon-grid {
        grid-template-columns: repeat(5, 1fr); /* 大屏 5 列 */
        gap: 26px 10px;
      }
    }

    /* ============ 单个图标 ============ */
    .app-icon {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      position: relative;
      cursor: pointer;
      touch-action: pan-y;
      transition: transform 0.15s ease, opacity 0.2s ease;
      will-change: transform;
    }

    .app-icon img {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      object-fit: cover;
      background: #1e293b;
      box-shadow: 0 6px 14px rgba(0,0,0,0.45);
      pointer-events: none;
      -webkit-user-drag: none;
    }

    @media (min-width: 480px) {
      .app-icon img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
    }

    .app-icon span {
      font-size: 11.5px;
      color: #e2e8f0;
      text-align: center;
      line-height: 1.25;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
      pointer-events: none;
    }

    /* 拖拽中 */
    .app-icon.dragging {
      opacity: 0.85;
      transform: scale(1.12);
      z-index: 999;
    }
    .app-icon.dragging img {
      box-shadow: 0 14px 28px rgba(0,0,0,0.7);
    }

    /* 拖拽时禁止页面滚动干扰 */
    body.dragging-active .page {
      overflow: hidden;
    }

    /* ============ 底部 Dock ============ */
    #dock {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      font-size: 12px;
      color: #cbd5e1;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 50;
    }

    /* ============ 分页指示器 ============ */
    #dots {
      position: fixed;
      left: 50%;
      bottom: 52px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 50;
      pointer-events: none;
    }

    #dots .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(226, 232, 240, 0.3);
      transition: background 0.25s, transform 0.25s;
    }

    #dots .dot.active {
      background: #e2e8f0;
      transform: scale(1.25);
    }

    /* ============ 加载/错误 ============ */
    #loading, #error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #94a3b8;
      background: #020617;
      z-index: 100;
    }
    #error { color: #f87171; }
    .hidden { display: none !important; }

    img {
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>
</head>
<body>

<div id="desktop"></div>

<div id="dots"></div>

<div id="dock">
  <span class="dock-title">迷你桌面</span>
</div>

<div id="loading">正在加载应用列表...</div>
<div id="error" class="hidden">应用列表加载失败，请检查 configuration.json</div>

<script>
/* =========================================================
   配置
========================================================= */
const APPS_JSON_URL = 'configuration.json';
const STORAGE_KEY = 'mini-desktop-order-v1';

// 演示模式：true = 复制数据凑够 3 页，方便测试滑屏/拖拽
// 正式使用请改成 false
const DEMO_MODE = true;

/* =========================================================
   每页容量：由 CSS 列数决定
   - 小屏 4 列 × 5 行 = 20
   - 大屏 5 列 × 5 行 = 25
========================================================= */
function getPageSize() {
  const isBig = window.matchMedia('(min-width: 480px)').matches;
  return isBig ? 25 : 20;
}

/* =========================================================
   状态
========================================================= */
let allApps = [];
let pageCount = 0;
let currentPage = 0;
let pageSize = getPageSize();

const desktopEl = document.getElementById('desktop');
const dotsEl = document.getElementById('dots');
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');

/* =========================================================
   加载数据
========================================================= */
async function loadApps() {
  try {
    const res = await fetch(APPS_JSON_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('网络错误: ' + res.status);
    let apps = await res.json();
    if (!Array.isArray(apps)) throw new Error('configuration.json 格式错误，应为数组');

    apps = apps.filter(a => a && a.name && a.url);

    // 演示模式：复制数据凑够 3 页
    if (DEMO_MODE) {
      const need = getPageSize() * 3;
      const base = apps.slice();
      let i = 0;
      while (apps.length < need && base.length > 0) {
        const src = base[i % base.length];
        apps.push({
          ...src,
          name: src.name + '_' + (Math.floor(i / base.length) + 1)
        });
        i++;
      }
    }

    allApps = applyStoredOrder(apps);
    render();
    loadingEl.classList.add('hidden');
  } catch (e) {
    console.error(e);
    loadingEl.classList.add('hidden');
    errorEl.classList.remove('hidden');
  }
}

/* =========================================================
   持久化：按 name 恢复顺序
========================================================= */
function applyStoredOrder(apps) {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!Array.isArray(saved) || !saved.length) return apps;

    const map = new Map(apps.map(a => [a.name, a]));
    const ordered = [];
    saved.forEach(name => {
      if (map.has(name)) {
        ordered.push(map.get(name));
        map.delete(name);
      }
    });
    map.forEach(a => ordered.push(a));
    return ordered;
  } catch {
    return apps;
  }
}

function saveOrder() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allApps.map(a => a.name)));
  } catch {}
}

/* =========================================================
   渲染
========================================================= */
function render() {
  pageSize = getPageSize();
  pageCount = Math.max(1, Math.ceil(allApps.length / pageSize));
  if (currentPage >= pageCount) currentPage = pageCount - 1;

  const track = document.createElement('div');
  track.className = 'pages-track';

  for (let p = 0; p < pageCount; p++) {
    const page = document.createElement('div');
    page.className = 'page';
    page.dataset.page = p;

    const grid = document.createElement('div');
    grid.className = 'icon-grid';

    const start = p * pageSize;
    const slice = allApps.slice(start, start + pageSize);

    slice.forEach((app, idxInPage) => {
      const globalIndex = start + idxInPage;
      grid.appendChild(createIcon(app, globalIndex));
    });

    page.appendChild(grid);
    track.appendChild(page);
  }

  desktopEl.innerHTML = '';
  desktopEl.appendChild(track);

  renderDots();
  setTrackTransform(-currentPage * window.innerWidth, false);
}

function createIcon(app, globalIndex) {
  const el = document.createElement('div');
  el.className = 'app-icon';
  el.dataset.index = globalIndex;
  el.dataset.name = app.name;

  const img = document.createElement('img');
  img.src = app.icon || 'icon-192.png';
  img.alt = app.name;
  img.draggable = false;

  const label = document.createElement('span');
  label.textContent = app.name;

  el.appendChild(img);
  el.appendChild(label);

  attachIconEvents(el, app);
  return el;
}

function renderDots() {
  dotsEl.innerHTML = '';
  if (pageCount <= 1) return;
  for (let i = 0; i < pageCount; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    dotsEl.appendChild(d);
  }
}

function updateDots() {
  const dots = dotsEl.querySelectorAll('.dot');
  dots.forEach((d, i) => d.classList.toggle('active', i === currentPage));
}

/* =========================================================
   轨道位移
========================================================= */
function setTrackTransform(x, animate = true) {
  const trackEl = desktopEl.querySelector('.pages-track');
  if (!trackEl) return;
  trackEl.style.transition = animate ? 'transform 0.32s cubic-bezier(0.22,0.61,0.36,1)' : 'none';
  trackEl.style.transform = `translateX(${x}px)`;
}

function goToPage(p, animate = true) {
  currentPage = Math.max(0, Math.min(pageCount - 1, p));
  setTrackTransform(-currentPage * window.innerWidth, animate);
  updateDots();
}

/* =========================================================
   滑屏（触摸 + 鼠标）
========================================================= */
let dragPage = {
  active: false,
  startX: 0,
  startY: 0,
  dx: 0,
  dy: 0,
  locked: false,
  startTime: 0
};

function onPointerDown(e) {
  if (e.target.closest('.app-icon.dragging')) return;
  if (longPressState.timer) return;

  const t = e.touches ? e.touches[0] : e;
  dragPage.active = true;
  dragPage.startX = t.clientX;
  dragPage.startY = t.clientY;
  dragPage.dx = 0;
  dragPage.dy = 0;
  dragPage.locked = false;
  dragPage.startTime = Date.now();
}

function onPointerMove(e) {
  if (!dragPage.active) return;
  const t = e.touches ? e.touches[0] : e;
  const dx = t.clientX - dragPage.startX;
  const dy = t.clientY - dragPage.startY;
  dragPage.dx = dx;
  dragPage.dy = dy;

  if (!dragPage.locked) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
      dragPage.locked = true;
      cancelLongPress();
    } else if (Math.abs(dy) > 8) {
      dragPage.active = false;
      return;
    }
  }

  if (dragPage.locked) {
    e.preventDefault?.();
    const base = -currentPage * window.innerWidth;
    let x = base + dx;
    if (currentPage === 0 && dx > 0) x = base + dx * 0.35;
    if (currentPage === pageCount - 1 && dx < 0) x = base + dx * 0.35;
    setTrackTransform(x, false);
  }
}

function onPointerUp() {
  if (!dragPage.active) return;
  dragPage.active = false;
  if (!dragPage.locked) return;

  const dx = dragPage.dx;
  const dt = Date.now() - dragPage.startTime;
  const v = Math.abs(dx) / dt;
  const threshold = window.innerWidth * 0.22;
  const fast = v > 0.45;

  if (dx < -threshold || (fast && dx < -30)) {
    goToPage(currentPage + 1);
  } else if (dx > threshold || (fast && dx > 30)) {
    goToPage(currentPage - 1);
  } else {
    goToPage(currentPage);
  }
  dragPage.locked = false;
}

desktopEl.addEventListener('touchstart', onPointerDown, { passive: true });
desktopEl.addEventListener('touchmove', onPointerMove, { passive: false });
desktopEl.addEventListener('touchend', onPointerUp);
desktopEl.addEventListener('touchcancel', onPointerUp);

desktopEl.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

/* =========================================================
   图标事件：点击 + 长按拖拽
========================================================= */
const longPressState = { timer: null, iconEl: null, app: null, startX: 0, startY: 0 };

function attachIconEvents(el, app) {
  let moved = false;
  let longPressed = false;

  const start = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    moved = false;
    longPressed = false;
    cancelLongPress();

    longPressState.timer = setTimeout(() => {
      longPressed = true;
      enterDragMode(el, app, e);
    }, 300);
  };

  const move = (e) => {
    if (longPressState.timer) {
      const t = e.touches ? e.touches[0] : e;
      const dx = Math.abs(t.clientX - longPressState.startX);
      const dy = Math.abs(t.clientY - longPressState.startY);
      if (dx > 8 || dy > 8) {
        moved = true;
        cancelLongPress();
      }
    }
  };

  const end = () => {
    cancelLongPress();
    if (longPressed) return;
    if (!moved) {
      window.open(app.url, '_blank');
    }
  };

  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    longPressState.startX = t.clientX;
    longPressState.startY = t.clientY;
    start(e);
  }, { passive: true });

  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', () => cancelLongPress());

  el.addEventListener('mousedown', (e) => {
    longPressState.startX = e.clientX;
    longPressState.startY = e.clientY;
    start(e);
  });
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', () => cancelLongPress());
}

function cancelLongPress() {
  if (longPressState.timer) {
    clearTimeout(longPressState.timer);
    longPressState.timer = null;
  }
}

/* =========================================================
   拖拽模式（单页内排序）
========================================================= */
let drag = {
  active: false,
  iconEl: null,
  ghostEl: null,
  startIndex: -1,
  currentIndex: -1,
  offsetX: 0,
  offsetY: 0,
  pageEl: null
};

function enterDragMode(el, app, e) {
  if (drag.active) return;

  const t = e.touches ? e.touches[0] : e;
  const rect = el.getBoundingClientRect();

  drag.active = true;
  drag.iconEl = el;
  drag.startIndex = parseInt(el.dataset.index, 10);
  drag.currentIndex = drag.startIndex;
  drag.offsetX = t.clientX - rect.left;
  drag.offsetY = t.clientY - rect.top;
  drag.pageEl = el.closest('.page');

  document.body.classList.add('dragging-active');

  const ghost = el.cloneNode(true);
  ghost.classList.add('dragging');
  ghost.style.position = 'fixed';
  ghost.style.left = (t.clientX - drag.offsetX) + 'px';
  ghost.style.top = (t.clientY - drag.offsetY) + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  ghost.style.pointerEvents = 'none';
  ghost.style.zIndex = '9999';
  document.body.appendChild(ghost);
  drag.ghostEl = ghost;

  el.style.opacity = '0.25';

  if (navigator.vibrate) navigator.vibrate(15);

  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('touchend', onDragEnd);
  document.addEventListener('touchcancel', onDragEnd);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

function onDragMove(e) {
  if (!drag.active) return;
  e.preventDefault?.();

  const t = e.touches ? e.touches[0] : e;
  const gx = t.clientX - drag.offsetX;
  const gy = t.clientY - drag.offsetY;

  drag.ghostEl.style.left = gx + 'px';
  drag.ghostEl.style.top = gy + 'px';

  const elBelow = document.elementFromPoint(t.clientX, t.clientY);
  const targetIcon = elBelow?.closest('.app-icon');

  if (targetIcon && targetIcon !== drag.iconEl && drag.pageEl.contains(targetIcon)) {
    const targetIndex = parseInt(targetIcon.dataset.index, 10);
    if (targetIndex !== drag.currentIndex) {
      swapInData(drag.currentIndex, targetIndex);
      drag.currentIndex = targetIndex;
      reorderDOM(drag.pageEl);
    }
  }
}

function swapInData(a, b) {
  if (a < 0 || b < 0 || a >= allApps.length || b >= allApps.length) return;
  [allApps[a], allApps[b]] = [allApps[b], allApps[a]];
}

function reorderDOM(pageEl) {
  const grid = pageEl.querySelector('.icon-grid');
  const pageIndex = parseInt(pageEl.dataset.page, 10);
  const start = pageIndex * pageSize;
  const slice = allApps.slice(start, start + pageSize);

  grid.innerHTML = '';
  slice.forEach((app, i) => {
    const el = createIcon(app, start + i);
    if (start + i === drag.currentIndex) {
      el.style.opacity = '0.25';
    }
    grid.appendChild(el);
  });
}

function onDragEnd() {
  if (!drag.active) return;
  drag.active = false;

  document.body.classList.remove('dragging-active');

  if (drag.ghostEl) {
    drag.ghostEl.remove();
    drag.ghostEl = null;
  }

  render();
  saveOrder();

  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);
  document.removeEventListener('touchcancel', onDragEnd);
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);

  drag.iconEl = null;
  drag.pageEl = null;
  drag.startIndex = -1;
  drag.currentIndex = -1;
}

/* =========================================================
   窗口尺寸变化 → 重新分页
========================================================= */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const oldPageSize = pageSize;
    const newPageSize = getPageSize();
    const firstVisible = currentPage * oldPageSize;
    render();
    currentPage = Math.min(pageCount - 1, Math.floor(firstVisible / newPageSize));
    goToPage(currentPage, false);
  }, 150);
});

/* =========================================================
   启动
========================================================= */
loadApps();

/* =========================================================
   PWA Service Worker
========================================================= */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(console.error);
  });
}
</script>

</body>
</html>
