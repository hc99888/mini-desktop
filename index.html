<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>迷你桌面系统</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

  <link rel="manifest" href="manifest.webmanifest.txt">
  <meta name="theme-color" content="#020617">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020617;
      color: #fff;
      font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    }

    #desktop {
      position: fixed;
      inset: 0;
      overflow: hidden;
      background:
        radial-gradient(circle at 30% 10%, rgba(59,130,246,0.18), transparent 55%),
        radial-gradient(circle at 80% 90%, rgba(168,85,247,0.16), transparent 55%),
        #020617;
    }

    .pages-track {
      display: flex;
      height: 100%;
      width: 100%;
      will-change: transform;
    }

    .page {
      flex: 0 0 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      padding: 28px 14px 96px 14px;
      scrollbar-width: none;
      -ms-overflow-style: none;
    }
    .page::-webkit-scrollbar { display: none; }

    .icon-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 22px 6px;
      justify-items: center;
      align-items: start;
      min-height: 100%;
      align-content: start;
    }

    @media (min-width: 480px) {
      .icon-grid {
        grid-template-columns: repeat(5, 1fr);
        gap: 26px 10px;
      }
    }

    /* ============ 图标 ============ */
    .app-icon {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      position: relative;
      cursor: pointer;
      touch-action: pan-y;
      transition: transform 0.18s ease, opacity 0.18s ease;
      will-change: transform;
    }

    .app-icon img {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      object-fit: cover;
      background: #1e293b;
      box-shadow: 0 6px 14px rgba(0,0,0,0.45);
      pointer-events: none;
      -webkit-user-drag: none;
    }

    @media (min-width: 480px) {
      .app-icon img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
    }

    .app-icon span {
      font-size: 11.5px;
      color: #e2e8f0;
      text-align: center;
      line-height: 1.25;
      max-width: 100%;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
      pointer-events: none;
    }

    /* 被拖拽的源图标：留一个空占位（视觉上彻底消失，但占着格子） */
    .app-icon.placeholder {
      opacity: 0;
      pointer-events: none;
    }

    /* 跟着手指跑的 ghost */
    .drag-ghost {
      position: fixed;
      z-index: 9999;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 7px;
      transform: scale(1.12);
      filter: drop-shadow(0 14px 24px rgba(0,0,0,0.6));
      transition: none;
    }

    .drag-ghost img {
      width: 58px;
      height: 58px;
      border-radius: 16px;
      object-fit: cover;
      background: #1e293b;
    }

    @media (min-width: 480px) {
      .drag-ghost img {
        width: 64px;
        height: 64px;
        border-radius: 18px;
      }
    }

    .drag-ghost span {
      font-size: 11.5px;
      color: #e2e8f0;
      text-align: center;
      line-height: 1.25;
      max-width: 80px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      word-break: break-all;
    }

    body.dragging-active .page { overflow: hidden; }

    /* ============ Dock ============ */
    #dock {
      position: fixed;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      padding: 6px 18px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(148, 163, 184, 0.18);
      font-size: 12px;
      color: #cbd5e1;
      letter-spacing: 1px;
      pointer-events: none;
      z-index: 50;
    }

    /* ============ 分页点 ============ */
    #dots {
      position: fixed;
      left: 50%;
      bottom: 52px;
      transform: translateX(-50%);
      display: flex;
      gap: 8px;
      z-index: 50;
      pointer-events: none;
    }

    #dots .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: rgba(226, 232, 240, 0.3);
      transition: background 0.25s, transform 0.25s;
    }

    #dots .dot.active {
      background: #e2e8f0;
      transform: scale(1.25);
    }

    /* ============ 加载/错误 ============ */
    #loading, #error {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #94a3b8;
      background: #020617;
      z-index: 100;
    }
    #error { color: #f87171; }
    .hidden { display: none !important; }

    img {
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      user-select: none;
    }
  </style>
</head>
<body>

<div id="desktop"></div>
<div id="dots"></div>
<div id="dock"><span class="dock-title">迷你桌面</span></div>
<div id="loading">正在加载应用列表...</div>
<div id="error" class="hidden">应用列表加载失败，请检查 configuration.json</div>

<script>
/* =========================================================
   配置
========================================================= */
const APPS_JSON_URL = 'configuration.json';
const STORAGE_KEY = 'mini-desktop-order-v1';
const DEMO_MODE = true;   // 测试用，正式改 false

/* 每页容量：小屏 4×5=20，大屏 5×5=25 */
function getPageSize() {
  return window.matchMedia('(min-width: 480px)').matches ? 25 : 20;
}

/* =========================================================
   状态
========================================================= */
let allApps = [];
let pageCount = 0;
let currentPage = 0;
let pageSize = getPageSize();

const desktopEl = document.getElementById('desktop');
const dotsEl = document.getElementById('dots');
const loadingEl = document.getElementById('loading');
const errorEl = document.getElementById('error');

/* =========================================================
   加载
========================================================= */
async function loadApps() {
  try {
    const res = await fetch(APPS_JSON_URL, { cache: 'no-cache' });
    if (!res.ok) throw new Error('网络错误: ' + res.status);
    let apps = await res.json();
    if (!Array.isArray(apps)) throw new Error('configuration.json 格式错误，应为数组');

    apps = apps.filter(a => a && a.name && a.url);

    if (DEMO_MODE) {
      const need = getPageSize() * 3;
      const base = apps.slice();
      let i = 0;
      while (apps.length < need && base.length > 0) {
        const src = base[i % base.length];
        apps.push({ ...src, name: src.name + '_' + (Math.floor(i / base.length) + 1) });
        i++;
      }
    }

    allApps = applyStoredOrder(apps);
    render();
    loadingEl.classList.add('hidden');
  } catch (e) {
    console.error(e);
    loadingEl.classList.add('hidden');
    errorEl.classList.remove('hidden');
  }
}

/* =========================================================
   持久化
========================================================= */
function applyStoredOrder(apps) {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
    if (!Array.isArray(saved) || !saved.length) return apps;
    const map = new Map(apps.map(a => [a.name, a]));
    const ordered = [];
    saved.forEach(name => {
      if (map.has(name)) { ordered.push(map.get(name)); map.delete(name); }
    });
    map.forEach(a => ordered.push(a));
    return ordered;
  } catch { return apps; }
}

function saveOrder() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(allApps.map(a => a.name)));
  } catch {}
}

/* =========================================================
   渲染（只在数据变化时调用，不在拖拽中调用）
========================================================= */
function render() {
  pageSize = getPageSize();
  pageCount = Math.max(1, Math.ceil(allApps.length / pageSize));
  if (currentPage >= pageCount) currentPage = pageCount - 1;

  const track = document.createElement('div');
  track.className = 'pages-track';

  for (let p = 0; p < pageCount; p++) {
    const page = document.createElement('div');
    page.className = 'page';
    page.dataset.page = p;

    const grid = document.createElement('div');
    grid.className = 'icon-grid';

    const start = p * pageSize;
    const slice = allApps.slice(start, start + pageSize);
    slice.forEach((app, i) => {
      grid.appendChild(createIcon(app, start + i));
    });

    page.appendChild(grid);
    track.appendChild(page);
  }

  desktopEl.innerHTML = '';
  desktopEl.appendChild(track);
  renderDots();
  setTrackTransform(-currentPage * window.innerWidth, false);
}

function createIcon(app, globalIndex) {
  const el = document.createElement('div');
  el.className = 'app-icon';
  el.dataset.index = globalIndex;
  el.dataset.name = app.name;

  const img = document.createElement('img');
  img.src = app.icon || 'icon-192.png';
  img.alt = app.name;
  img.draggable = false;

  const label = document.createElement('span');
  label.textContent = app.name;

  el.appendChild(img);
  el.appendChild(label);
  attachIconEvents(el, app);
  return el;
}

function renderDots() {
  dotsEl.innerHTML = '';
  if (pageCount <= 1) return;
  for (let i = 0; i < pageCount; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === currentPage ? ' active' : '');
    dotsEl.appendChild(d);
  }
}

function updateDots() {
  dotsEl.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === currentPage);
  });
}

/* =========================================================
   轨道位移
========================================================= */
function setTrackTransform(x, animate = true) {
  const trackEl = desktopEl.querySelector('.pages-track');
  if (!trackEl) return;
  trackEl.style.transition = animate ? 'transform 0.32s cubic-bezier(0.22,0.61,0.36,1)' : 'none';
  trackEl.style.transform = `translateX(${x}px)`;
}

function goToPage(p, animate = true) {
  currentPage = Math.max(0, Math.min(pageCount - 1, p));
  setTrackTransform(-currentPage * window.innerWidth, animate);
  updateDots();
}

/* =========================================================
   滑屏
========================================================= */
let dragPage = { active: false, startX: 0, startY: 0, dx: 0, dy: 0, locked: false, startTime: 0 };

function onPointerDown(e) {
  if (dragState.active) return;               // 拖拽中不翻页
  if (longPressState.timer) return;           // 长按中不翻页
  const t = e.touches ? e.touches[0] : e;
  dragPage.active = true;
  dragPage.startX = t.clientX;
  dragPage.startY = t.clientY;
  dragPage.dx = 0; dragPage.dy = 0;
  dragPage.locked = false;
  dragPage.startTime = Date.now();
}

function onPointerMove(e) {
  if (!dragPage.active) return;
  const t = e.touches ? e.touches[0] : e;
  const dx = t.clientX - dragPage.startX;
  const dy = t.clientY - dragPage.startY;
  dragPage.dx = dx; dragPage.dy = dy;

  if (!dragPage.locked) {
    if (Math.abs(dx) > 8 && Math.abs(dx) > Math.abs(dy)) {
      dragPage.locked = true;
      cancelLongPress();
    } else if (Math.abs(dy) > 8) {
      dragPage.active = false;
      return;
    }
  }

  if (dragPage.locked) {
    e.preventDefault?.();
    const base = -currentPage * window.innerWidth;
    let x = base + dx;
    if (currentPage === 0 && dx > 0) x = base + dx * 0.35;
    if (currentPage === pageCount - 1 && dx < 0) x = base + dx * 0.35;
    setTrackTransform(x, false);
  }
}

function onPointerUp() {
  if (!dragPage.active) return;
  dragPage.active = false;
  if (!dragPage.locked) return;

  const dx = dragPage.dx;
  const dt = Date.now() - dragPage.startTime;
  const v = Math.abs(dx) / dt;
  const threshold = window.innerWidth * 0.22;
  const fast = v > 0.45;

  if (dx < -threshold || (fast && dx < -30)) goToPage(currentPage + 1);
  else if (dx > threshold || (fast && dx > 30)) goToPage(currentPage - 1);
  else goToPage(currentPage);
  dragPage.locked = false;
}

desktopEl.addEventListener('touchstart', onPointerDown, { passive: true });
desktopEl.addEventListener('touchmove', onPointerMove, { passive: false });
desktopEl.addEventListener('touchend', onPointerUp);
desktopEl.addEventListener('touchcancel', onPointerUp);
desktopEl.addEventListener('mousedown', onPointerDown);
window.addEventListener('mousemove', onPointerMove);
window.addEventListener('mouseup', onPointerUp);

/* =========================================================
   图标：点击 + 长按
========================================================= */
const longPressState = { timer: null, startX: 0, startY: 0 };

function attachIconEvents(el, app) {
  let moved = false, longPressed = false;

  const start = (e) => {
    if (e.button !== undefined && e.button !== 0) return;
    moved = false; longPressed = false;
    cancelLongPress();

    longPressState.timer = setTimeout(() => {
      longPressed = true;
      enterDragMode(el, app, e);
    }, 300);
  };

  const move = (e) => {
    if (longPressState.timer) {
      const t = e.touches ? e.touches[0] : e;
      const dx = Math.abs(t.clientX - longPressState.startX);
      const dy = Math.abs(t.clientY - longPressState.startY);
      if (dx > 8 || dy > 8) { moved = true; cancelLongPress(); }
    }
  };

  const end = () => {
    cancelLongPress();
    if (longPressed) return;
    if (!moved) window.open(app.url, '_blank');
  };

  el.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    longPressState.startX = t.clientX;
    longPressState.startY = t.clientY;
    start(e);
  }, { passive: true });
  el.addEventListener('touchmove', move, { passive: true });
  el.addEventListener('touchend', end);
  el.addEventListener('touchcancel', () => cancelLongPress());

  el.addEventListener('mousedown', (e) => {
    longPressState.startX = e.clientX;
    longPressState.startY = e.clientY;
    start(e);
  });
  el.addEventListener('mousemove', move);
  el.addEventListener('mouseup', end);
  el.addEventListener('mouseleave', () => cancelLongPress());
}

function cancelLongPress() {
  if (longPressState.timer) {
    clearTimeout(longPressState.timer);
    longPressState.timer = null;
  }
}

/* =========================================================
   拖拽（iOS 风格：实时换位 + 节点移动，不重建）
========================================================= */
const dragState = {
  active: false,
  sourceEl: null,     // 被拖拽的原节点（留空占位）
  ghostEl: null,      // 跟手指的克隆
  app: null,
  pageEl: null,
  pageIndex: 0,
  startLocalIndex: 0, // 在当前页里的局部索引
  currentLocalIndex: 0,
  offsetX: 0,
  offsetY: 0,
  lastTargetEl: null,
};

function enterDragMode(el, app, e) {
  if (dragState.active) return;
  const t = e.touches ? e.touches[0] : e;
  const rect = el.getBoundingClientRect();

  dragState.active = true;
  dragState.sourceEl = el;
  dragState.app = app;
  dragState.pageEl = el.closest('.page');
  dragState.pageIndex = parseInt(dragState.pageEl.dataset.page, 10);
  dragState.offsetX = t.clientX - rect.left;
  dragState.offsetY = t.clientY - rect.top;

  // 计算源在当前页的局部索引
  const grid = dragState.pageEl.querySelector('.icon-grid');
  const nodes = Array.from(grid.children);
  dragState.startLocalIndex = nodes.indexOf(el);
  dragState.currentLocalIndex = dragState.startLocalIndex;
  dragState.lastTargetEl = null;

  // 源节点变成占位（视觉消失，但保留占位）
  el.classList.add('placeholder');
  el.style.transform = 'scale(0.9)';

  // 创建 ghost 跟手指
  const ghost = document.createElement('div');
  ghost.className = 'drag-ghost';
  const img = document.createElement('img');
  img.src = app.icon || 'icon-192.png';
  const label = document.createElement('span');
  label.textContent = app.name;
  ghost.appendChild(img);
  ghost.appendChild(label);

  // 初始位置 = 源图标位置
  ghost.style.left = rect.left + 'px';
  ghost.style.top = rect.top + 'px';
  ghost.style.width = rect.width + 'px';
  ghost.style.height = rect.height + 'px';
  document.body.appendChild(ghost);
  dragState.ghostEl = ghost;

  document.body.classList.add('dragging-active');
  if (navigator.vibrate) navigator.vibrate(15);

  document.addEventListener('touchmove', onDragMove, { passive: false });
  document.addEventListener('touchend', onDragEnd);
  document.addEventListener('touchcancel', onDragEnd);
  document.addEventListener('mousemove', onDragMove);
  document.addEventListener('mouseup', onDragEnd);
}

function onDragMove(e) {
  if (!dragState.active) return;
  e.preventDefault?.();
  const t = e.touches ? e.touches[0] : e;

  // ghost 跟手
  const gx = t.clientX - dragState.offsetX;
  const gy = t.clientY - dragState.offsetY;
  dragState.ghostEl.style.left = gx + 'px';
  dragState.ghostEl.style.top = gy + 'px';

  // 手指下的目标图标
  const elBelow = document.elementFromPoint(t.clientX, t.clientY);
  const targetEl = elBelow?.closest('.app-icon');

  if (!targetEl || targetEl === dragState.sourceEl) return;
  if (!dragState.pageEl.contains(targetEl)) return;

  const grid = dragState.pageEl.querySelector('.icon-grid');
  const nodes = Array.from(grid.children);
  const targetLocal = nodes.indexOf(targetEl);

  if (targetLocal === -1 || targetLocal === dragState.currentLocalIndex) return;

  // 关键：只移动 DOM 节点，不重建
  // 把 sourceEl 插到 targetEl 前面（如果往后移）或者后面（如果往前移）
  if (targetLocal > dragState.currentLocalIndex) {
    grid.insertBefore(dragState.sourceEl, nodes[targetLocal].nextSibling);
  } else {
    grid.insertBefore(dragState.sourceEl, nodes[targetLocal]);
  }

  // 数据同步：把 allApps 里对应项也交换
  const start = dragState.pageIndex * pageSize;
  const fromGlobal = start + dragState.currentLocalIndex;
  const toGlobal = start + targetLocal;
  if (fromGlobal !== toGlobal && fromGlobal >= 0 && toGlobal >= 0 &&
      fromGlobal < allApps.length && toGlobal < allApps.length) {
    const [moved] = allApps.splice(fromGlobal, 1);
    allApps.splice(toGlobal, 0, moved);
  }

  dragState.currentLocalIndex = targetLocal;

  // 更新所有节点的 data-index（因为顺序变了）
  Array.from(grid.children).forEach((child, i) => {
    child.dataset.index = start + i;
  });
}

function onDragEnd() {
  if (!dragState.active) return;
  dragState.active = false;
  document.body.classList.remove('dragging-active');

  // 移除 ghost
  if (dragState.ghostEl) {
    dragState.ghostEl.remove();
    dragState.ghostEl = null;
  }

  // 源节点恢复
  if (dragState.sourceEl) {
    dragState.sourceEl.classList.remove('placeholder');
    dragState.sourceEl.style.transform = '';
  }

  // 保存顺序
  saveOrder();

  // 清理
  dragState.sourceEl = null;
  dragState.pageEl = null;
  dragState.app = null;
  dragState.lastTargetEl = null;

  document.removeEventListener('touchmove', onDragMove);
  document.removeEventListener('touchend', onDragEnd);
  document.removeEventListener('touchcancel', onDragEnd);
  document.removeEventListener('mousemove', onDragMove);
  document.removeEventListener('mouseup', onDragEnd);
}

/* =========================================================
   窗口尺寸变化
========================================================= */
let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const oldPageSize = pageSize;
    const newPageSize = getPageSize();
    const firstVisible = currentPage * oldPageSize;
    render();
    currentPage = Math.min(pageCount - 1, Math.floor(firstVisible / newPageSize));
    goToPage(currentPage, false);
  }, 150);
});

/* =========================================================
   启动
========================================================= */
loadApps();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(console.error);
  });
}
</script>

</body>
</html>
