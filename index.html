<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="迷你桌面：统一打开、搜索和管理你的 Web 应用">
<link rel="manifest" href="./manifest.json">
<title>迷你桌面</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#111b2d;--panel2:#17243a;--line:#26354d;--text:#f1f5f9;--muted:#9aabc2;--accent:#69a7ff;--accent2:#9c8bff;--good:#42d6a4;--warn:#ffc56a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:radial-gradient(ellipse at 15% 0%,#1c3153 0,transparent 38%),radial-gradient(ellipse at 100% 20%,#28204d 0,transparent 30%),var(--bg);color:var(--text)}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shell{max-width:1120px;margin:auto;padding:24px 22px calc(34px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:13px}.brand-mark{width:48px;height:48px;border-radius:16px;background:linear-gradient(145deg,#72b8ff,#8870ff);display:grid;place-items:center;box-shadow:0 10px 28px #5b7bff30}.brand-mark svg{width:28px;height:28px}
.header-right{display:flex;align-items:center;gap:10px}.clock{text-align:right;font-size:13px;color:var(--muted);line-height:1.7}
.btn{border:1px solid var(--line);border-radius:12px;padding:10px 13px;background:#17243ad9;color:var(--text);transition:.18s}.btn:hover{border-color:#6685b8;background:#213452}.btn.primary{background:linear-gradient(135deg,#4d91f4,#7a6cf4);border:0}
.hero{display:none}
.toolbar{display:none}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(142px,1fr));gap:13px}
.app{
  min-width:0;text-align:center;position:relative;color:inherit;text-decoration:none;
  display:flex;align-items:center;flex-direction:column;gap:11px;
  min-height:145px;padding:18px 10px 15px;
  cursor:grab;user-select:none;touch-action:none;
  transition:transform .16s;
  border:none;background:transparent;border-radius:0;overflow:visible;
}
.app:hover{transform:translateY(-3px)}
.app:active{transform:scale(.98)}
.app.dragging{opacity:0.4;transform:scale(0.95);cursor:grabbing}
.app.drag-over{opacity:0.5;border:none;outline:2px dashed #69a7ff;outline-offset:4px;border-radius:18px}
.app-icon{width:62px;height:62px;display:grid;place-items:center;border-radius:17px;background:linear-gradient(145deg,#273e60,#1b2941);box-shadow:inset 0 1px 0 #ffffff16;border:1px solid #ffffff0c;overflow:hidden;transition:transform .16s}
.app-icon img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.app-name{font-size:14px;font-weight:650;line-height:1.35;max-width:100%;overflow-wrap:anywhere;pointer-events:none;color:var(--text)}
.app-path{display:none}

.state{border:1px dashed #344863;border-radius:18px;padding:32px 18px;text-align:center;color:var(--muted);line-height:1.8}.state strong{display:block;color:var(--text);margin-bottom:6px}.state button{margin-top:12px}
footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:25px;padding-top:16px;border-top:1px solid #243149;color:#8294ad;font-size:11px;flex-wrap:wrap}.status{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}.dot.offline{background:var(--warn)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1c2a40;border:1px solid #3b506d;padding:11px 16px;border-radius:12px;box-shadow:0 12px 35px #0005;font-size:13px;transition:.2s;z-index:10;max-width:calc(100vw - 32px)}.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:560px){.shell{padding:17px 14px calc(25px + env(safe-area-inset-bottom))}header{align-items:flex-start;margin-bottom:23px}.brand-mark{width:42px;height:42px;border-radius:14px}.clock{display:none}.header-right .btn{padding:9px 10px}.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.app{padding:13px 6px 12px;min-height:124px;gap:9px}.app-icon{width:52px;height:52px;border-radius:15px}.app-name{font-size:12px}}
@media(max-width:360px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="brand">
    <div class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg></div>
  </div>
  <div class="header-right"><div class="clock"><div id="clockTime">--:--</div><div id="clockDate">正在读取时间</div></div><button class="btn" id="refreshBtn" type="button" title="重新读取应用列表">↻ 刷新</button></div>
</header>
<main id="appGrid" class="grid" aria-live="polite"></main>
<div id="empty" class="state" hidden><strong id="emptyTitle">没有找到应用</strong><span id="emptyText">请确认 configuration.json 已上传，且格式正确。</span><br><button class="btn" id="emptyRefresh" type="button">重新加载</button></div>
<footer><div class="status"><span class="dot" id="netDot"></span><span id="statusText">准备连接应用配置</span></div><div>版本 <span id="buildText">2026.10.24</span> · 自动检查更新</div></footer>
</div>
<div class="toast" id="toast" role="status"></div>
<script>
(() => {
'use strict';
const BUILD = '2026.10.24-v1';
const CONFIG_URL = './configuration.json';
const STORAGE_KEY = 'mini-desktop-apps-v2';
const ORDER_KEY = 'mini-desktop-order-v2';
const FALLBACK_APPS = [
 {name:'订阅推送',icon:'apps/订阅推送/icon.webp',url:'apps/订阅推送/'},
 {name:'仓库资源',icon:'apps/仓库资源/icon.webp',url:'apps/仓库资源/'},
 {name:'测试00',icon:'apps/测试00/logo.png',url:'apps/测试00/'},
 {name:'测试11',icon:'apps/测试11/logo.png',url:'apps/测试11/'},
 {name:'3D福彩',icon:'apps/3D福彩/logo.png',url:'apps/3D福彩/'},
 {name:'编辑AI',icon:'apps/编辑AI/logo.webp',url:'apps/编辑AI/'},
 {name:'年龄查询',icon:'apps/年龄查询/logo.webp',url:'apps/年龄查询/'},
 {name:'手指画画',icon:'apps/手指画画/logo.webp',url:'apps/手指画画/'},
 {name:'缺不缺',icon:'apps/缺不缺/logo.webp',url:'apps/缺不缺/'},
 {name:'超级工厂',icon:'apps/超级工厂/logo.webp',url:'apps/超级工厂/'},
 {name:'日历记账',icon:'apps/日历记账/logo.jpg',url:'apps/日历记账/'},
 {name:'资料库',icon:'apps/资料库/logo.webp',url:'apps/资料库/'},
 {name:'书签应用',icon:'apps/书签应用/logo.webp',url:'apps/书签应用/'}
];
const $ = id => document.getElementById(id);
const grid = $('appGrid'), empty = $('empty');
let apps = [], source = 'fallback', lastConfigSignature = '';
let draggedItem = null;
let draggedName = null;
const svgIcon = `<svg viewBox="0 0 64 64" width="62" height="62" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63b6ff"/><stop offset="1" stop-color="#8972ff"/></linearGradient></defs><rect width="64" height="64" rx="17" fill="url(#g)"/><rect x="14" y="14" width="15" height="15" rx="4" fill="white" opacity=".95"/><rect x="35" y="14" width="15" height="15" rx="4" fill="white" opacity=".7"/><rect x="14" y="35" width="15" height="15" rx="4" fill="white" opacity=".7"/><rect x="35" y="35" width="15" height="15" rx="4" fill="white" opacity=".95"/></svg>`;
const fallbackIcon = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);
function normalizeApps(raw) {
  if (!Array.isArray(raw)) throw new Error('configuration.json 格式必须是应用数组');
  const seen = new Set();
  return raw.filter(x => x && typeof x.name === 'string' && x.name.trim() && typeof x.url === 'string' && x.url.trim())
    .map(x => ({name:x.name.trim(), icon:typeof x.icon==='string'&&x.icon.trim()?x.icon.trim():'', url:x.url.trim()}))
    .filter(x => { const k=x.name.toLocaleLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
}
function appUrl(path) {
  try { return new URL(path, document.baseURI).href; } catch (_) { return '#'; }
}
function iconUrl(path) {
  if (!path) return fallbackIcon;
  return appUrl(path);
}
function getOrder() { try { const a=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]'); return Array.isArray(a)?a:[]; } catch(_){return [];} }
function saveOrder(order) { try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch(_){} }
function sortApps(list) {
  const order=getOrder(), index=new Map(order.map((n,i)=>[n,i]));
  return [...list].sort((a,b)=>{
    const ai=index.has(a.name)?index.get(a.name):999999, bi=index.has(b.name)?index.get(b.name):999999;
    if(ai!==bi) return ai-bi;
    return a.name.localeCompare(b.name,'zh-Hant');
  });
}

function render() {
  const list=sortApps(apps);
  grid.replaceChildren();
  list.forEach((app,i)=>{
    const a=document.createElement('a'); a.className='app'; a.href=appUrl(app.url);
    a.setAttribute('aria-label','打开应用：'+app.name);
    a.dataset.appName = app.name;
    a.draggable = true;
    a.addEventListener('dragstart', handleDragStart);
    a.addEventListener('dragend', handleDragEnd);
    a.addEventListener('dragover', handleDragOver);
    a.addEventListener('dragleave', handleDragLeave);
    a.addEventListener('drop', handleDrop);
    a.addEventListener('click', (e) => {
      if (window._justDragged) {
        e.preventDefault();
        window._justDragged = false;
      }
    });
    
    let sameOrigin=false; try{sameOrigin=new URL(a.href).origin===location.origin;}catch(_){}
    if(!sameOrigin){a.target='_blank';a.rel='noopener noreferrer';}
    const icon=document.createElement('span'); icon.className='app-icon';
    const img=document.createElement('img'); img.alt=''; img.loading=i>8?'lazy':'eager'; img.decoding='async'; img.src=iconUrl(app.icon);
    img.onerror=()=>{img.onerror=null;img.src=fallbackIcon;};
    icon.appendChild(img);
    const name=document.createElement('span'); name.className='app-name'; name.textContent=app.name;
    a.append(icon,name); grid.appendChild(a);
  });
  empty.hidden=list.length!==0; grid.hidden=list.length===0;
  if(list.length===0){$('emptyTitle').textContent='当前没有可显示的应用';$('emptyText').textContent='请确认 configuration.json 已上传，且格式正确。';}
}

function handleDragStart(e) {
  const appEl = e.currentTarget;
  draggedItem = appEl;
  draggedName = appEl.dataset.appName;
  e.dataTransfer.effectAllowed = 'move';
  try { e.dataTransfer.setData('text/plain', draggedName); } catch(_) {}
  setTimeout(() => {
    if (draggedItem) draggedItem.classList.add('dragging');
  }, 0);
  window._justDragged = true;
}

function handleDragEnd(e) {
  const appEl = e.currentTarget;
  appEl.classList.remove('dragging');
  document.querySelectorAll('.app').forEach(el => el.classList.remove('drag-over'));
  draggedItem = null;
  draggedName = null;
  setTimeout(() => {
    window._justDragged = false;
  }, 100);
}

function handleDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  const target = e.currentTarget;
  if (!draggedItem || target === draggedItem) return;
  document.querySelectorAll('.app').forEach(el => el.classList.remove('drag-over'));
  target.classList.add('drag-over');
}

function handleDragLeave(e) {
  const target = e.currentTarget;
  target.classList.remove('drag-over');
}

function handleDrop(e) {
  e.preventDefault();
  const target = e.currentTarget;
  if (!draggedItem || target === draggedItem) return;
  const currentApps = [...grid.querySelectorAll('.app')].map(el => el.dataset.appName);
  const sourceIndex = currentApps.indexOf(draggedName);
  const targetIndex = currentApps.indexOf(target.dataset.appName);
  if (sourceIndex === -1 || targetIndex === -1) return;
  const [moved] = currentApps.splice(sourceIndex, 1);
  currentApps.splice(targetIndex, 0, moved);
  saveOrder(currentApps);
  render();
  draggedItem = null;
  draggedName = null;
  document.querySelectorAll('.app').forEach(el => el.classList.remove('drag-over'));
  window._justDragged = true;
  setTimeout(() => { window._justDragged = false; }, 200);
}

function setStatus(message,offline=false){$('statusText').textContent=message;$('netDot').classList.toggle('offline',offline);}
let toastTimer;
function toast(message){const t=$('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2400);}
async function loadConfig({quiet=false}={}) {
  if(!quiet) setStatus('正在读取最新应用配置…');
  try {
    const url=new URL(CONFIG_URL,location.href); url.searchParams.set('_t',Date.now().toString());
    const res=await fetch(url.href,{cache:'no-store',headers:{'Cache-Control':'no-cache','Pragma':'no-cache'}});
    if(!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw=await res.json();
    const fresh=normalizeApps(raw);
    if(!fresh.length) throw new Error('配置文件没有有效应用，已保留上次列表');
    const signature=JSON.stringify(fresh);
    const changed=signature!==lastConfigSignature;
    apps=fresh; source='remote'; lastConfigSignature=signature;
    try{localStorage.setItem(STORAGE_KEY,JSON.stringify({at:Date.now(),apps:fresh}));}catch(_){}
    render(); setStatus(`配置已同步 · ${new Date().toLocaleTimeString()}`);
    if(changed && quiet) toast('应用列表已自动同步');
    return true;
  } catch(err) {
    if(source!=='remote') {
      let cached=null; try{cached=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');}catch(_){}
      if(cached&&Array.isArray(cached.apps)&&cached.apps.length){apps=normalizeApps(cached.apps);source='local';}
      else {apps=normalizeApps(FALLBACK_APPS);source='fallback';}
      render();
    }
    const msg=source==='fallback'?'配置读取失败，显示内置应用列表':source==='local'?'网络不可用，显示上次成功的应用列表':'读取失败，保留当前应用列表';
    setStatus(msg,true);
    if(!quiet) toast(`${msg}（${err.message}）`);
    return false;
  }
}
function updateClock(){const d=new Date();$('clockTime').textContent=d.toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false});$('clockDate').textContent=d.toLocaleDateString('zh-TW',{year:'numeric',month:'long',day:'numeric',weekday:'short'});}
$('refreshBtn').addEventListener('click',()=>loadConfig());
$('emptyRefresh').addEventListener('click',()=>loadConfig());
window.addEventListener('online',()=>loadConfig({quiet:true}));
window.addEventListener('focus',()=>loadConfig({quiet:true}));
document.addEventListener('visibilitychange',()=>{if(!document.hidden)loadConfig({quiet:true});});
$('buildText').textContent=BUILD;
updateClock();setInterval(updateClock,1000);
loadConfig();
setInterval(()=>{if(!document.hidden)loadConfig({quiet:true});},60000);
if('serviceWorker' in navigator && (location.protocol==='https:'||location.hostname==='localhost')) {
  window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
})();
</script>
</body>
</html>
