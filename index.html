<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827">
<meta name="description" content="迷你桌面：统一打开、搜索和管理你的 Web 应用">
<link rel="manifest" href="./manifest.json">
<title>迷你桌面</title>
<style>
:root{color-scheme:dark;--bg:#0b1120;--panel:#111b2d;--panel2:#17243a;--line:#26354d;--text:#f1f5f9;--muted:#9aabc2;--accent:#69a7ff;--accent2:#9c8bff;--good:#42d6a4;--warn:#ffc56a}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:radial-gradient(ellipse at 15% 0%,#1c3153 0,transparent 38%),radial-gradient(ellipse at 100% 20%,#28204d 0,transparent 30%),var(--bg);color:var(--text);overflow-x:hidden}
button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.shell{max-width:1120px;margin:auto;padding:24px 22px calc(34px + env(safe-area-inset-bottom));display:flex;flex-direction:column;min-height:100vh}
header{display:flex;align-items:center;justify-content:flex-end;gap:18px;margin-bottom:26px;flex-shrink:0}
.header-right{display:flex;align-items:center;gap:10px}.clock{text-align:right;font-size:13px;color:var(--muted);line-height:1.7}

/* 下拉刷新指示器 */
.pull-indicator{position:absolute;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:5}
.pull-indicator.visible{opacity:1}
.pull-indicator .spinner{width:20px;height:20px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-right:8px}
@keyframes spin{to{transform:rotate(360deg)}}

/* 桌面容器 - 分页 */
.desktop-container{flex:1;position:relative;overflow:hidden;margin:0 -22px;padding:0 22px}
.desktop-scroll{display:flex;height:100%;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;-ms-overflow-style:none;touch-action:pan-x pan-y}
.desktop-scroll::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;display:grid;gap:13px;align-content:start;padding:4px 0 20px;position:relative;min-height:100%}
.page-inner{display:grid;gap:13px;width:100%}

/* 应用图标卡片 - 无外围卡片，仅图标+文字 */
.app{
  min-width:0;text-align:center;position:relative;color:inherit;text-decoration:none;
  display:flex;align-items:center;flex-direction:column;gap:8px;
  padding:12px 6px;
  cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;
  transition:transform .12s ease,box-shadow .12s ease;
  border:none;background:transparent;border-radius:12px;
  -webkit-touch-callout:none;
}
.app:hover{transform:translateY(-2px)}
.app:active{transform:scale(.96)}
.app.dragging{opacity:0.3;transform:scale(0.9);cursor:grabbing;transition:none}
.app.drag-over{outline:2px dashed #69a7ff;outline-offset:-2px;border-radius:12px;background:rgba(105,167,255,0.08)}
.app-icon{width:62px;height:62px;display:grid;place-items:center;border-radius:16px;background:linear-gradient(145deg,#273e60,#1b2941);box-shadow:inset 0 1px 0 #ffffff16,0 4px 12px #0003;border:1px solid #ffffff0c;overflow:hidden;transition:transform .12s ease;flex-shrink:0}
.app-icon img{width:100%;height:100%;object-fit:cover;pointer-events:none;-webkit-user-drag:none}
.app-name{font-size:12px;font-weight:500;line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;pointer-events:none;color:var(--text)}

/* 拖拽幽灵元素 */
.drag-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:0.85;transform:scale(1.08);transition:transform .1s;filter:drop-shadow(0 12px 30px rgba(0,0,0,0.6));will-change:left,top}
.drag-ghost .app-icon{width:62px;height:62px;border-radius:16px;box-shadow:0 8px 24px #0006}

/* 占位符 - 真正空位 */
.placeholder{visibility:hidden;pointer-events:none}
.placeholder .app-icon{visibility:hidden}

/* 分页指示器 */
.page-dots{display:flex;justify-content:center;gap:6px;padding:12px 0 8px;flex-shrink:0}
.page-dot{width:7px;height:7px;border-radius:50%;background:#3a4d68;transition:background .2s,transform .2s;cursor:pointer;border:none;padding:0}
.page-dot.active{background:var(--accent);transform:scale(1.2)}

.state{border:1px dashed #344863;border-radius:18px;padding:32px 18px;text-align:center;color:var(--muted);line-height:1.8;margin:20px 0}.state strong{display:block;color:var(--text);margin-bottom:6px}.state button{margin-top:12px}
footer{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:25px;padding-top:16px;border-top:1px solid #243149;color:#8294ad;font-size:11px;flex-wrap:wrap;flex-shrink:0}.status{display:flex;align-items:center;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:var(--good)}.dot.offline{background:var(--warn)}.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;pointer-events:none;background:#1c2a40;border:1px solid #3b506d;padding:11px 16px;border-radius:12px;box-shadow:0 12px 35px #0005;font-size:13px;transition:.2s;z-index:10;max-width:calc(100vw - 32px)}.toast.show{opacity:1;transform:translate(-50%,0)}

/* 小屏 4列 */
@media(max-width:640px){
  .shell{padding:17px 14px calc(25px + env(safe-area-inset-bottom))}
  header{align-items:flex-start;margin-bottom:20px}
  .clock{display:none}
  .desktop-container{margin:0 -14px;padding:0 14px}
  .page-inner{grid-template-columns:repeat(4,1fr);gap:8px}
  .app{padding:8px 2px;gap:6px}
  .app-icon{width:54px;height:54px;border-radius:14px}
  .app-name{font-size:11px}
  .drag-ghost .app-icon{width:54px;height:54px;border-radius:14px}
}
/* 大屏 5列 */
@media(min-width:641px){
  .page-inner{grid-template-columns:repeat(5,1fr);gap:13px}
  .app{padding:12px 6px;gap:8px}
  .app-icon{width:62px;height:62px;border-radius:16px}
  .app-name{font-size:12px}
}
/* 超小屏 */
@media(max-width:360px){
  .page-inner{grid-template-columns:repeat(4,1fr);gap:4px}
  .app-icon{width:48px;height:48px;border-radius:12px}
  .app-name{font-size:10px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header>
  <div class="header-right"><div class="clock"><div id="clockTime">--:--</div><div id="clockDate">正在读取时间</div></div></div>
</header>

<div class="desktop-container" id="desktopContainer">
  <div class="pull-indicator" id="pullIndicator"><span class="spinner" id="pullSpinner" style="display:none"></span><span id="pullText">下拉刷新</span></div>
  <div class="desktop-scroll" id="desktopScroll"></div>
</div>
<div class="page-dots" id="pageDots"></div>

<div id="empty" class="state" hidden><strong id="emptyTitle">没有找到应用</strong><span id="emptyText">请确认 configuration.json 已上传，且格式正确。</span><br><button class="btn" id="emptyRefresh" type="button">重新加载</button></div>
<footer><div class="status"><span class="dot" id="netDot"></span><span id="statusText">准备连接应用配置</span></div><div>版本 <span id="buildText">2026.10.24</span> · 自动检查更新</div></footer>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
'use strict';
const BUILD = '2026.10.24-v1';
const CONFIG_URL = './configuration.json';
const STORAGE_KEY = 'mini-desktop-apps-v2';
const ORDER_KEY = 'mini-desktop-order-v2';
const PAGE_SIZE_SMALL = 20; // 4x5
const PAGE_SIZE_LARGE = 25; // 5x5

const FALLBACK_APPS = [
 {name:'订阅推送',icon:'apps/订阅推送/icon.webp',url:'apps/订阅推送/'},
 {name:'仓库资源',icon:'apps/仓库资源/icon.webp',url:'apps/仓库资源/'},
 {name:'测试00',icon:'apps/测试00/logo.png',url:'apps/测试00/'},
 {name:'测试11',icon:'apps/测试11/logo.png',url:'apps/测试11/'},
 {name:'3D福彩',icon:'apps/3D福彩/logo.png',url:'apps/3D福彩/'},
 {name:'编辑AI',icon:'apps/编辑AI/logo.webp',url:'apps/编辑AI/'},
 {name:'年龄查询',icon:'apps/年龄查询/logo.webp',url:'apps/年龄查询/'},
 {name:'手指画画',icon:'apps/手指画画/logo.webp',url:'apps/手指画画/'},
 {name:'缺不缺',icon:'apps/缺不缺/logo.webp',url:'apps/缺不缺/'},
 {name:'超级工厂',icon:'apps/超级工厂/logo.webp',url:'apps/超级工厂/'},
 {name:'日历记账',icon:'apps/日历记账/logo.jpg',url:'apps/日历记账/'},
 {name:'资料库',icon:'apps/资料库/logo.webp',url:'apps/资料库/'},
 {name:'书签应用',icon:'apps/书签应用/logo.webp',url:'apps/书签应用/'}
];

const $ = id => document.getElementById(id);
const desktopScroll = $('desktopScroll');
const pageDots = $('pageDots');
const empty = $('empty');
const pullIndicator = $('pullIndicator');
const pullText = $('pullText');
const pullSpinner = $('pullSpinner');

let apps = [], source = 'fallback', lastConfigSignature = '';
let currentPage = 0, totalPages = 0, pageSize = PAGE_SIZE_SMALL;
let draggedItem = null, draggedName = null, dragGhost = null;
let dragOffsetX = 0, dragOffsetY = 0;
let placeholder = null;
let isDragging = false, longPressTimer = null;
let startClientX = 0, startClientY = 0;
let touchActive = false;

// 下拉刷新状态
let pullStartY = 0, pullStartX = 0, pullCurrentY = 0, isPulling = false, pullThreshold = 60;
let isRefreshing = false;

const svgIcon = `<svg viewBox="0 0 64 64" width="62" height="62" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#63b6ff"/><stop offset="1" stop-color="#8972ff"/></linearGradient></defs><rect width="64" height="64" rx="17" fill="url(#g)"/><rect x="14" y="14" width="15" height="15" rx="4" fill="white" opacity=".95"/><rect x="35" y="14" width="15" height="15" rx="4" fill="white" opacity=".7"/><rect x="14" y="35" width="15" height="15" rx="4" fill="white" opacity=".7"/><rect x="35" y="35" width="15" height="15" rx="4" fill="white" opacity=".95"/></svg>`;
const fallbackIcon = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgIcon);

function normalizeApps(raw) {
  if (!Array.isArray(raw)) throw new Error('configuration.json 格式必须是应用数组');
  const seen = new Set();
  return raw.filter(x => x && typeof x.name === 'string' && x.name.trim() && typeof x.url === 'string' && x.url.trim())
    .map(x => ({name:x.name.trim(), icon:typeof x.icon==='string'&&x.icon.trim()?x.icon.trim():'', url:x.url.trim()}))
    .filter(x => { const k=x.name.toLocaleLowerCase(); if(seen.has(k)) return false; seen.add(k); return true; });
}
function appUrl(path) { try { return new URL(path, document.baseURI).href; } catch (_) { return '#'; } }
function iconUrl(path) { if (!path) return fallbackIcon; return appUrl(path); }
function getOrder() { try { const a=JSON.parse(localStorage.getItem(ORDER_KEY)||'[]'); return Array.isArray(a)?a:[]; } catch(_){return [];} }
function saveOrder(order) { try { localStorage.setItem(ORDER_KEY, JSON.stringify(order)); } catch(_){} }

function sortApps(list) {
  const order = getOrder(), index = new Map(order.map((n,i)=>[n,i]));
  return [...list].sort((a,b)=>{
    const ai = index.has(a.name)?index.get(a.name):999999, bi = index.has(b.name)?index.get(b.name):999999;
    if(ai !== bi) return ai - bi;
    return a.name.localeCompare(b.name,'zh-Hant');
  });
}

function getPageSize() {
  return window.innerWidth <= 640 ? PAGE_SIZE_SMALL : PAGE_SIZE_LARGE;
}

function render() {
  pageSize = getPageSize();
  const sorted = sortApps(apps);
  totalPages = Math.ceil(sorted.length / pageSize) || 1;
  if (currentPage >= totalPages) currentPage = totalPages - 1;
  if (currentPage < 0) currentPage = 0;

  desktopScroll.replaceChildren();
  pageDots.replaceChildren();

  for (let p = 0; p < totalPages; p++) {
    const pageEl = document.createElement('div');
    pageEl.className = 'page';
    pageEl.dataset.pageIndex = p;
    const inner = document.createElement('div');
    inner.className = 'page-inner';
    const cols = window.innerWidth <= 640 ? 4 : 5;
    const rows = 5;
    inner.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;
    inner.style.gridTemplateRows = `repeat(${rows}, auto)`;

    const start = p * pageSize;
    const end = Math.min(start + pageSize, sorted.length);
    for (let i = start; i < end; i++) {
      const app = sorted[i];
      const a = createAppElement(app, i - start);
      inner.appendChild(a);
    }
    pageEl.appendChild(inner);
    desktopScroll.appendChild(pageEl);

    const dot = document.createElement('button');
    dot.className = 'page-dot' + (p === currentPage ? ' active' : '');
    dot.dataset.page = p;
    dot.addEventListener('click', () => goToPage(p));
    pageDots.appendChild(dot);
  }

  empty.hidden = sorted.length !== 0;
  desktopScroll.hidden = sorted.length === 0;
  pageDots.hidden = sorted.length === 0;

  scrollToPage(currentPage, false);
}

function createAppElement(app, indexInPage) {
  const a = document.createElement('a');
  a.className = 'app';
  a.href = appUrl(app.url);
  a.setAttribute('aria-label', '打开应用：' + app.name);
  a.dataset.appName = app.name;
  a.dataset.index = indexInPage;

  let sameOrigin = false;
  try { sameOrigin = new URL(a.href).origin === location.origin; } catch(_) {}
  if (!sameOrigin) { a.target = '_blank'; a.rel = 'noopener noreferrer'; }

  const icon = document.createElement('span');
  icon.className = 'app-icon';
  const img = document.createElement('img');
  img.alt = '';
  img.loading = 'lazy';
  img.decoding = 'async';
  img.src = iconUrl(app.icon);
  img.onerror = () => { img.onerror = null; img.src = fallbackIcon; };
  icon.appendChild(img);

  const name = document.createElement('span');
  name.className = 'app-name';
  name.textContent = app.name;

  a.append(icon, name);

  a.addEventListener('click', (e) => {
    if (window._justDragged) { e.preventDefault(); window._justDragged = false; }
  });

  a.addEventListener('pointerdown', onPointerDown);
  a.addEventListener('pointermove', onPointerMove);
  a.addEventListener('pointerup', onPointerUp);
  a.addEventListener('pointercancel', onPointerUp);

  return a;
}

// ---- 拖拽逻辑 ----
function onPointerDown(e) {
  if (isDragging) return;
  const appEl = e.currentTarget;
  if (e.button !== undefined && e.button !== 0) return;

  startClientX = e.clientX;
  startClientY = e.clientY;
  draggedItem = appEl;
  draggedName = appEl.dataset.appName;
  touchActive = true;

  const rect = appEl.getBoundingClientRect();
  dragOffsetX = e.clientX - rect.left;
  dragOffsetY = e.clientY - rect.top;

  clearTimeout(longPressTimer);
  longPressTimer = setTimeout(() => {
    if (touchActive && draggedItem === appEl) {
      initiateDrag(appEl, e.clientX, e.clientY);
    }
  }, 300);

  e.preventDefault();
  appEl.setPointerCapture && appEl.setPointerCapture(e.pointerId);
}

function onPointerMove(e) {
  if (!touchActive) return;
  const dx = e.clientX - startClientX;
  const dy = e.clientY - startClientY;

  if (!isDragging && (Math.abs(dx) > 10 || Math.abs(dy) > 10)) {
    clearTimeout(longPressTimer);
  }

  if (isDragging) {
    e.preventDefault();
    moveDragGhost(e.clientX, e.clientY);
    autoScroll(e.clientX);
  }
}

function onPointerUp(e) {
  touchActive = false;
  clearTimeout(longPressTimer);

  if (isDragging) {
    e.preventDefault();
    finishDrag(e.clientX, e.clientY);
  }

  draggedItem = null;
  draggedName = null;
  isDragging = false;
}

function initiateDrag(appEl, x, y) {
  if (isDragging) return;
  isDragging = true;
  touchActive = true;

  const rect = appEl.getBoundingClientRect();
  dragOffsetX = x - rect.left;
  dragOffsetY = y - rect.top;

  dragGhost = document.createElement('div');
  dragGhost.className = 'drag-ghost';
  const iconClone = appEl.querySelector('.app-icon').cloneNode(true);
  dragGhost.appendChild(iconClone);
  dragGhost.style.width = rect.width + 'px';
  dragGhost.style.height = rect.height + 'px';
  dragGhost.style.left = (x - dragOffsetX) + 'px';
  dragGhost.style.top = (y - dragOffsetY) + 'px';
  document.body.appendChild(dragGhost);

  placeholder = document.createElement('div');
  placeholder.className = 'app placeholder';
  placeholder.style.width = rect.width + 'px';
  placeholder.style.height = rect.height + 'px';
  placeholder.innerHTML = appEl.innerHTML;
  placeholder.querySelectorAll('.app-icon, .app-name').forEach(el => el.style.visibility = 'hidden');
  appEl.parentNode.insertBefore(placeholder, appEl);

  appEl.style.visibility = 'hidden';
  appEl.style.position = 'absolute';
  appEl.style.pointerEvents = 'none';
  appEl.style.zIndex = '-1';
  appEl.classList.add('dragging');
  window._justDragged = true;
}

function moveDragGhost(x, y) {
  if (!dragGhost) return;
  dragGhost.style.left = (x - dragOffsetX) + 'px';
  dragGhost.style.top = (y - dragOffsetY) + 'px';

  const target = getDropTarget(x, y);
  document.querySelectorAll('.app').forEach(el => {
    if (el !== draggedItem && el !== placeholder) el.classList.remove('drag-over');
  });
  if (target && target !== draggedItem && target !== placeholder) {
    target.classList.add('drag-over');
  }
}

function getDropTarget(x, y) {
  const elems = document.elementsFromPoint(x, y);
  for (const el of elems) {
    if (el.classList && el.classList.contains('app') && el !== draggedItem && el !== placeholder) {
      return el;
    }
  }
  for (const el of elems) {
    if (el.classList && el.classList.contains('page-inner')) {
      const children = [...el.querySelectorAll('.app')].filter(c => c !== draggedItem && c !== placeholder);
      if (children.length === 0) return el;
      let closest = null, minDist = Infinity;
      for (const child of children) {
        const r = child.getBoundingClientRect();
        const cx = r.left + r.width/2, cy = r.top + r.height/2;
        const d = Math.hypot(x - cx, y - cy);
        if (d < minDist) { minDist = d; closest = child; }
      }
      return closest || el;
    }
  }
  return null;
}

function autoScroll(x) {
  const rect = desktopScroll.getBoundingClientRect();
  const edgeSize = 60;
  const speed = 8;
  if (x - rect.left < edgeSize && desktopScroll.scrollLeft > 0) {
    desktopScroll.scrollLeft -= speed;
  } else if (rect.right - x < edgeSize) {
    const maxScroll = desktopScroll.scrollWidth - desktopScroll.clientWidth;
    if (desktopScroll.scrollLeft < maxScroll) {
      desktopScroll.scrollLeft += speed;
    }
  }
}

function finishDrag(x, y) {
  if (!placeholder) return;

  const target = getDropTarget(x, y);
  const targetParent = target ? (target.closest('.page-inner') || target) : null;

  document.querySelectorAll('.app').forEach(el => el.classList.remove('drag-over'));

  if (dragGhost) { dragGhost.remove(); dragGhost = null; }

  if (draggedItem) {
    draggedItem.style.visibility = '';
    draggedItem.style.position = '';
    draggedItem.style.pointerEvents = '';
    draggedItem.style.zIndex = '';
    draggedItem.classList.remove('dragging');
    draggedItem.style.transform = '';
  }

  if (target && target !== placeholder && targetParent) {
    if (target.classList.contains('app')) {
      targetParent.insertBefore(draggedItem, target);
    } else if (target.classList.contains('page-inner')) {
      target.appendChild(draggedItem);
    }
  }

  if (placeholder && placeholder.parentNode) {
    placeholder.remove();
  }
  placeholder = null;

  updateOrderFromDOM();

  setTimeout(() => {
    const scrollPage = Math.round(desktopScroll.scrollLeft / desktopScroll.clientWidth);
    render();
    scrollToPage(scrollPage, false);
    window._justDragged = false;
  }, 10);
}

function updateOrderFromDOM() {
  const order = [];
  const pages = desktopScroll.querySelectorAll('.page-inner');
  pages.forEach(page => {
    const appEls = page.querySelectorAll('.app');
    appEls.forEach(el => {
      if (el.dataset.appName) order.push(el.dataset.appName);
    });
  });
  saveOrder(order);
}

// ---- 分页滚动 ----
function goToPage(page) {
  currentPage = Math.max(0, Math.min(page, totalPages - 1));
  scrollToPage(currentPage, true);
  updateDots();
}

function scrollToPage(page, smooth) {
  const targetLeft = page * desktopScroll.clientWidth;
  if (smooth) {
    desktopScroll.scrollTo({ left: targetLeft, behavior: 'smooth' });
  } else {
    desktopScroll.scrollLeft = targetLeft;
  }
  currentPage = page;
  updateDots();
}

function updateDots() {
  pageDots.querySelectorAll('.page-dot').forEach((dot, i) => {
    dot.classList.toggle('active', i === currentPage);
  });
}

let scrollTimeout;
desktopScroll.addEventListener('scroll', () => {
  clearTimeout(scrollTimeout);
  scrollTimeout = setTimeout(() => {
    const page = Math.round(desktopScroll.scrollLeft / desktopScroll.clientWidth);
    if (page !== currentPage) {
      currentPage = page;
      updateDots();
    }
  }, 100);
}, { passive: true });

// ---- 下拉刷新 ----
desktopScroll.addEventListener('touchstart', (e) => {
  if (desktopScroll.scrollLeft > 0) return;
  if (isDragging) return;
  pullStartY = e.touches[0].clientY;
  pullStartX = e.touches[0].clientX;
  isPulling = false;
}, { passive: true });

desktopScroll.addEventListener('touchmove', (e) => {
  if (isDragging || isRefreshing) return;
  if (desktopScroll.scrollLeft > 0) return;
  const y = e.touches[0].clientY;
  const x = e.touches[0].clientX;
  const dy = y - pullStartY;
  const dx = x - pullStartX;

  if (dy > 10 && Math.abs(dy) > Math.abs(dx) && !isPulling) {
    isPulling = true;
    e.preventDefault();
  }
  if (isPulling) {
    e.preventDefault();
    pullCurrentY = Math.max(0, dy);
    const progress = Math.min(pullCurrentY / pullThreshold, 1);
    pullIndicator.style.opacity = progress;
    pullIndicator.style.transform = `translateY(${Math.min(pullCurrentY * 0.5, 30)}px)`;
    pullText.textContent = pullCurrentY > pullThreshold ? '释放刷新' : '下拉刷新';
  }
}, { passive: false });

desktopScroll.addEventListener('touchend', () => {
  if (isDragging) return;
  if (isPulling) {
    if (pullCurrentY > pullThreshold && !isRefreshing) {
      triggerRefresh();
    } else {
      resetPull();
    }
    isPulling = false;
  }
}, { passive: true });

function triggerRefresh() {
  isRefreshing = true;
  pullText.textContent = '正在刷新…';
  pullSpinner.style.display = 'inline-block';
  loadConfig({ quiet: false }).finally(() => {
    setTimeout(() => {
      resetPull();
      isRefreshing = false;
    }, 600);
  });
}

function resetPull() {
  pullIndicator.style.opacity = 0;
  pullIndicator.style.transform = '';
  pullText.textContent = '下拉刷新';
  pullSpinner.style.display = 'none';
  pullCurrentY = 0;
}

// ---- 配置加载 ----
function setStatus(message, offline = false) {
  $('statusText').textContent = message;
  $('netDot').classList.toggle('offline', offline);
}
let toastTimer;
function toast(message) {
  const t = $('toast');
  t.textContent = message;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

async function loadConfig({ quiet = false } = {}) {
  if (!quiet) setStatus('正在读取最新应用配置…');
  try {
    const url = new URL(CONFIG_URL, location.href);
    url.searchParams.set('_t', Date.now().toString());
    const res = await fetch(url.href, { cache: 'no-store', headers: { 'Cache-Control': 'no-cache', 'Pragma': 'no-cache' } });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const raw = await res.json();
    const fresh = normalizeApps(raw);
    if (!fresh.length) throw new Error('配置文件没有有效应用，已保留上次列表');
    const signature = JSON.stringify(fresh);
    const changed = signature !== lastConfigSignature;
    apps = fresh; source = 'remote'; lastConfigSignature = signature;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ at: Date.now(), apps: fresh })); } catch(_) {}
    render();
    setStatus(`配置已同步 · ${new Date().toLocaleTimeString()}`);
    if (changed && quiet) toast('应用列表已自动同步');
    return true;
  } catch(err) {
    if (source !== 'remote') {
      let cached = null;
      try { cached = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch(_) {}
      if (cached && Array.isArray(cached.apps) && cached.apps.length) { apps = normalizeApps(cached.apps); source = 'local'; }
      else { apps = normalizeApps(FALLBACK_APPS); source = 'fallback'; }
      render();
    }
    const msg = source === 'fallback' ? '配置读取失败，显示内置应用列表' : source === 'local' ? '网络不可用，显示上次成功的应用列表' : '读取失败，保留当前应用列表';
    setStatus(msg, true);
    if (!quiet) toast(`${msg}（${err.message}）`);
    return false;
  }
}

function updateClock() {
  const d = new Date();
  $('clockTime').textContent = d.toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  $('clockDate').textContent = d.toLocaleDateString('zh-TW', { year: 'numeric', month: 'long', day: 'numeric', weekday: 'short' });
}

// ---- 初始化 ----
$('emptyRefresh').addEventListener('click', () => loadConfig());
window.addEventListener('online', () => loadConfig({ quiet: true }));
window.addEventListener('focus', () => loadConfig({ quiet: true }));
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadConfig({ quiet: true }); });
$('buildText').textContent = BUILD;

let resizeTimeout;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimeout);
  resizeTimeout = setTimeout(() => {
    const oldPage = currentPage;
    render();
    const newPageSize = getPageSize();
    if (newPageSize !== pageSize) {
      currentPage = Math.min(oldPage, totalPages - 1);
      scrollToPage(currentPage, false);
    }
  }, 200);
});

updateClock();
setInterval(updateClock, 1000);
loadConfig();
setInterval(() => { if (!document.hidden) loadConfig({ quiet: true }); }, 60000);

document.addEventListener('contextmenu', (e) => {
  if (isDragging) e.preventDefault();
});

if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
}
})();
</script>
